  // Pulls every field off the job-form into a plain object, the same way
  // every time — shared by the real submit (below) and "Save as draft" (see
  // onSaveDraft) so the two can never quietly drift apart on what a field is
  // called or how it's read off the DOM.
  function readJobFormFields(f){
    var jobStatusOn = root.querySelector('#job-form [data-seg="completed"] .on');
    var jobStatusVal = jobStatusOn ? jobStatusOn.getAttribute("data-val") : "no";
    var completed = jobStatusVal === "yes";
    var crewDone = jobStatusVal === "mine";
    var othersOn = root.querySelector('#job-form [data-seg="othersBefore"] .on');
    var alsoOnsiteOn = root.querySelector('#job-form [data-seg="alsoOnsiteMode"] .on');
    var alsoOnsiteMode = alsoOnsiteOn ? alsoOnsiteOn.getAttribute("data-val") : "";
    // Only present in the form for management (see renderJobForm) — never
    // read or written for a crew submission, so editing/drafting your own
    // entry never wipes out a cost Grace already filled in.
    var materialsCost = null;
    if (f.materialsCost){
      var materialsCostRaw = f.materialsCost.value.trim();
      if (materialsCostRaw){
        var mcNum = parseFloat(materialsCostRaw);
        materialsCost = isNaN(mcNum) ? null : mcNum;
      }
    }
    var fields = {
      jobDescription: f.jobDescription.value.trim(),
      date: f.date.value,
      // Swap a decimal comma for a point (e.g. "2,5" -> "2.5") so it's stored
      // the way it displays and totals everywhere else — not just when summed.
      hours: f.hours.value.trim().replace(",", "."),
      timeRange: f.timeRange ? f.timeRange.value.trim() : "",
      jobStatusVal: jobStatusVal, completed: completed, crewDone: crewDone,
      othersBefore: othersOn ? othersOn.getAttribute("data-val") === "yes" : false,
      alsoOnsiteMode: alsoOnsiteMode,
      alsoOnsite: (alsoOnsiteMode === "alone") ? ALONE_TEXT : (f.alsoOnsite ? f.alsoOnsite.value.trim() : ""),
      materials: f.materials.value.trim(),
      hasMaterialsCostField: !!f.materialsCost,
      materialsCost: materialsCost,
      // Estimated return / Work still to do only apply to "Not finished" —
      // for "Completed" or "My part's done" those fields are hidden in the
      // form, so ignore whatever's left over in them from an earlier status.
      estimatedReturn: (jobStatusVal === "no" && f.estimatedReturn) ? f.estimatedReturn.value : "",
      returnUnsure: (jobStatusVal === "no" && f.returnUnsure) ? f.returnUnsure.value === "1" : false,
      remainingWork: (jobStatusVal === "no" && f.remainingWork) ? f.remainingWork.value.trim() : "",
      handoffTo: f.handoffTo ? f.handoffTo.value.trim() : "",
      handoffUnsure: f.handoffUnsure ? f.handoffUnsure.value === "1" : false,
    };
    if (f.venue) fields.venue = f.venue.value.trim();
    var clientSegOn = root.querySelector('#job-form [data-seg="client"] .on');
    fields.client = clientSegOn ? clientSegOn.getAttribute("data-val") : "";
    return fields;
  }

  function onSubmitJobForm(e){
    e.preventDefault();
    if (!db) return;
    var f = e.target;
    var mode = f.getAttribute("data-mode");
    var fl = readJobFormFields(f);
    var jobDescription = fl.jobDescription, date = fl.date, hours = fl.hours, timeRange = fl.timeRange;
    var jobStatusVal = fl.jobStatusVal, completed = fl.completed, crewDone = fl.crewDone;
    var othersBefore = fl.othersBefore, alsoOnsiteMode = fl.alsoOnsiteMode, alsoOnsite = fl.alsoOnsite;
    var materials = fl.materials, materialsCost = fl.materialsCost;
    var estimatedReturn = fl.estimatedReturn, returnUnsure = fl.returnUnsure, remainingWork = fl.remainingWork;
    var handoffTo = fl.handoffTo, handoffUnsure = fl.handoffUnsure;
    var employees = [state.session.name];

    if (!jobDescription || !date || !hours){
      state.formMsg = {type:"error", text:"Please fill in the job description, date and hours."};
      render(); return;
    }
    if (alsoOnsiteMode !== "alone" && !alsoOnsite){
      state.formMsg = {type:"error", text:"Let us know who else was onsite, or tap “By myself — no one else”."};
      render(); return;
    }

    state.formBusy = true; render();
    // recomputeJobOpen now lives at top level (shared with trashLog/restoreLog)

    function afterLog(jobId, venue){
      var logBody = {
        jobId: jobId, venue: venue, date: date, hours: hours, timeRange: timeRange, jobDescription: jobDescription,
        materials: materials, completed: completed, alsoOnsite: alsoOnsite, othersBefore: othersBefore,
        estimatedReturn: completed ? "" : estimatedReturn, returnUnsure: completed ? false : returnUnsure,
        remainingWork: completed ? "" : remainingWork,
        crewDone: crewDone, handoffTo: crewDone && !handoffUnsure ? handoffTo : "", handoffUnsure: crewDone ? handoffUnsure : false,
        employees: employees, submittedBy: state.session.name, submittedAt: new Date().toISOString(),
      };
      if (fl.hasMaterialsCostField) logBody.materialsCost = materialsCost;
      return db.collection("job-logs").add(logBody).then(function(){
        // Keep the job's assignedEmployees up to date with everyone who's actually
        // logged a visit to it (not just whoever created it) — arrayUnion so this
        // never duplicates or overwrites earlier names.
        return db.collection("jobs").doc(jobId).update({
          open: !completed, lastUpdatedAt: new Date().toISOString(),
          assignedEmployees: firebase.firestore.FieldValue.arrayUnion(state.session.name)
        });
      });
    }

    var p;
    if (mode === "new"){
      var venue = fl.venue;
      if (!venue){ state.formBusy=false; state.formMsg={type:"error", text:"Add the venue / job site."}; render(); return; }
      var client = fl.client;
      p = db.collection("jobs").add({
        venue: venue, jobDescription: jobDescription, client: client,
        assignedEmployees: employees, status: "in-process", open: true,
        createdBy: state.session.name, createdAt: new Date().toISOString(),
      }).then(function(ref){ return afterLog(ref.id, venue); });
    } else if (mode === "edit"){
      var editLogId = f.getAttribute("data-log-id");
      var editJobId = f.getAttribute("data-job-id");
      var patch = {
        date: date, hours: hours, timeRange: timeRange, jobDescription: jobDescription, materials: materials, completed: completed, alsoOnsite: alsoOnsite, othersBefore: othersBefore,
        estimatedReturn: completed ? "" : estimatedReturn, returnUnsure: completed ? false : returnUnsure,
        remainingWork: completed ? "" : remainingWork,
        crewDone: crewDone, handoffTo: crewDone && !handoffUnsure ? handoffTo : "", handoffUnsure: crewDone ? handoffUnsure : false,
        editedBy: state.session.name, editedAt: new Date().toISOString(),
      };
      if (fl.hasMaterialsCostField) patch.materialsCost = materialsCost;
      p = db.collection("job-logs").doc(editLogId).update(patch).then(function(){ return recomputeJobOpen(editJobId); });
    } else {
      var jobId = f.getAttribute("data-job-id");
      var job = state.jobs.filter(function(j){return j.id===jobId;})[0];
      p = afterLog(jobId, job ? job.venue : "");
    }

    p.then(function(){
      state.formBusy = false; state.logView = "list"; state.updateJobId = null; state.editLogId = null;
      // This job sheet started life as a saved draft — now that it's been
      // submitted for real, the draft copy is done serving its purpose.
      if (state.continuingDraftId){ discardDraft(state.session.name, state.continuingDraftId); state.continuingDraftId = null; }
      toast(mode === "edit" ? "Changes saved" : "Job sheet sent");
      render();
    }).catch(function(err){
      state.formBusy = false;
      state.formMsg = {type:"error", text:"Couldn't save that (" + (err && err.code || "error") + "). Try again."};
      render();
    });
  }

  // "Save as draft" — a type="button" click, not a form submit, so none of
  // the form's "required" fields block it: a draft can be as half-finished
  // as it needs to be. Goes to localStorage only (see draftsKey/saveDrafts
  // above), never anywhere near Firestore, so management never sees it.
  function onSaveDraft(){
    var f = document.getElementById("job-form");
    if (!f) return;
    var mode = f.getAttribute("data-mode");
    var fl = readJobFormFields(f);
    var hasContent = fl.jobDescription || fl.hours || fl.timeRange || fl.materials ||
      fl.alsoOnsiteMode === "alone" || fl.alsoOnsite || (mode === "new" && fl.venue);
    if (!hasContent){
      state.formMsg = {type:"error", text:"Nothing to save yet — fill something in first."};
      render(); return;
    }
    var me = state.session.name;
    var draft = Object.assign({}, fl, {
      mode: mode,
      jobId: f.getAttribute("data-job-id") || null,
      id: state.continuingDraftId || ("draft-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8)),
      savedAt: new Date().toISOString(),
    });
    var drafts = loadDrafts(me);
    if (state.continuingDraftId){
      drafts = drafts.map(function(d){ return d.id === draft.id ? draft : d; });
    } else {
      drafts.unshift(draft);
    }
    saveDrafts(me, drafts);
    state.continuingDraftId = null;
    state.logView = "list"; state.updateJobId = null; state.editLogId = null; state.formMsg = null;
    toast("Saved as a draft");
    render();
  }

  function onSubmitCrew(e){

    var f = e.target;
    var name = f.name.value.trim();
    var email = f.email.value.trim();
    if (!name || !email) return;
    // Names are how jobs/logs actually identify people (there's no separate
    // ID used for that) — two crew members with the same name would quietly
    // mix up each other's hours and job history, so this is a hard stop.
    var clash = state.crew.some(function(c){ return c.name.trim().toLowerCase() === name.toLowerCase(); });
    if (clash){
      state.crewFormError = "There's already a crew member named \""+name+"\". Use a last initial to tell them apart, e.g. \""+name+" B\".";
      render();
      return;
    }
    state.crewFormError = "";
    db.collection("crew").add({name:name, email:email, role:state.crewRole, active:true, createdAt:new Date().toISOString()})
      .then(function(){ state.crewFormOpen=false; toast(name+" added — they'll set their PIN on first login"); render(); })

  // Renaming a crew member (see onSubmitEditCrew above) never touches
  // anything already logged under their old name — this is the actual
  // clean-up for that: it finds every job visit, job assignment and leave
  // day filed under oldName and moves it onto newName, so timesheets and
  // job history read as one person again. Returns how many records changed.
  function mergeCrewName(oldName, newName){
    if (!db || !oldName || !newName || oldName === newName) return Promise.resolve(0);
    return Promise.all([
      db.collection("job-logs").where("submittedBy","==",oldName).get(),
      db.collection("job-logs").where("editedBy","==",oldName).get(),
      db.collection("job-logs").where("employees","array-contains",oldName).get(),
      db.collection("leave-logs").where("employee","==",oldName).get(),
      db.collection("jobs").where("assignedEmployees","array-contains",oldName).get(),
      db.collection("jobs").where("createdBy","==",oldName).get(),
    ]).then(function(snaps){
      var submittedBySnap = snaps[0], editedBySnap = snaps[1], employeesSnap = snaps[2],
          leaveSnap = snaps[3], assignedSnap = snaps[4], createdBySnap = snaps[5];

      // Firestore refuses a batch with more than one write to the same
      // document, and the same job-log can easily match more than one of
      // the queries above (e.g. submittedBy AND employees both matching) —
      // so every field change for a given document is merged into one
      // patch here before anything is written.
      var patchMap = {};
      function addPatch(ref, patch){
        var key = ref.path;
        if (!patchMap[key]) patchMap[key] = {ref: ref, patch: {}};
        Object.assign(patchMap[key].patch, patch);
      }
      submittedBySnap.forEach(function(d){ addPatch(d.ref, {submittedBy: newName}); });
      editedBySnap.forEach(function(d){ addPatch(d.ref, {editedBy: newName}); });
      employeesSnap.forEach(function(d){
        var employees = (d.data().employees || []).map(function(n){ return n === oldName ? newName : n; });
        addPatch(d.ref, {employees: employees});
      });
      leaveSnap.forEach(function(d){ addPatch(d.ref, {employee: newName}); });
      assignedSnap.forEach(function(d){
        var assigned = (d.data().assignedEmployees || []).map(function(n){ return n === oldName ? newName : n; });
        addPatch(d.ref, {assignedEmployees: assigned});
      });
      createdBySnap.forEach(function(d){ addPatch(d.ref, {createdBy: newName}); });

      var ops = Object.keys(patchMap).map(function(k){ return patchMap[k]; });
      if (!ops.length) return 0;

      // Batches cap at 500 writes — chunk well under that so this still
      // works cleanly for a much bigger crew down the track.
      var chunks = [];
      for (var i=0; i<ops.length; i+=400){ chunks.push(ops.slice(i, i+400)); }
      return chunks.reduce(function(chain, group){
        return chain.then(function(){
          var batch = db.batch();
          group.forEach(function(o){ batch.update(o.ref, o.patch); });
          return batch.commit();
        });
      }, Promise.resolve()).then(function(){ return ops.length; });
    });
  }

  function toggleCrewActive(id){
    if (!db) return;
    var c = state.crew.filter(function(x){return x.id===id;})[0];
    if (!c) return;
    db.collection("crew").doc(id).update({active: c.active===false}).catch(function(){ toast("Couldn't update crew — manager access needed."); });
  }

  function resetPin(id){
    if (!db) return;
    db.collection("logins").doc(id).delete()
      .then(function(){ toast("PIN cleared — they'll set a new one next login."); })
      .catch(function(){ toast("Couldn't reset PIN."); });
  }

  function setJobStatus(jobId, status){
    if (!db) return;
    // Stamp when a job is marked Invoiced — the Invoiced tab sorts on this —
    // and clear it if the status is ever changed away from Invoiced again.
    var patch = {status: status, invoicedAt: (status === "invoiced") ? new Date().toISOString() : null};
    db.collection("jobs").doc(jobId).update(patch).catch(function(){ toast("Couldn't update status."); });
  }

  // Quick inline materials-cost entry on a single visit — a lighter path
  // than opening "Edit this entry" just to fill in one field.
  function quickSetMaterialsCost(logId, rawValue){
    if (!db || !logId) return;
    var trimmed = (rawValue || "").trim();
    var patch;
    if (trimmed === ""){
      patch = { materialsCost: null };
    } else {
      var num = parseFloat(trimmed);
      if (isNaN(num) || num < 0){ toast("Enter a valid amount, e.g. 84.50."); return; }
      patch = { materialsCost: Math.round(num * 100) / 100 };
    }
    db.collection("job-logs").doc(logId).update(patch)
      .then(function(){ state.editingLogMaterialsCostId = null; toast("Materials cost saved"); render(); })
      .catch(function(){ toast("Couldn't save that — try again."); });
  }

  function toggleNeedsPricing(jobId){
    if (!db) return;
    var j = state.jobs.filter(function(x){ return x.id===jobId; })[0];
    if (!j) return;
    db.collection("jobs").doc(jobId).update({needsPricing: !j.needsPricing})
      .then(function(){ toast(j.needsPricing ? "Removed from Drew's queue" : "Sent to Drew for pricing"); })
      .catch(function(){ toast("Couldn't update that."); });
  }

  function onSubmitJobDetails(e){
    e.preventDefault();
    if (!db) return;
    var f = e.target;
    var jobId = f.getAttribute("data-job-id");
    var venue = f.venue.value.trim();
    var jobDescription = f.jobDescription.value.trim();
    if (!venue || !jobDescription) return;
    var patch = {venue: venue, jobDescription: jobDescription};
    var clientOn = f.querySelector('[data-seg="editClient"] .on');
    if (clientOn) patch.client = clientOn.getAttribute("data-val");
    if (f.vtask) patch.vtask = f.vtask.value.trim();
    if (f.poNumber) patch.poNumber = f.poNumber.value.trim();
    if (f.invoiceAmount){
      var amt = f.invoiceAmount.value.trim();
      var parsedAmt = parseFloat(amt);
      patch.invoiceAmount = (amt === "" || isNaN(parsedAmt)) ? null : Math.round(parsedAmt * 100) / 100;
      // Stamp when a price first lands on the job — this is what lets the
      // Priced tab show "waiting X days", the actual clock Grace wants on
      // unbilled jobs. Only stamped on the transition from no price to a
      // price, and cleared if the price is removed, so it always reflects
      // how long the CURRENT price has been sitting there.
      var jobBefore = state.jobs.filter(function(x){ return x.id===jobId; })[0];
      var hadAmount = jobBefore && jobBefore.invoiceAmount != null && jobBefore.invoiceAmount !== "";
      var hasAmount = patch.invoiceAmount != null;
      if (hasAmount && !hadAmount) patch.pricedAt = new Date().toISOString();
      else if (!hasAmount) patch.pricedAt = null;
    }
    if (f.comments) patch.comments = f.comments.value.trim();
    db.collection("jobs").doc(jobId).update(patch).then(function(){
      state.editingJobId = null; toast("Job details updated"); render();
    }).catch(function(){ toast("Couldn't save those details."); });
  }

  // ---------- boot ----------
  var firebaseConfig = {
    apiKey: "AIzaSyCjvoVYtyC4eXMGdWGe4xMq7Ot0IcCqyic",
    authDomain: "hydraciv-crew.firebaseapp.com",
    projectId: "hydraciv-crew",
    storageBucket: "hydraciv-crew.firebasestorage.app",
    messagingSenderId: "246283036612",
    appId: "1:246283036612:web:ac7ef45aced2b43c50a691"
  };

  render();

  // Lets a crew member keep filling in job sheets with no signal on site —
  // Firestore queues writes locally (IndexedDB) and sends them automatically
  // once back in range, even if the tab was closed and reopened in between.
  // If this fails (older browser, private-browsing mode, etc.) the app just
  // carries on without offline support, same as before.
  window.addEventListener("online", function(){ state.isOffline = false; render(); });
  window.addEventListener("offline", function(){ state.isOffline = true; render(); });

  (function(){
    try{
      firebase.initializeApp(firebaseConfig);
    }catch(e){ dbStatus = "unavailable"; render(); return; }

    try{
      firebase.firestore().enablePersistence({synchronizeTabs: true}).catch(function(){ /* unsupported browser or already open elsewhere — fine, just no offline cache */ });
    }catch(e){}

    firebase.auth().signInAnonymously().then(function(){
      db = firebase.firestore();
      try{ storage = firebase.storage(); }catch(e){ /* Storage not enabled on this project yet — scheduling photos just won't upload until it is */ }
      dbStatus = "ready";

      // Any of these failing after the initial connect (e.g. a dropped
      // network mid-session) used to fail completely silently — now it
      // flips a small visible "sync trouble" indicator instead of just
      // quietly going stale.
      function onListenerError(){ state.syncError = true; render(); }

      db.collection("crew").orderBy("createdAt","asc").onSnapshot(function(snap){
        state.crew = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
        state.syncError = false;
        crewLoaded = true;
        render();
      }, onListenerError);

      db.collection("logins").onSnapshot(function(snap){
        state.logins = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
        render();
      }, onListenerError);

      db.collection("jobs").orderBy("createdAt","desc").limit(500).onSnapshot(function(snap){
        state.jobs = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
        render();
      }, onListenerError);

      db.collection("job-logs").orderBy("submittedAt","desc").limit(1000).onSnapshot(function(snap){
        state.jobLogs = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
        render();
      }, onListenerError);

      db.collection("leave-logs").orderBy("createdAt","desc").limit(1000).onSnapshot(function(snap){
        state.leaveLogs = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
        render();
      }, onListenerError);

      db.collection("subcontractor-jobs").orderBy("createdAt","desc").limit(1000).onSnapshot(function(snap){
        state.subcontractorJobs = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
        render();
      }, onListenerError);

      db.collection("materials").orderBy("createdAt","desc").limit(1000).onSnapshot(function(snap){
        state.materials = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
        render();
      }, onListenerError);

      db.collection("schedule").orderBy("createdAt","desc").limit(1000).onSnapshot(function(snap){
        state.schedule = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
        render();
      }, onListenerError);

      render();
    }).catch(function(err){
      dbStatus = "unavailable";
      render();
    });
  })();
})();
</script>
