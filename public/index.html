<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Hydraciv Crew Portal</title>

<!-- Home-screen / PWA icon setup so "Add to Home Screen" looks like a real app -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#123f5c">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hydraciv Crew">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --ground:#eef2f2; --surface:#ffffff; --surface-2:#e2e9eb; --surface-3:#d7e0e2;
    --ink:#16222b; --ink-soft:#55676f; --ink-faint:#7d8d94; --line:#ccd7da;
    --accent:#1c5c86; --accent-strong:#123f5c; --accent-soft:#e1edf3; --accent-ink:#ffffff;
    --amber:#f4b400; --amber-soft:#fdf0cc; --amber-ink:#2a1503;
    --success:#2f8f5b; --success-soft:#e3f3ea;
    --warning:#b5791c; --warning-soft:#faedd6; --warning-ink:#5a3d0f;
    --danger:#b3453a; --danger-soft:#f7e4e1;
    --violet:#6a4fa0; --violet-soft:#ece6f5;
    --focus:#1c5c86;
    --shadow: 0 1px 2px rgba(20,30,36,.06), 0 6px 20px -8px rgba(20,30,36,.18);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0e151b; --surface:#161f27; --surface-2:#1d2831; --surface-3:#25313b;
      --ink:#e7edef; --ink-soft:#a3b3ba; --ink-faint:#7c8d95; --line:#2b3a44;
      --accent:#72b4de; --accent-strong:#9fd1ee; --accent-soft:#1c3a4a; --accent-ink:#062231;
      --amber:#ffd54f; --amber-soft:#3a2a06; --amber-ink:#2a1503;
      --success:#72cd99; --success-soft:#17301f;
      --warning:#f0b95a; --warning-soft:#332708; --warning-ink:#f0b95a;
      --danger:#e6968b; --danger-soft:#3a1f1c;
      --violet:#b7a3dd; --violet-soft:#2a2440;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -10px rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --ground:#0e151b; --surface:#161f27; --surface-2:#1d2831; --surface-3:#25313b;
    --ink:#e7edef; --ink-soft:#a3b3ba; --ink-faint:#7c8d95; --line:#2b3a44;
    --accent:#72b4de; --accent-strong:#9fd1ee; --accent-soft:#1c3a4a; --accent-ink:#062231;
    --amber:#ffd54f; --amber-soft:#3a2a06; --amber-ink:#2a1503;
    --success:#72cd99; --success-soft:#17301f;
    --warning:#f0b95a; --warning-soft:#332708; --warning-ink:#f0b95a;
    --danger:#e6968b; --danger-soft:#3a1f1c;
    --violet:#b7a3dd; --violet-soft:#2a2440;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -10px rgba(0,0,0,.6);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{background:var(--ground);}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:"IBM Plex Sans", system-ui, sans-serif;
    font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:"Big Shoulders Display","IBM Plex Sans",sans-serif; text-wrap:balance; margin:0; letter-spacing:.01em;}
  .mono{font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums;}
  a{color:inherit;}
  button{font-family:inherit; font-size:inherit;}
  input,textarea,select{font-family:inherit; font-size:16px; color:var(--ink); background:var(--surface);}
  ::selection{background:var(--accent-soft);}
  :focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

  .app{max-width:900px; margin:0 auto; padding-bottom:64px;}

  /* header */
  .hero{
    position:relative; overflow:hidden; background:var(--accent-strong); color:#eef6fb;
    padding:22px 18px 0; border-top:4px solid var(--amber);
  }
  .hero::before{
    content:""; position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,.055) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.055) 0 1px, transparent 1px 28px);
    opacity:.5; pointer-events:none;
  }
  .hero-top{position:relative; display:flex; align-items:flex-start; justify-content:space-between; gap:12px;}
  .eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--amber); margin:0 0 6px;}
  .hero h1{font-size:34px; font-weight:800; color:#fff;}
  .hero p.sub{margin:6px 0 0; color:#cfe6f4; font-size:13.5px; max-width:34ch;}
  .who{position:relative; text-align:right; flex-shrink:0;}
  .who .name{font-weight:600; font-size:13.5px; color:#fff;}
  .who .role{font-size:10.5px; color:#9fcbe3; text-transform:uppercase; letter-spacing:.06em;}
  .who-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:2px;}
  .who button{
    background:none; border:none; color:#bcdcef; font-size:12px; text-decoration:underline;
    text-underline-offset:2px; cursor:pointer; padding:2px 0;
  }
  .sync-dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:#7fd9a8; margin-right:5px; vertical-align:1px;}
  .sync-note{position:relative; font-size:11px; color:#a9c9dc; padding:10px 0 12px; display:flex; align-items:center;}

  /* tabs */
  .tabbar{position:relative; display:flex; gap:2px; padding-top:6px;}
  .tabbar button{
    background:none; border:none; color:#cfe6f4; padding:10px 16px 12px; cursor:pointer;
    font-weight:600; font-size:14px; border-bottom:3px solid transparent; opacity:.72;
  }
  .tabbar button.active{opacity:1; color:#fff; border-bottom-color:var(--amber);}

  main{padding:18px 16px 0;}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px; box-shadow:var(--shadow);}
  .card + .card{margin-top:14px;}
  .section-title{font-size:20px; font-weight:700; margin-bottom:2px;}
  .section-sub{color:var(--ink-soft); font-size:13px; margin:0 0 14px;}

  .field{display:flex; flex-direction:column; gap:6px; margin-bottom:16px;}
  .field label{font-size:12.5px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;}
  .field input[type="text"], .field input[type="number"], .field input[type="date"], .field input[type="password"], .field input[type="tel"],
  .field textarea, .field select{
    border:1px solid var(--line); background:var(--surface); border-radius:9px; padding:11px 12px; color:var(--ink); width:100%;
  }
  .field textarea{min-height:74px; resize:vertical; font-family:inherit;}
  .hint{font-size:12px; color:var(--ink-faint); margin-top:2px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:520px){.row2{grid-template-columns:1fr;}}

  .autocomplete-wrap{position:relative;}
  .autocomplete-list{position:absolute; z-index:30; top:100%; left:0; right:0; margin-top:5px; background:var(--surface); border:1px solid var(--line); border-radius:9px; box-shadow:var(--shadow); max-height:230px; overflow-y:auto;}
  .autocomplete-list button{display:block; width:100%; text-align:left; background:none; border:none; border-bottom:1px solid var(--line); padding:11px 12px; font-size:14px; color:var(--ink); cursor:pointer;}
  .autocomplete-list button:last-child{border-bottom:none;}
  .autocomplete-list button:hover, .autocomplete-list button:focus{background:var(--surface-2);}

  .seg{display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; flex-wrap:wrap;}
  .seg button{
    flex:1; background:var(--surface); border:none; padding:10px 8px; cursor:pointer;
    color:var(--ink-soft); font-weight:600; font-size:13px; border-right:1px solid var(--line); min-width:80px;
  }
  .seg button:last-child{border-right:none;}
  .seg button.on{background:var(--accent); color:var(--accent-ink);}

  .status-select{border:1px solid var(--line); border-radius:999px; padding:5px 10px; font-size:12px; font-weight:700; color:var(--ink); background:var(--surface); cursor:pointer;}

  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:8px 14px; cursor:pointer; font-size:13.5px; font-weight:500; color:var(--ink-soft);}
  .chip.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-strong); font-weight:600;}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:10px; padding:13px 18px; font-weight:700; font-size:14.5px; cursor:pointer; border:1px solid transparent; min-height:48px;}
  .btn-primary{background:var(--amber); color:var(--amber-ink);}
  .btn-primary:hover{filter:brightness(1.04);}
  .btn-outline{background:transparent; border-color:var(--line); color:var(--ink);}
  .btn-ghost{background:transparent; border-color:transparent; color:var(--accent-strong); padding:8px 10px; min-height:auto;}
  .btn-sm{padding:8px 12px; min-height:36px; font-size:13px;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn-block{width:100%;}

  .msg{border-radius:9px; padding:10px 12px; font-size:13.5px; margin-bottom:14px;}
  .msg-error{background:var(--danger-soft); color:var(--danger);}
  .msg-success{background:var(--success-soft); color:var(--success);}
  .msg-info{background:var(--accent-soft); color:var(--accent-strong);}

  .pill{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:4px 9px; border-radius:999px; letter-spacing:.02em;}
  .pill-success{background:var(--success-soft); color:var(--success);}
  .pill-warning{background:var(--warning-soft); color:var(--warning);}
  .pill-neutral{background:var(--surface-2); color:var(--ink-soft);}
  .pill-accent{background:var(--accent-soft); color:var(--accent-strong);}
  .pill-violet{background:var(--violet-soft); color:var(--violet);}
  .pill-ink{background:var(--ink); color:var(--ground);}

  .picker-list{display:flex; flex-direction:column; gap:8px;}
  .picker-btn{text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:13px 14px; font-weight:600; cursor:pointer; color:var(--ink); font-size:15px;}
  .picker-btn:hover{border-color:var(--accent);}
  .picker-btn.sel{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-strong);}
  .login-pin-drop{background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:14px; margin:-2px 0 2px;}

  .pin-dots{display:flex; gap:10px; justify-content:center; margin:6px 0 4px;}
  .pin-input{width:100%; text-align:center; font-family:"IBM Plex Mono",monospace; font-size:26px; letter-spacing:.5em; padding:12px !important;}

  .log-card{border:1px solid var(--line); border-radius:10px; padding:13px 14px; background:var(--surface);}
  .log-card + .log-card{margin-top:10px;}
  .log-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .log-venue{font-weight:700; font-size:15px;}
  .log-desc{font-size:13px; color:var(--ink-soft); margin-top:1px;}
  .log-meta{color:var(--ink-soft); font-size:12.5px; margin-top:3px;}
  .log-body{margin-top:8px; font-size:13.5px; color:var(--ink);}
  .log-foot{margin-top:9px; display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
  .log-followup{margin-top:8px; background:var(--warning-soft); color:var(--warning-ink); border-radius:8px; padding:8px 10px; font-size:13px;}

  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  @media (max-width:640px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
  .stat-tile{background:var(--surface-2); border-radius:10px; padding:12px 14px;}
  .stat-tile .num{font-family:"Big Shoulders Display"; font-size:28px; font-weight:800; line-height:1;}
  .stat-tile .label{font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-top:4px;}

  /* Compact job-detail visit summary — a slim strip instead of the old big
     grey stat-grid card, used only on the job detail view. */
  .stat-strip{display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  .stat-strip .cell{flex:1; padding:9px 10px; text-align:center; border-right:1px solid var(--line);}
  .stat-strip .cell:last-child{border-right:none;}
  .stat-strip .num{font-family:"Big Shoulders Display"; font-size:18px; font-weight:800; line-height:1;}
  .stat-strip .label{font-size:9.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-faint); margin-top:3px;}

  /* One compact line per logged visit, with a status dot instead of a
     repeated pill on every row, and a kebab that reveals edit/delete
     instead of showing them all the time. */
  .visit-row{padding:7px 0; border-top:1px dashed var(--line);}
  .visit-row:first-child{border-top:none;}
  .visit-row .vr-line1{display:flex; align-items:flex-start; gap:8px;}
  .visit-row .vr-dot{width:8px; height:8px; border-radius:50%; margin-top:5px; flex:none;}
  .visit-row .vr-body{flex:1; min-width:0; font-size:13px;}
  .visit-row .vr-sub{font-size:12px; color:var(--ink-faint); margin-top:2px;}
  .visit-row .vr-kebab{background:none; border:none; color:var(--ink-faint); font-size:16px; cursor:pointer; padding:0 4px; flex:none; line-height:1;}
  .visit-row .vr-actions{margin-top:6px; padding-left:16px; display:flex; gap:14px;}

  .bar-row{display:grid; grid-template-columns:110px 1fr 52px; align-items:center; gap:10px; margin-bottom:8px;}
  .bar-name{font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bar-track{background:var(--surface-2); border-radius:6px; height:10px; overflow:hidden;}
  .bar-fill{background:var(--accent); height:100%; border-radius:6px;}
  .bar-val{font-size:12.5px; text-align:right; color:var(--ink-soft);}

  .subtabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px;}
  .subtabs button{background:var(--surface-2); border:1px solid transparent; border-radius:8px; padding:8px 13px; font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer;}
  .subtabs button.on{background:var(--accent); color:var(--accent-ink);}

  .weeknav{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px;}
  .weeknav .label{font-weight:700; font-size:14.5px;}
  .weeknav button{background:var(--surface-2); border:none; border-radius:8px; width:34px; height:34px; cursor:pointer; font-size:16px; color:var(--ink);}

  .day-heading{font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); margin:16px 0 8px;}
  .day-heading:first-child{margin-top:0;}

  .empty-note{color:var(--ink-soft); font-size:13.5px; padding:14px 2px;}

  .crew-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); gap:10px;}
  .crew-row:last-child{border-bottom:none;}
  .crew-row .info .name{font-weight:600;}
  .crew-row .info .email{font-size:12px; color:var(--ink-soft);}

  .job-card{border:1px solid var(--line); border-radius:10px; padding:14px 15px; background:var(--surface-3); box-shadow:var(--shadow);}
  .job-card + .job-card{margin-top:10px;}
  .job-card-tap{cursor:pointer; transition:box-shadow .12s ease, border-color .12s ease, transform .12s ease;}
  .job-card-tap:hover{border-color:var(--accent); box-shadow:0 2px 10px -2px rgba(20,30,36,.22); transform:translateY(-1px);}
  .job-card-cta{margin-top:9px; padding-top:9px; border-top:1px dashed var(--line); font-size:13px; font-weight:700; color:var(--accent-strong); display:flex; align-items:center; gap:5px;}
  .job-card-tap:hover .job-card-cta{color:var(--accent);}
  .job-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .job-num{font-family:"IBM Plex Mono"; font-weight:600; font-size:12.5px; color:var(--accent-strong);}
  .timeline{margin-top:10px; padding-top:10px; border-top:1px solid var(--line);}
  .timeline-item{padding:8px 0; border-bottom:1px dashed var(--line); font-size:13px;}
  .timeline-item:last-child{border-bottom:none;}

  .footer-note{text-align:center; color:var(--ink-faint); font-size:12px; padding:22px 18px 8px;}

  .toast{position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--ink); color:var(--ground); padding:11px 18px; border-radius:999px; font-size:13.5px; font-weight:600; box-shadow:var(--shadow); z-index:50;}
  :root[data-theme="dark"] .toast, :root:not([data-theme="light"]) .toast{background:var(--surface-3); color:var(--ink);}

  .center-card{max-width:420px; margin:0 auto;}

  /* ---------- Printing: weekly timesheets & individual jobs ---------- */
  #print-area{display:none;}
  @media print{
    body.printing > *:not(#print-area){display:none !important;}
    #print-area{display:block !important;}
    @page{margin:1.5cm;}
  }
  #print-area{font-family:"Segoe UI",-apple-system,Roboto,sans-serif; color:#16222b; max-width:720px; margin:0 auto; padding:20px;}
  #print-area .p-head{border-bottom:2px solid #123f5c; padding-bottom:12px; margin-bottom:16px;}
  #print-area .p-head h1{margin:0 0 4px; font-size:21px; color:#123f5c;}
  #print-area .p-sub{font-size:13.5px; color:#55676f;}
  #print-area .p-meta{font-size:12.5px; color:#55676f; margin-top:4px;}
  #print-area .p-row{display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid #e2e9eb; font-size:13.5px;}
  #print-area .p-row:last-child{border-bottom:none;}
  #print-area .p-total{margin-top:16px; text-align:right; font-weight:700; font-size:15px; color:#123f5c;}
  #print-area .p-foot{margin-top:24px; font-size:11.5px; color:#9aa7ac;}
  #print-area .p-flag{color:#b5791c; font-weight:600;}

</style>
</head>
<body>

<div id="root" class="app"></div>
<div id="toast-host"></div>
<div id="print-area"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
(function(){
  "use strict";

  var LS_SESSION = "hydraciv:session";
  var root = document.getElementById("root");
  var toastHost = document.getElementById("toast-host");
  var db = null;
  var dbStatus = "loading"; // loading | ready | unavailable

  // sessionStorage (not localStorage) on purpose — it clears itself when the
  // tab/app is actually closed, so nobody stays signed in to someone else's
  // login just by reopening the app. A reload of the same open tab still
  // keeps you logged in (so an accidental refresh mid-job doesn't boot you).
  function loadSession(){
    try{ localStorage.removeItem(LS_SESSION); }catch(e){} // one-off cleanup of the old always-logged-in behaviour
    try{ var raw = sessionStorage.getItem(LS_SESSION); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
  }
  function saveSession(s){ try{ sessionStorage.setItem(LS_SESSION, JSON.stringify(s)); }catch(e){} }
  function clearSession(){ try{ sessionStorage.removeItem(LS_SESSION); }catch(e){} }

  var state = {
    crew: [], jobs: [], jobLogs: [], logins: [],
    session: loadSession(),
    activeTab: "log", mgmtSub: "overview",
    loginName: "", loginError: "", pinError: "",
    setupError: "",
    logView: "list", updateJobId: null, editLogId: null, editingJobId: null,
    formMsg: null, formBusy: false,
    jobsStatusFilter: "all",
    crewFormOpen: false, crewRole: "employee",
    tsEmployee: null, tsWeekOffset: 0,
    changePinOpen: false, changePinMsg: null,
    byCrewEmployee: null,
    venueQuery: "",
    crewJobsTab: "open",
    viewingJobId: null, jobActionsOpen: false,
    mergeSourceId: null, mergeQuery: "", mergeTargetCandidateId: null,
    unmergeTargetId: null, unmergeSelected: [],
    trashConfirmJobId: null, trashConfirmLeaveId: null, trashConfirmLogId: null,
    openLogActionsId: null,
    syncError: false,
    isOffline: (typeof navigator !== "undefined" && "onLine" in navigator) ? !navigator.onLine : false,
    notifyEmail: "", notifyEmailMsg: null,
    editingCrewId: null, crewFormError: "",
    glossaryOpen: false,
    leaveLogs: [], editLeaveId: null, leaveType: "sick",
    subcontractorJobs: [], subJobBusy: false, subJobMsg: null, trashConfirmSubJobId: null,
  };

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }
  function genPin(){ return String(Math.floor(1000 + Math.random()*9000)); }
  function pad2(n){ return n < 10 ? "0"+n : ""+n; }
  function todayStr(){ var d = new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
  function parseDate(s){ var p = s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function fmtDay(s){ var d = parseDate(s); return d.toLocaleDateString(undefined, {weekday:"short", day:"numeric", month:"short"}); }
  function fmtShort(s){ var d = parseDate(s); return d.toLocaleDateString(undefined, {day:"numeric", month:"short"}); }
  function fmtTime(iso){ try{ return new Date(iso).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); }catch(e){ return ""; } }
  function getMonday(d){ var day=d.getDay(); var diff=(day===0?-6:1-day); return new Date(d.getFullYear(), d.getMonth(), d.getDate()+diff); }
  function dateToStr(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
  function weekBounds(offset){
    var base = new Date(); base = new Date(base.getFullYear(), base.getMonth(), base.getDate()+offset*7);
    var mon = getMonday(base); var sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate()+6);
    return {startStr: dateToStr(mon), endStr: dateToStr(sun)};
  }
  function inRange(d,a,b){ return d>=a && d<=b; }
  // Whole days between an ISO timestamp (fmtTime-style, e.g. lastUpdatedAt) and
  // now — used for "priced 6 days ago" style aging notes. Never negative.
  function daysSince(iso){
    if (!iso) return null;
    var then = new Date(iso).getTime();
    if (isNaN(then)) return null;
    return Math.max(0, Math.floor((Date.now() - then) / 86400000));
  }
  function numHours(v){ var n = parseFloat(v); return isNaN(n) ? 0 : n; }

  // Crew can only edit/delete a visit they logged while its date is still in
  // the current work week — keeps timesheets from shifting after the fact
  // once a week's closed out. Management isn't limited by this.
  function isInCurrentWeek(dateStr){
    var wk = weekBounds(0);
    return inRange(dateStr, wk.startStr, wk.endStr);
  }

  // ---------- Leave (sick / annual / trade school / public holiday / unpaid) — a fixed number
  // of hours per type (0 for unpaid), no job attached ----------
  var LEAVE_TYPES = {
    sick:   { label: "Sick day",          hours: 7.6 },
    annual: { label: "Annual leave",      hours: 7.6 },
    trade:  { label: "Trade school",      hours: 7.6 },
    public: { label: "Public holiday",    hours: 7.6 },
    unpaid: { label: "Leave without pay", hours: 0 },
  };
  function leaveLabel(type){ return (LEAVE_TYPES[type] && LEAVE_TYPES[type].label) || "Leave"; }
  function leaveHours(type){ return (LEAVE_TYPES[type] ? LEAVE_TYPES[type].hours : 0); }

  // Leave entries for one person in one week, reshaped to look like a job-log
  // row (date/hours/venue/completed) so timesheet rendering, print, email and
  // copy can all treat a leave day exactly like a logged job without extra cases.
  function leaveEntriesFor(name, wk){
    return state.leaveLogs
      .filter(function(l){ return l.employee === name && !l.trashed && inRange(l.date, wk.startStr, wk.endStr); })
      .map(function(l){ return { id: l.id, date: l.date, hours: leaveHours(l.type), completed: true, venue: leaveLabel(l.type), isLeave: true, leaveType: l.type }; });
  }
  function weeklyEntriesFor(name, wk){
    var jobEntries = state.jobLogs.filter(function(l){ return !l.trashed && inRange(l.date, wk.startStr, wk.endStr) && l.employees && l.employees.indexOf(name) !== -1; });
    return jobEntries.concat(leaveEntriesFor(name, wk));
  }
  // Everyone who has either a job log or a leave day in the given week —
  // renderTimesheets needs this instead of deriving names from job logs
  // alone, or someone who was only on leave all week wouldn't show up at all.
  function weekEmployeeNames(wk){
    var names = {};
    state.jobLogs.forEach(function(l){ if (!l.trashed && inRange(l.date, wk.startStr, wk.endStr)) (l.employees||[]).forEach(function(n){ names[n]=1; }); });
    state.leaveLogs.forEach(function(l){ if (!l.trashed && inRange(l.date, wk.startStr, wk.endStr)) names[l.employee]=1; });
    return Object.keys(names).sort();
  }
  function statusLabel(s){ return {quoted:"Quoted","in-process":"In process",completed:"Completed",invoiced:"Invoiced"}[s] || "Quoted"; }
  function statusPillClass(s){ return {quoted:"pill-violet","in-process":"pill-accent",completed:"pill-success",invoiced:"pill-ink"}[s] || "pill-violet"; }
  // Small "Completed / My part done / Follow-up" pill for one visit — shared
  // by the timesheet views so a visit where the crew member's own part is
  // done, but the job itself isn't, doesn't just read as a generic Follow-up.
  function logStatusPill(l){
    if (l.completed) return "";
    if (l.crewDone) return ' &middot; <span class="pill" style="padding:2px 7px; background:var(--amber-soft); color:var(--amber-ink);">My part done</span>';
    return ' &middot; <span class="pill pill-warning" style="padding:2px 7px">Follow-up</span>';
  }

  // ---------- Manual "email this to myself" — a job sheet or a weekly timesheet, on demand ----------
  function emailJob(jobId){
    var j = state.jobs.filter(function(x){ return x.id === jobId; })[0];
    if (!j) return;
    if (!emailjsReady){ toast("Email isn't set up yet."); return; }
    var logs = jobLogsFor(j.id).slice().sort(function(a,b){ return (a.date||"").localeCompare(b.date||""); });
    var rowsHtml = logs.map(function(l){
      var hrs = (l.hours!=null && l.hours!=="") ? esc(l.hours) : "?";
      if (l.timeRange) hrs += " (" + esc(l.timeRange) + ")";
      var extraBits = [];
      if (l.materials) extraBits.push("Materials: "+esc(l.materials));
      if (l.alsoOnsite) extraBits.push("Also onsite: "+esc(l.alsoOnsite));
      if (!l.completed && l.remainingWork) extraBits.push("Still to do: "+esc(l.remainingWork));
      return '<tr><td style="padding:6px 10px 6px 0;color:#7d8d94;font-size:11px;text-transform:uppercase;letter-spacing:.04em;vertical-align:top;white-space:nowrap;">'+esc(fmtDay(l.date))+'</td>' +
        '<td style="padding:6px 0;">'+esc(l.submittedBy||"")+' &middot; '+hrs+'h' +

    }).join("");
    var metaLine = [j.client, j.vtask?("VTASK "+j.vtask):"", j.poNumber?("PO "+j.poNumber):""].filter(Boolean).map(esc).join(" &middot; ");
    var bodyHtml = (metaLine ? '<p style="margin:0 0 10px;color:#55676f;font-size:13px;">'+metaLine+'</p>' : '') +
      (j.jobDescription ? '<p style="margin:0 0 14px;">'+esc(j.jobDescription)+'</p>' : '') +
      '<table style="width:100%;border-collapse:collapse;font-size:13.5px;">' + (rowsHtml || '<tr><td style="padding:6px 0;color:#7d8d94;">No updates logged yet.</td></tr>') + '</table>';
    var headerHtml = '<h1 style="margin:0;font-size:22px;font-weight:800;color:#fff;">'+esc(j.venue||"")+'</h1>' +

    }).then(function(){ toast("Emailed to " + getNotifyEmail()); }).catch(function(){ toast("Couldn't send that email — try again."); });
  }

  function emailTimesheetFor(name){
    if (!emailjsReady){ toast("Email isn't set up yet."); return; }
    var wk = weekBounds(state.tsWeekOffset);
    var logs = weeklyEntriesFor(name, wk);
    logs.sort(function(a,b){ return (a.date||"").localeCompare(b.date||""); });
    var total = logs.reduce(function(s,l){ return s+numHours(l.hours); }, 0);
    var rowsHtml = logs.map(function(l){
      var hrs = (l.hours!=null && l.hours!=="") ? esc(l.hours) : "?";
      return '<tr><td style="padding:6px 10px 6px 0;color:#7d8d94;font-size:11px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;">'+esc(fmtDay(l.date))+'</td>' +

      html += '<p class="empty-note">No jobs logged yet.</p>';
    } else if (list.length === 0){
      html += '<p class="empty-note">'+(tab==="completed" ? "Nothing completed yet." : "Nothing outstanding — nice work.")+'</p>';
    } else {
      list.forEach(function(j){ html += renderJobCard(j, {employeeView:true}); });
    }
    html += '</div>';
    html += renderRecentLeaveForMe(me);
    return html;
  }

  // All jobs this person has been on, one card per job (latest status), open/follow-up-needed first.
  // "Done from their own point of view" is based on THEIR latest visit to the
  // job (completed, or they flagged their part done), not the job's overall
  // open/closed state — a job can still be open for whoever's picking it up
  // next while no longer sitting under this person's own Not Finished list.
  function myJobs(me){
    var seenJobs = {}, mine = [];
    state.jobLogs.forEach(function(l){
      if (l.trashed || !l.employees || l.employees.indexOf(me) === -1) return;
      var key = l.jobId || l.id;
      if (seenJobs[key]) return;
      seenJobs[key] = true;
      var job = state.jobs.filter(function(j){ return j.id === key; })[0];
      if (job && !job.trashed && !job.mergedInto) mine.push(Object.assign({}, job, { myDone: !!(l.completed || l.crewDone) }));
    });
    mine.sort(function(a,b){
      var aOpen = !a.myDone, bOpen = !b.myDone;
      if (aOpen !== bOpen) return aOpen ? -1 : 1;
      return (b.lastUpdatedAt||b.createdAt||"").localeCompare(a.lastUpdatedAt||a.createdAt||"");
    });
    return mine;
  }

  function renderJobForm(opts){

    html += field("Anyone else onsite? (optional)", '<input type="text" name="alsoOnsite" value="'+(isEdit?esc(log.alsoOnsite||""):"")+'" placeholder="e.g. Charlotte, Bob">');

    html += field("Materials used", '<textarea name="materials" placeholder="e.g. 2x 25mm ball valves, 10m copper pipe">'+(isEdit?esc(log.materials||""):"")+'</textarea>');
    // Management-only — crew just note who supplied the materials (e.g.
    // "Reece", "Pro"); Grace fills in what it actually cost once she has the

    html += '</div>';

    html += '<button type="submit" class="btn btn-primary btn-block" '+(state.formBusy?"disabled":"")+'>'+(state.formBusy?"Sending…":(isEdit?"Save changes":"Submit job sheet"))+'</button>';

  function renderEditLogView(){
    var log = state.jobLogs.filter(function(l){ return l.id === state.editLogId; })[0];

    // week — stops timesheets shifting after a week's closed out. Management
    // isn't limited by this (checked here, not just by hiding the button, so
    // it still holds even if the button was clicked before the week rolled over).
    if (!isAdmin() && !isInCurrentWeek(log.date)){

    }
    var job = state.jobs.filter(function(j){ return j.id === log.jobId; })[0];

  // Every venue that's ever been used, most-recent first, deduplicated. Not
  // capped here — the autocomplete dropdown that uses this filters by what's
  // typed and only shows the top few matches, so a long history is fine.
  function uniqueVenues(){
    var seen={}, out=[];
    visibleJobs().forEach(function(j){ if (j.venue && !seen[j.venue]){ seen[j.venue]=1; out.push(j.venue); } });
    return out;
  }

  function renderRecentForMe(me){
    // state.jobLogs is newest-first, so keeping the first entry seen per job
    // shows each job's CURRENT status once, instead of a stale older entry.
    var seenJobs = {}, mine = [];
    state.jobLogs.forEach(function(l){
      if (l.trashed || !l.employees || l.employees.indexOf(me) === -1) return;
      var key = l.jobId || l.id;
      if (seenJobs[key]) return;
      seenJobs[key] = true;
      var job = state.jobs.filter(function(j){ return j.id === l.jobId; })[0];
      if (job && (job.trashed || job.mergedInto)) return;
      mine.push(l);
    });
    mine = mine.slice(0,8);
    var html = '<div class="card"><div class="section-title" style="font-size:17px">Your recent jobs</div>';
    if (mine.length === 0){ html += '<p class="empty-note">Nothing logged yet.</p>'; }
    else { mine.forEach(function(l){ html += renderLogCard(l, {compact:true, editable:true}); }); }
    html += '</div>';
    html += renderRecentLeaveForMe(me);
    return html;
  }

  function onSubmitLeaveForm(e){
    e.preventDefault();
    if (!db) return;
    var f = e.target;
    var mode = f.getAttribute("data-mode");
    var date = f.date.value;
    var typeOn = root.querySelector('#leave-form [data-seg="leaveType"] .on');
    var type = typeOn ? typeOn.getAttribute("data-val") : "sick";
    if (!date) return;
    state.formBusy = true; render();
    var p;
    if (mode === "edit"){
      var id = f.getAttribute("data-leave-id");
      p = db.collection("leave-logs").doc(id).update({type: type, date: date});
    } else {
      p = db.collection("leave-logs").add({
        employee: state.session.name, type: type, date: date, hours: leaveHours(type),
        createdAt: new Date().toISOString(),
      });
    }
    p.then(function(){
      state.formBusy = false; state.logView = "list"; state.editLeaveId = null;
      toast(mode === "edit" ? "Leave day updated" : leaveLabel(type) + " logged");
      render();
    }).catch(function(){
      state.formBusy = false;
      toast("Couldn't save that — try again.");
      render();
    });
  }

  function renderLogCard(l, opts){
    opts = opts || {};
    var statusPill = l.completed ? '<span class="pill pill-success">Completed</span>' :
      (l.crewDone ? '<span class="pill" style="background:var(--amber-soft); color:var(--amber-ink);">My part done</span>' : '<span class="pill pill-warning">Follow-up needed</span>');
    var html = '<div class="log-card">';
    html += '<div class="log-top"><div><div class="log-venue">'+esc(l.venue)+'</div><div class="log-desc">'+esc(l.jobDescription||"")+'</div>';
    html += '<div class="log-meta">'+fmtDay(l.date)+' &middot; <span class="mono">'+(l.hours!=null && l.hours!==""?esc(l.hours):"?")+'</span>'+(l.timeRange?' ('+esc(l.timeRange)+')':'')+' &middot; '+esc((l.employees||[]).join(", "))+'</div></div>';
    html += '<div style="text-align:right">'+statusPill+'</div></div>';

  function renderOverview(){
    var wk = weekBounds(0);
    var weekLogs = state.jobLogs.filter(function(l){ return !l.trashed && inRange(l.date, wk.startStr, wk.endStr); });
    var totalHours = weekLogs.reduce(function(s,l){ return s+numHours(l.hours); }, 0);
    var openCount = openJobs().length;

    var byEmp = {};
    weekLogs.forEach(function(l){ (l.employees||[]).forEach(function(n){ byEmp[n]=(byEmp[n]||0)+numHours(l.hours); }); });
    var maxHrs = Math.max(1, Object.keys(byEmp).reduce(function(m,k){return Math.max(m,byEmp[k]);},0));
    var empRows = Object.keys(byEmp).sort(function(a,b){return byEmp[b]-byEmp[a];});

    var html = '<div class="card"><div class="section-title">This week</div><p class="section-sub">'+fmtShort(wk.startStr)+' – '+fmtShort(wk.endStr)+'</p>';
    html += '<div class="stat-grid">';
    html += statTile(weekLogs.length, "Updates logged");
    html += statTile(totalHours.toFixed(1), "Hours logged");
    html += statTile(openCount, "Open jobs");
    html += statTile(activeCrew().length, "Active crew");
    html += '</div></div>';

    // What actually needs a manager's attention right now — the things a
    // substitute manager should check first, before anything else on this page.
    var unpriced = visibleJobs().filter(function(j){ return j.needsPricing && (j.invoiceAmount==null || j.invoiceAmount===""); });
    var overdue = overdueFollowups();
    var unassigned = openJobs().filter(function(j){ return !j.assignedEmployees || j.assignedEmployees.length===0; });
    if (unpriced.length || overdue.length || unassigned.length){
      html += '<div class="card"><div class="section-title" style="font-size:17px">Needs attention</div>';
      if (unpriced.length) html += '<button type="button" class="btn btn-outline btn-sm" style="margin:4px 6px 4px 0" data-mgmt="drew">'+unpriced.length+' job'+(unpriced.length===1?"":"s")+' waiting on a price &rarr;</button>';
      if (overdue.length) html += '<button type="button" class="btn btn-outline btn-sm" style="margin:4px 6px 4px 0; color:#b3261e; border-color:#b3261e;" data-mgmt="jobs">'+overdue.length+' follow-up'+(overdue.length===1?"":"s")+' overdue &rarr;</button>';
      if (unassigned.length) html += '<button type="button" class="btn btn-outline btn-sm" style="margin:4px 6px 4px 0" data-mgmt="jobs">'+unassigned.length+' open job'+(unassigned.length===1?"":"s")+' with nobody assigned &rarr;</button>';
      html += '</div>';
    }

    // Who's away this week (sick, annual, trade school, public holiday, unpaid) —
    // pulled straight from leave-logs, same week window as the stats above.
    var leaveThisWeek = state.leaveLogs
      .filter(function(l){ return !l.trashed && inRange(l.date, wk.startStr, wk.endStr); })
      .slice().sort(function(a,b){ return (a.date||"").localeCompare(b.date||""); });
    if (leaveThisWeek.length){
      html += '<div class="card"><div class="section-title" style="font-size:17px">Who\'s away this week</div>';
      leaveThisWeek.forEach(function(l){
        html += '<div class="crew-row"><div class="info"><div class="name">'+esc(l.employee)+'</div><div class="email">'+esc(leaveLabel(l.type))+'</div></div>' +
          '<div class="mono" style="color:var(--ink-soft); font-size:13px;">'+fmtDay(l.date)+'</div></div>';
      });
      html += '</div>';
    }

    html += '<div class="card"><div class="section-title" style="font-size:17px">Hours by crew member</div>';
    if (empRows.length===0){ html += '<p class="empty-note">No jobs logged this week yet.</p>'; }
    else { empRows.forEach(function(name){ var v=byEmp[name]; html += '<div class="bar-row"><div class="bar-name">'+esc(name)+'</div><div class="bar-track"><div class="bar-fill" style="width:'+(v/maxHrs*100)+'%"></div></div><div class="bar-val mono">'+v.toFixed(1)+'h</div></div>'; }); }
    html += '</div>';

    var followups = openJobs().slice(0,6);
    html += '<div class="card"><div class="section-title" style="font-size:17px">Open jobs needing follow-up</div>';
    if (followups.length===0){ html += '<p class="empty-note">Nothing outstanding.</p>'; }
    else { followups.forEach(function(j){ html += renderJobCard(j, {admin:false}); }); }
    html += '</div>';

    html += renderGlossaryCard();
    return html;
  }

  // A plain-language reference for the statuses and tabs — mainly so someone
  // new to managing this app isn't left guessing what "For Drew" or
  // "Invoiced" means.
  function renderGlossaryCard(){
    var html = '<div class="card">';
    html += '<button type="button" class="btn btn-ghost btn-sm" style="padding-left:0" data-action="toggle-glossary">'+(state.glossaryOpen?"Hide":"What do all the tabs and statuses mean?")+'</button>';
    if (state.glossaryOpen){
      html += '<div style="margin-top:8px; font-size:13.5px; line-height:1.6;">' +
        '<p><strong>Job statuses:</strong> Quoted (priced but not started) &middot; In-process (crew is working it) &middot; Completed (work\'s done, may still need pricing/invoicing) &middot; Invoiced (billed, fully closed out).</p>' +
        '<p><strong>Jobs</strong> — every job ever logged; filter by status or search across all of them.</p>' +
        '<p><strong>By Crew</strong> — pick a crew member to see just their jobs.</p>' +
        '<p><strong>For Drew</strong> — jobs flagged for pricing (the "Send to Drew for pricing" button on a job puts it here). Prices and notes here are never shown to crew.</p>' +
        '<p><strong>Priced</strong> — has a price set, not yet marked Invoiced.</p>' +
        '<p><strong>Trash</strong> — jobs someone moved out of the way (test entries, duplicates). Nothing is ever permanently deleted — anything here can be restored.</p>' +
        '<p><strong>Merge</strong> (button inside a job\'s detail view) — for when the same job got logged twice by different people; folds one into the other, keeping all the history.</p>' +
      '</div>';
    }
    html += '</div>';
    return html;
  }

  // Open jobs whose most recent update said "not finished" and gave an
  // estimated return date that's now in the past. state.jobLogs is loaded
  // newest-first, so the first log found per job is the latest one.
  function overdueFollowups(){
    var today = todayStr();
    return openJobs().filter(function(j){
      var latest = jobLogsFor(j.id)[0];
      return !!(latest && !latest.completed && latest.estimatedReturn && latest.estimatedReturn < today);
    });
  }

  function statTile(num,label){ return '<div class="stat-tile"><div class="num mono">'+num+'</div><div class="label">'+esc(label)+'</div></div>'; }

  // Compact, read-only summary shown in every list — venue, who was there, status,
  // price. Tap anywhere on it for the full, clearly laid-out detail view.
  function renderJobCard(j, opts){
    opts = opts || {};

    if (state.editingJobId === j.id){
      return renderJobEditForm(j, opts);
    }

    var html = '<div class="job-card job-card-tap" data-view-job="'+esc(j.id)+'">';
    html += '<div class="job-head"><div><div class="log-venue">'+esc(j.venue)+'</div>';
    if (j.assignedEmployees && j.assignedEmployees.length){
      html += '<div class="chips" style="margin-top:6px">'+j.assignedEmployees.map(function(n){return '<span class="pill pill-neutral">'+esc(n)+'</span>';}).join("")+'</div>';
    }
    html += '</div>';
    html += '<div style="text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:6px;">';
    if (j.isMerged){ html += '<span class="pill" style="background:var(--amber-soft); color:var(--amber-ink); border:1px solid var(--amber);">Combined job</span>'; }
    html += '<span class="pill '+statusPillClass(j.status)+'">'+statusLabel(j.status)+'</span>';
    if (opts.admin){
      html += (j.invoiceAmount != null && j.invoiceAmount !== "")
        ? '<span class="pill pill-success mono">$'+Number(j.invoiceAmount).toFixed(2)+'</span>'
        : '<span class="pill pill-neutral" style="border:1px dashed var(--line); background:transparent;">No price yet</span>';
    }
    html += '</div></div>';
    if (opts.agingNote){ html += '<div class="hint" style="'+esc(opts.agingNoteStyle||"")+'; margin-top:6px;">'+esc(opts.agingNote)+'</div>'; }
    html += '<div class="job-card-cta">Tap for full details <span aria-hidden="true">&rarr;</span></div>';
    html += '</div>';
    return html;
  }

  function renderJobEditForm(j, opts){
    var html = '<div class="job-card">';
    html += '<form id="job-details-form" data-job-id="'+esc(j.id)+'">';
    html += field("Venue / job site", '<input type="text" name="venue" value="'+esc(j.venue||"")+'" required>');
    html += field("Job description", '<textarea name="jobDescription" required>'+esc(j.jobDescription||"")+'</textarea>');
    if (opts.admin){
      // Crew pick this when they start a job on site, and it's easy to tap
      // the wrong pub group in a hurry — this is management's way to fix it
      // after the fact, which nothing else in the app currently allows.
      html += '<div class="field"><label>Client</label><div class="seg" data-seg="editClient">' +
        CLIENT_OPTIONS.map(function(c){
          return '<button type="button" data-val="'+esc(c)+'" class="'+(j.client===c?"on":"")+'">'+esc(c)+'</button>';
        }).join("") +
      '</div></div>';
      html += field("VTASK number (optional)", '<input type="text" name="vtask" value="'+esc(j.vtask||"")+'">');
      html += field("Purchase order (optional)", '<input type="text" name="poNumber" value="'+esc(j.poNumber||"")+'">');
      html += field("Invoice amount ($, optional)", '<input type="number" name="invoiceAmount" step="0.01" min="0" placeholder="e.g. 450.00" value="'+(j.invoiceAmount!=null?esc(j.invoiceAmount):"")+'">');
      html += field("Comments (optional, management only)", '<textarea name="comments" placeholder="Notes for whoever prices or reviews this job">'+esc(j.comments||"")+'</textarea>');
    }
    html += '<div style="display:flex; gap:8px"><button type="submit" class="btn btn-primary" style="flex:1">Save details</button><button type="button" class="btn btn-outline" data-action="cancel-edit-job">Cancel</button></div>';
    html += '</form>';
    html += '</div>';
    return html;
  }

  // ---------- Job detail view: everything about one job, laid out clearly, one tap away ----------
  function renderJobDetailView(){
    var j = state.jobs.filter(function(x){ return x.id === state.viewingJobId; })[0];
    var backBtn = '<button type="button" class="btn btn-ghost" data-action="close-job-detail" style="margin-bottom:8px; padding-left:0">&larr; Back</button>';
    if (!j){
      return '<div class="card">'+backBtn+'<p class="empty-note">That job isn\'t there anymore.</p></div>';
    }
    var admin = isAdmin() && state.activeTab === "management";
    if (j.mergedInto){
      var target = state.jobs.filter(function(x){ return x.id === j.mergedInto; })[0];
      return '<div class="card">'+backBtn+
        '<p class="empty-note">This job was merged into '+(target?esc(target.venue):"another job")+'.</p>' +
        (target ? '<button type="button" class="btn btn-outline" data-view-job="'+esc(target.id)+'">Go to '+esc(target.venue)+'</button>' : '') +
      '</div>';
    }
    if (j.trashed){
      return '<div class="card">'+backBtn+
        '<p class="empty-note">&ldquo;'+esc(j.venue)+'&rdquo; is in the trash.</p>' +
        (admin ? '<button type="button" class="btn btn-outline" data-restore-job="'+esc(j.id)+'">Restore this job</button>' : '') +
      '</div>';
    }
    var employeeView = !admin;

    if (state.editingJobId === j.id){
      return backBtn + renderJobEditForm(j, {admin:admin});
    }

    var logs = jobLogsFor(j.id);
    var html = '<div class="card">';
    html += backBtn;

    // ---- Header: venue + one quiet meta line on the left; status + price
    // grouped together on the right, instead of a bigger name block, a
    // separate row of name chips, and status/price stacked far away from
    // each other. ----
    html += '<div class="job-head"><div><div class="log-venue" style="font-size:18px">'+esc(j.venue)+'</div>';
    var metaBits = [];
    if (j.assignedEmployees && j.assignedEmployees.length) metaBits.push(esc(j.assignedEmployees.join(", ")));
    if (admin && j.vtask) metaBits.push('VTASK '+esc(j.vtask));
    if (admin && j.poNumber) metaBits.push('PO '+esc(j.poNumber));
    if (j.client) metaBits.push(esc(j.client));
    if (metaBits.length) html += '<div class="log-meta" style="margin-top:4px">'+metaBits.join(' &middot; ')+'</div>';
    html += '</div>';
    var priceBadge = "";
    if (admin){
      priceBadge = (j.invoiceAmount != null && j.invoiceAmount !== "")
        ? '<button type="button" class="mono" style="background:none; border:none; padding:0; cursor:pointer; font-weight:700; font-size:13px; color:var(--success);" data-action="edit-job-details" data-job-id="'+esc(j.id)+'">$'+Number(j.invoiceAmount).toFixed(2)+'</button>'
        : '<button type="button" class="btn btn-ghost btn-sm" style="padding:2px 4px; color:var(--ink-faint);" data-action="edit-job-details" data-job-id="'+esc(j.id)+'">+ Add price</button>';
    }
    html += '<div style="text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:5px;">';
    if (admin){
      html += '<select class="status-select" data-job-status-select="'+esc(j.id)+'">' +
        ["quoted","in-process","completed","invoiced"].map(function(s){ return '<option value="'+s+'" '+(j.status===s?"selected":"")+'>'+statusLabel(s)+'</option>'; }).join("") +
      '</select>';
    } else {
      html += '<span class="pill '+statusPillClass(j.status)+'">'+statusLabel(j.status)+'</span>';
    }
    html += priceBadge + '</div></div>';

    if (j.jobDescription) html += '<div class="log-desc" style="margin-top:8px; font-size:14px">'+esc(j.jobDescription)+'</div>';
    if (admin && j.comments) html += '<div class="hint" style="margin-top:8px">Notes: '+esc(j.comments)+'</div>';

    // Only the actions used on most jobs, most of the time, sit in view by
    // default. Print/Email/Copy for invoice/Send to Drew/Merge are all real
    // and all stay one tap away — they're just office/paperwork actions you
    // reach for occasionally, not every time you open a job, so they're
    // tucked under "More actions" instead of competing for attention here.
    var hasMoreActions = (admin || j.open !== false) || admin;
    html += '<div class="log-foot" style="margin-top:14px">';
    if (employeeView){ html += '<button type="button" class="btn btn-outline btn-sm" data-add-update="'+esc(j.id)+'">Add update</button>'; }
    html += '<button type="button" class="btn btn-ghost btn-sm" data-action="edit-job-details" data-job-id="'+esc(j.id)+'">Edit job details</button>';
    // Trash is open to crew too — e.g. an accidental duplicate job — not just
    // management. Same confirm-before-you-do-it step either way.
    html += '<button type="button" class="btn btn-outline btn-sm" style="color:#b3261e; border-color:#b3261e;" data-action="ask-trash-job" data-job-id="'+esc(j.id)+'">Move to trash&hellip;</button>';
    if (hasMoreActions) html += '<button type="button" class="btn btn-ghost btn-sm" style="margin-left:auto" data-action="toggle-job-actions" data-job-id="'+esc(j.id)+'">'+(state.jobActionsOpen?"Hide more actions":"More actions")+'</button>';
    html += '</div>';

    if (hasMoreActions && state.jobActionsOpen){
      html += '<div class="log-foot" style="margin-top:6px; padding-top:10px; border-top:1px dashed var(--line);">';
      // Print/Email are office paperwork actions — once a job's done, a crew
      // member looking back at it from their Completed tab doesn't need them.
      if (admin || j.open !== false){
        html += '<button type="button" class="btn btn-ghost btn-sm" data-print-job="'+esc(j.id)+'">Print</button>';
        html += '<button type="button" class="btn btn-ghost btn-sm" data-email-job="'+esc(j.id)+'">Email</button>';
      }
      if (admin){
        // For pasting straight into the Word invoice / ALH's upload system —
        // venue, description, every visit, materials, hours and price, as
        // plain text ready to paste rather than selecting it off the screen.
        html += '<button type="button" class="btn btn-ghost btn-sm" data-copy-job="'+esc(j.id)+'">Copy for invoice</button>';
        html += '<button type="button" class="btn btn-outline btn-sm" data-toggle-drew="'+esc(j.id)+'">'+(j.needsPricing?"✓ In Drew’s queue":"Send to Drew for pricing")+'</button>';
        html += '<button type="button" class="btn btn-ghost btn-sm" data-action="start-merge" data-job-id="'+esc(j.id)+'">Merge into another job&hellip;</button>';
        if (j.isMerged){
          html += '<button type="button" class="btn btn-ghost btn-sm" data-action="start-unmerge" data-job-id="'+esc(j.id)+'">Unmerge&hellip;</button>';
        }
      }
      html += '</div>';
    }

    if (state.trashConfirmJobId === j.id){
      html += '<div class="msg msg-error" style="margin-top:10px">Move &ldquo;'+esc(j.venue)+'&rdquo; to the trash? It\'ll disappear from every list' + (admin ? ', but you can restore it later from the Trash tab.' : ' — if that\'s a mistake, ask a manager to restore it for you.') + '</div>';
      html += '<div style="display:flex; gap:10px; margin-top:10px;">' +
        '<button type="button" class="btn btn-primary" style="background:#b3261e; border-color:#b3261e;" data-action="confirm-trash-job" data-job-id="'+esc(j.id)+'">Yes, move to trash</button>' +
        '<button type="button" class="btn btn-ghost" data-action="cancel-trash-job">Cancel</button>' +
      '</div>';
    }

    // For a job that's dragged on across multiple visits, a slim strip
    // replaces the old big grey "Job summary" card — same at-a-glance
    // totals, a fraction of the space. Materials no longer get a separate
    // summary list either, since each visit below already shows its own —
    // the strip's Materials cell is management-only and just totals what's
    // been entered against the docket so far.
    if (logs.length > 1){
      var summaryHours = logs.reduce(function(s,l){ return s+numHours(l.hours); }, 0);
      html += '<div class="stat-strip" style="margin-top:14px">';
      html += '<div class="cell"><div class="num mono">'+summaryHours.toFixed(1)+'</div><div class="label">Hours</div></div>';
      html += '<div class="cell"><div class="num mono">'+logs.length+'</div><div class="label">Visits</div></div>';
      if (admin){
        var materialsCostTotal = logs.reduce(function(s,l){ return s + (l.materialsCost!=null ? Number(l.materialsCost) : 0); }, 0);
        html += '<div class="cell"><div class="num mono">$'+materialsCostTotal.toFixed(2)+'</div><div class="label">Materials</div></div>';
      }
      html += '</div>';
    }

    html += '<div class="section-title" style="font-size:16px; margin-top:18px; padding-top:14px; border-top:1px solid var(--line);">Visit history</div>';
    if (logs.length){
      // Group entries by date so two people (or two updates) on the same day
      // read as one block instead of separate near-duplicate-looking rows.
      var byDate = {}, dateOrder = [];
      logs.slice(0,20).forEach(function(l){
        if (!byDate[l.date]){ byDate[l.date] = []; dateOrder.push(l.date); }
        byDate[l.date].push(l);
      });
      dateOrder.forEach(function(d){
        var entries = byDate[d];
        html += '<div style="margin-top:10px"><strong style="font-size:13px">'+fmtDay(d)+'</strong>';
        entries.forEach(function(l){
          var canChange = admin || isInCurrentWeek(l.date);
          var dotColor = l.completed ? "var(--success)" : (l.crewDone ? "var(--amber)" : "var(--warning)");
          var statusText = l.completed ? "Completed" : (l.crewDone ? "My part done" : "Follow-up");
          html += '<div class="visit-row"><div class="vr-line1">';
          html += '<span class="vr-dot" style="background:'+dotColor+'"></span>';
          html += '<div class="vr-body">';
          html += '<span class="mono">'+(l.hours!=null && l.hours!==""?esc(l.hours):"?")+'h</span>'+(l.timeRange?' <span class="hint">('+esc(l.timeRange)+')</span>':'')+' &middot; '+esc(l.submittedBy||"")+' &middot; '+statusText;
          if (l.jobDescription) html += '<div class="vr-sub">'+esc(l.jobDescription)+'</div>';
          if (l.materials || (admin && l.materialsCost != null)){
            var matLine = l.materials ? "Materials: "+esc(l.materials) : "Materials";
            if (admin && l.materialsCost != null) matLine += ' &mdash; $'+Number(l.materialsCost).toFixed(2);
            html += '<div class="vr-sub">'+matLine+'</div>';
          }
          if (l.alsoOnsite) html += '<div class="vr-sub">Also onsite: '+esc(l.alsoOnsite)+'</div>';
          if (!l.completed && l.remainingWork) html += '<div class="vr-sub">Still to do: '+esc(l.remainingWork)+'</div>';
          if (l.crewDone) html += '<div class="vr-sub">Who\'s going back: '+(l.handoffUnsure?"Not sure yet":esc(l.handoffTo||"—"))+'</div>';
          if (!canChange) html += '<div class="vr-sub">From a previous work week &mdash; ask a manager to change or delete it.</div>';
          html += '</div>';
          if (canChange){
            html += '<button type="button" class="vr-kebab" data-toggle-log-actions="'+esc(l.id)+'">&#8942;</button>';
          }
          html += '</div>'; // vr-line1
          if (canChange && state.openLogActionsId === l.id){
            if (state.trashConfirmLogId === l.id){
              html += '<div class="msg msg-error" style="margin-top:6px; margin-left:16px">Delete this entry? ' + (admin ? 'It\'ll move to the Trash tab, restorable any time.' : 'If that\'s a mistake, ask a manager to restore it.') + '</div>' +
                '<div style="display:flex; gap:8px; margin-top:6px; margin-left:16px;">' +
                '<button type="button" class="btn btn-primary btn-sm" style="background:#b3261e; border-color:#b3261e;" data-confirm-trash-log="'+esc(l.id)+'">Yes, delete it</button>' +
                '<button type="button" class="btn btn-ghost btn-sm" data-action="cancel-trash-log">Cancel</button>' +
              '</div>';
            } else {
              html += '<div class="vr-actions">' +
                '<button type="button" class="btn btn-ghost btn-sm" style="padding:2px 0" data-edit-log="'+esc(l.id)+'">Edit this entry</button>' +
                '<button type="button" class="btn btn-ghost btn-sm" style="padding:2px 0; color:#b3261e" data-ask-trash-log="'+esc(l.id)+'">Delete</button>' +
              '</div>';
            }
          }
          html += '</div>'; // visit-row
        });
        html += '</div>';
      });
    } else {
      html += '<p class="empty-note">No updates logged yet.</p>';
    }
    html += '</div>';
    return html;
  }

  // ---------- Merge two jobs into one (e.g. two people logged the same job separately) ----------
  function renderMergePicker(){
    var source = state.jobs.filter(function(x){ return x.id === state.mergeSourceId; })[0];
    var backBtn = '<button type="button" class="btn btn-ghost" data-action="cancel-merge" style="margin-bottom:8px; padding-left:0">&larr; Back</button>';
    if (!source){ state.mergeSourceId = null; return renderJobDetailView(); }

    var html = '<div class="card">';
    html += backBtn;
    html += '<div class="section-title">Merge &ldquo;'+esc(source.venue)+'&rdquo; into another job</div>';
    html += '<p class="section-sub">Pick the job to keep everything under. All of &ldquo;'+esc(source.venue)+'&rdquo;\'s logged visits move onto it, and this one closes out. This can\'t be undone.</p>';

    if (state.mergeTargetCandidateId){
      var target = state.jobs.filter(function(x){ return x.id === state.mergeTargetCandidateId; })[0];
      if (target){
        html += '<div class="msg msg-info" style="margin-top:12px">Merge &ldquo;'+esc(source.venue)+'&rdquo; into &ldquo;'+esc(target.venue)+'&rdquo;? Its visit history moves onto this job and it closes out — this can\'t be undone.</div>';
        html += '<div style="margin-top:12px">' + field("Name this job (optional)", '<input type="text" id="merge-name-input" value="'+esc(target.venue)+'">') + '</div>';
        html += '<p class="hint" style="margin-top:-8px">Leave as is to keep the current name, or give the combined job a clearer one — e.g. &ldquo;Deer Park &mdash; Bathroom renovation&rdquo;. This updates every visit already logged, so it all reads the same everywhere (timesheets included).</p>';
        html += '<div style="display:flex; gap:10px; margin-top:12px;">';
        html += '<button type="button" class="btn btn-primary" data-action="confirm-merge">Yes, merge it</button>';
        html += '<button type="button" class="btn btn-ghost" data-action="cancel-merge-target">Choose a different job</button>';
        html += '</div>';
        html += '</div>';
        return html;
      }
    }

    html += field("Search by venue", '<input type="text" id="merge-search-input" placeholder="e.g. Deer Park" value="'+esc(state.mergeQuery)+'" autocomplete="off">');
    html += '</div>';

    var q = (state.mergeQuery||"").trim().toLowerCase();
    var candidates = visibleJobs().filter(function(j){ return j.id !== source.id; });
    if (q) candidates = candidates.filter(function(j){ return (j.venue||"").toLowerCase().indexOf(q) !== -1; });
    candidates.sort(function(a,b){ return (b.lastUpdatedAt||b.createdAt||"").localeCompare(a.lastUpdatedAt||a.createdAt||""); });
    candidates = candidates.slice(0,25);

    html += '<div class="card">';
    if (candidates.length === 0){
      html += '<p class="empty-note">'+(q?"No jobs match.":"Type a venue above to find the job to merge into.")+'</p>';
    } else {
      candidates.forEach(function(j){
        html += '<div class="job-card">';
        html += '<div class="job-head"><div><div class="log-venue">'+esc(j.venue)+'</div>';
        if (j.jobDescription) html += '<div class="hint" style="margin-top:2px">'+esc(j.jobDescription)+'</div>';
        html += '</div><span class="pill '+statusPillClass(j.status)+'">'+statusLabel(j.status)+'</span></div>';
        html += '<button type="button" class="btn btn-outline btn-sm" style="margin-top:10px" data-pick-merge-target="'+esc(j.id)+'">Merge &ldquo;'+esc(source.venue)+'&rdquo; into this job</button>';
        html += '</div>';
      });
    }
    html += '</div>';
    return html;
  }

  function performMerge(sourceId, targetId, newName){
    if (!db || !sourceId || !targetId || sourceId === targetId) return;
    var source = state.jobs.filter(function(x){ return x.id===sourceId; })[0];
    var target = state.jobs.filter(function(x){ return x.id===targetId; })[0];
    if (!source || !target) return;

    // A merge can also double as "give this job a clearer name" — e.g.
    // renaming a job that started as just "Deer Park" to "Deer Park —
    // Bathroom renovation" once it's clearly its own multi-week project.
    // Every visit already logged (on both sides of the merge) gets its
    // venue text updated to match, so timesheets and job cards all read
    // the same name instead of the old one lingering on older entries.
    var finalVenue = (newName && newName.trim()) ? newName.trim() : target.venue;

    var batch = db.batch();
    var sourceLogs = state.jobLogs.filter(function(l){ return l.jobId === sourceId; });
    sourceLogs.forEach(function(l){
      // mergedFromJobId records which job each visit originally belonged to,
      // so if this merge ever needs undoing, those specific visits can be
      // found and moved back rather than guessed at.
      batch.update(db.collection("job-logs").doc(l.id), { jobId: targetId, venue: finalVenue, mergedFromJobId: sourceId });
    });
    if (finalVenue !== target.venue){
      var targetLogs = state.jobLogs.filter(function(l){ return l.jobId === targetId; });
      targetLogs.forEach(function(l){
        batch.update(db.collection("job-logs").doc(l.id), { venue: finalVenue });
      });
    }

    var targetPatch = { lastUpdatedAt: new Date().toISOString(), venue: finalVenue, isMerged: true };
    var extraNames = (source.assignedEmployees||[]).filter(function(n){
      return (target.assignedEmployees||[]).indexOf(n) === -1;
    });
    if (extraNames.length){
      targetPatch.assignedEmployees = firebase.firestore.FieldValue.arrayUnion.apply(null, extraNames);
    }
    batch.update(db.collection("jobs").doc(targetId), targetPatch);
    batch.update(db.collection("jobs").doc(sourceId), { mergedInto: targetId, open: false, lastUpdatedAt: new Date().toISOString() });

    batch.commit().then(function(){
      toast("Merged into " + finalVenue);
      state.mergeSourceId = null; state.mergeQuery = ""; state.mergeTargetCandidateId = null;
      state.viewingJobId = targetId;
      render();
    }).catch(function(){ toast("Couldn't merge those jobs — try again."); });
  }

  // Every job currently merged into this target — a target can absorb more
  // than one merge over time, so this can come back with several.
  function mergeSourcesFor(targetId){
    return state.jobs.filter(function(x){ return x.mergedInto === targetId && !x.trashed; });
  }

  function performUnmerge(targetId, sourceIds){
    if (!db || !targetId || !sourceIds || !sourceIds.length) return;
    var target = state.jobs.filter(function(x){ return x.id === targetId; })[0];
    if (!target) return;

    var batch = db.batch();
    var now = new Date().toISOString();
    sourceIds.forEach(function(sourceId){
      var source = state.jobs.filter(function(x){ return x.id === sourceId; })[0];
      if (!source) return;
      var taggedLogs = state.jobLogs.filter(function(l){ return l.jobId === targetId && l.mergedFromJobId === sourceId; });
      taggedLogs.forEach(function(l){
        batch.update(db.collection("job-logs").doc(l.id), {
          jobId: sourceId,
          venue: source.venue,
          mergedFromJobId: firebase.firestore.FieldValue.delete()
        });
      });
      batch.update(db.collection("jobs").doc(sourceId), {
        mergedInto: firebase.firestore.FieldValue.delete(),
        open: true,
        lastUpdatedAt: now
      });
    });

    // Once every source is split back out, the target no longer counts as a
    // combined job — unless something else is still merged into it.
    var stillMerged = mergeSourcesFor(targetId).filter(function(s){ return sourceIds.indexOf(s.id) === -1; }).length > 0;
    if (!stillMerged){
      batch.update(db.collection("jobs").doc(targetId), { isMerged: false, lastUpdatedAt: now });
    } else {
      batch.update(db.collection("jobs").doc(targetId), { lastUpdatedAt: now });
    }

    batch.commit().then(function(){
      toast(sourceIds.length > 1 ? "Unmerged those jobs" : "Unmerged that job");
      state.unmergeTargetId = null; state.unmergeSelected = [];
      var jobsToRecompute = sourceIds.concat([targetId]);
      Promise.all(jobsToRecompute.map(function(id){ return recomputeJobOpen(id); })).then(function(){
        state.viewingJobId = targetId;
        render();
      });
    }).catch(function(){ toast("Couldn't unmerge — try again."); });
  }

  // Re-derives a job's open/closed state from whichever of its (non-deleted)
  // visits is most recent — used after editing, deleting or restoring a
  // visit, since any of those can change what "the latest update" is.
  function recomputeJobOpen(jobId){
    // Sort client-side instead of orderBy on the query — a where()+orderBy() on
    // different fields needs a Firestore composite index, which this avoids.
    return db.collection("job-logs").where("jobId","==",jobId).get().then(function(snap){
      var docs = snap.docs.map(function(d){ return d.data(); }).filter(function(d){ return !d.trashed; });
      if (!docs.length) return;
      docs.sort(function(a,b){ return (b.submittedAt||"").localeCompare(a.submittedAt||""); });
      var latest = docs[0];
      return db.collection("jobs").doc(jobId).update({open: !latest.completed, lastUpdatedAt: new Date().toISOString()});
    });
  }

  // Permanently deletes a job and every logged visit under it. Firestore's
  // rules only allow this once "allow delete" is turned on for jobs and
  // job-logs (see firestore.rules) — see SETUP-EMAIL.md-style note in the
  // repo, or just the message Grace was given, for how to publish that.
  // Firestore's rules don't allow real deletes on jobs (on purpose — see
  // firestore.rules), so "delete" here is a soft trash: the job stays in
  // the database but drops out of every list (visibleJobs() excludes it),
  // and it can be restored from the Trash tab. Nothing about its logged
  // visits changes — they still belong to it, they just aren't shown
  // anywhere until it's restored.
  function trashJob(jobId){
    if (!db || !jobId) return;
    var j = state.jobs.filter(function(x){ return x.id===jobId; })[0];
    if (!j) return;
    db.collection("jobs").doc(jobId).update({ trashed: true, trashedAt: new Date().toISOString() })
      .then(function(){
        toast("Moved " + (j.venue||"that job") + " to trash");
        state.trashConfirmJobId = null;
        state.viewingJobId = null;
        state.editingJobId = null;
        render();
      }).catch(function(){ toast("Couldn't move that to trash — try again."); });
  }

  function restoreJob(jobId){
    if (!db || !jobId) return;
    var j = state.jobs.filter(function(x){ return x.id===jobId; })[0];
    if (!j) return;
    db.collection("jobs").doc(jobId).update({ trashed: false })
      .then(function(){ toast("Restored " + (j.venue||"that job")); render(); })
      .catch(function(){ toast("Couldn't restore that — try again."); });
  }

  // Same soft-delete pattern as jobs — a leave day never really disappears,
  // it just drops off every timesheet/list until a manager restores it from
  // the Trash tab. Both crew and management can delete; only management can
  // restore, same split as jobs.
  function trashLeave(leaveId){
    if (!db || !leaveId) return;
    var l = state.leaveLogs.filter(function(x){ return x.id===leaveId; })[0];
    if (!l) return;
    db.collection("leave-logs").doc(leaveId).update({ trashed: true, trashedAt: new Date().toISOString() })
      .then(function(){
        toast("Deleted " + leaveLabel(l.type).toLowerCase());
        state.trashConfirmLeaveId = null;
        render();
      }).catch(function(){ toast("Couldn't delete that — try again."); });
  }

  function restoreLeave(leaveId){
    if (!db || !leaveId) return;
    var l = state.leaveLogs.filter(function(x){ return x.id===leaveId; })[0];
    if (!l) return;
    db.collection("leave-logs").doc(leaveId).update({ trashed: false })
      .then(function(){ toast("Restored " + leaveLabel(l.type).toLowerCase()); render(); })
      .catch(function(){ toast("Couldn't restore that — try again."); });
  }

  // Deletes one logged visit, not the whole job — e.g. a duplicate or wrong
  // entry. Same soft-delete/Trash-tab pattern as everything else. Crew can
  // only do this (and edit) while the visit's date is still in the current
  // work week (isInCurrentWeek) — management isn't limited by that. Either
  // way, the job's open/follow-up status gets re-checked afterwards, since
  // deleting or restoring a visit can change which update is "the latest".
  function trashLog(logId){
    if (!db || !logId) return;
    var l = state.jobLogs.filter(function(x){ return x.id===logId; })[0];
    if (!l) return;
    db.collection("job-logs").doc(logId).update({ trashed: true, trashedAt: new Date().toISOString() })
      .then(function(){ return recomputeJobOpen(l.jobId); })
      .then(function(){
        toast("Deleted that entry");
        state.trashConfirmLogId = null;
        render();
      }).catch(function(){ toast("Couldn't delete that — try again."); });
  }

  function restoreLog(logId){
    if (!db || !logId) return;
    var l = state.jobLogs.filter(function(x){ return x.id===logId; })[0];
    if (!l) return;
    db.collection("job-logs").doc(logId).update({ trashed: false })
      .then(function(){ return recomputeJobOpen(l.jobId); })
      .then(function(){ toast("Restored that entry"); render(); })
      .catch(function(){ toast("Couldn't restore that — try again."); });
  }

  function renderJobsAdmin(){
    var filters = ["all","open","closed","invoiced","merged"];
    var q = (state.venueQuery || "").trim().toLowerCase();

    var html = '<div class="card">';
    html += '<div><div class="section-title">Jobs</div><p class="section-sub" style="margin-bottom:0">Every job, its status, and who\'s on it.</p></div>';
    html += field("Search", '<input type="text" id="venue-search-input" placeholder="e.g. Deer Park, shelf, VTASK 123" value="'+esc(state.venueQuery)+'" autocomplete="off">');

    var list;
    if (q){
      var logsByJob = {};
      state.jobLogs.forEach(function(l){ if (l.trashed) return; (logsByJob[l.jobId] = logsByJob[l.jobId] || []).push(l); });
      function jobMatches(j){
        var hay = [j.venue, j.jobDescription, j.vtask, j.poNumber, j.client, (j.assignedEmployees||[]).join(" ")].join(" ").toLowerCase();
        if (hay.indexOf(q) !== -1) return true;
        var logs = logsByJob[j.id] || [];
        return logs.some(function(l){
          var lhay = [l.materials, l.remainingWork, l.submittedBy, l.alsoOnsite, (l.employees||[]).join(" ")].join(" ").toLowerCase();
          return lhay.indexOf(q) !== -1;
        });
      }
      // Searching looks across every job ever logged, regardless of status —
      // the All/Open/Closed/Invoiced filter only applies when not searching.
      list = visibleJobs().filter(jobMatches);
      html += '<p class="hint" style="margin:8px 0 0">Searching everything, across all statuses.</p>';
    } else {
      list = visibleJobs();
      if (state.jobsStatusFilter === "open") list = list.filter(function(j){return j.open!==false && j.status!=="invoiced";});
      if (state.jobsStatusFilter === "closed") list = list.filter(function(j){return j.open===false && j.status!=="invoiced";});
      if (state.jobsStatusFilter === "invoiced") list = list.filter(function(j){return j.status==="invoiced";});
      // "Merged" is a home base for jobs that have absorbed one or more other
      // jobs (see performMerge) — these tend to be the bigger, multi-visit
      // jobs Grace wants to keep an eye on separately from one-off single-visit
      // jobs, right up until she's marked them complete/invoiced. It doesn't
      // remove them from the other filters — it's just an easy way to find
      // them all in one place. Open ones surface first, invoiced ones last.
      if (state.jobsStatusFilter === "merged"){
        list = list.filter(function(j){ return j.isMerged; });
        list = list.slice().sort(function(a,b){
          var rank = function(j){ return j.status==="invoiced" ? 2 : (j.status==="completed" ? 1 : 0); };
          var r = rank(a) - rank(b);
          if (r !== 0) return r;
          return (b.lastUpdatedAt||b.createdAt||"").localeCompare(a.lastUpdatedAt||a.createdAt||"");
        });
      }
      html += '<div class="seg" style="margin:14px 0" data-seg="jobsFilter">' +
        filters.map(function(f){
          var label = f === "closed" ? "Completed" : (f.charAt(0).toUpperCase()+f.slice(1));
          return '<button type="button" data-val="'+f+'" class="'+(state.jobsStatusFilter===f?"on":"")+'">'+label+'</button>';
        }).join("") +
      '</div>';
    }

    html += '</div>';
    if (list.length===0){ html += '<div class="card"><p class="empty-note">'+(q?"No jobs match.":"No jobs yet.")+'</p></div>'; }
    else { list.forEach(function(j){ html += renderJobCard(j, {admin:true}); }); }
    return html;
  }

  // ---------- Priced: has a price, not yet marked Invoiced ----------
  function renderPricedJobs(){
    var priced = visibleJobs().filter(function(j){ return j.invoiceAmount != null && j.invoiceAmount !== "" && j.status !== "invoiced"; });
    // Oldest-waiting first — the ones most at risk of being forgotten belong
    // at the top, not buried under whatever was priced most recently.
    var withAge = priced.map(function(j){ return {job:j, age: daysSince(j.pricedAt || j.lastUpdatedAt || j.createdAt)}; });
    withAge.sort(function(a,b){ return (b.age==null?-1:b.age) - (a.age==null?-1:a.age); });

    var html = '<div class="card">';
    html += '<div class="section-title">Priced — ready to invoice</div><p class="section-sub">Once you mark one Invoiced (open the job and change its status), it moves off this list into the Jobs tab. Oldest waiting first.</p>';
    if (priced.length===0){ html += '<p class="empty-note">Nothing priced and waiting right now.</p>'; }
    html += '</div>';
    withAge.forEach(function(row){
      var age = row.age;
      var note = age==null ? "" : (age===0 ? "Priced today" : "Waiting " + age + " day" + (age===1?"":"s") + (row.job.pricedAt ? "" : " (approx.)"));
      var style = (age!=null && age>=5) ? "color:#b3261e; font-weight:700;" : "";
      html += renderJobCard(row.job, {admin:true, agingNote: note, agingNoteStyle: style});
    });
    return html;
  }

  // ---------- Trash: jobs moved out of the way, restorable any time ----------
  // Every subcontractor name that's ever been logged, most-recent first,
  // deduplicated — same idea as uniqueVenues(), so the name field can
  // autocomplete a repeat subbie instead of Grace retyping them, and the
  // list doubles as a quick "who have we used" reference.
  function uniqueSubNames(){
    var seen={}, out=[];
    state.subcontractorJobs.filter(function(s){ return !s.trashed; }).forEach(function(s){
      if (s.name && !seen[s.name]){ seen[s.name]=1; out.push(s.name); }
    });
    return out;
  }

    html += '</div>';

  function onSubmitSubJob(e){
    e.preventDefault();
    if (!db) return;
    var f = e.target;
    var name = f.name.value.trim();
    var venue = f.venue.value.trim();
    var jobDescription = f.jobDescription.value.trim();
    var date = f.date.value;
    var amtRaw = f.amountCharged.value.trim();
    var parsedAmt = parseFloat(amtRaw);
    var amountCharged = (amtRaw === "" || isNaN(parsedAmt)) ? null : Math.round(parsedAmt * 100) / 100;

    if (!name || !jobDescription || !date){
      state.subJobMsg = {type:"error", text:"Please fill in their name, the job details and the date."};
      render(); return;
    }

    state.subJobBusy = true; state.subJobMsg = null; render();
    db.collection("subcontractor-jobs").add({
      name: name, venue: venue, jobDescription: jobDescription, date: date,
      amountCharged: amountCharged, createdBy: (state.session && state.session.name) || "",
      createdAt: new Date().toISOString(),
    }).then(function(){
      state.subJobBusy = false;
      toast("Logged " + name + "'s job");
      render();
    }).catch(function(){
      state.subJobBusy = false;
      state.subJobMsg = {type:"error", text:"Couldn't save that — try again."};
      render();
    });
  }

  // Same soft-delete/Trash-tab pattern as jobs, visits and leave — nothing is
  // ever really gone, it just drops out of the Subcontractors list until
  // restored from the Trash tab.
