  function leaveSubText(type){
    var hrs = leaveHours(type);
    if (hrs <= 0) return "This isn't a job — it won't add any paid hours, it just marks the date as leave without pay.";
    return "This isn't a job — it just adds a fixed "+hrs.toFixed(1)+"h to your timesheet for the date you pick.";
  }

  // Every weekday (Mon–Fri) date string from `from` to `to` inclusive — used
  // to split a multi-day leave selection into one entry per working day,
  // weekends skipped automatically. A single day (from === to) always
  // includes that day itself regardless — the weekend skip only kicks in
  // once it's an actual range, never for a single date someone picked on
  // purpose.
  function weekdayRange(from, to){
    if (from === to) return [from];
    var days = [];
    var cur = parseDate(from);
    var end = parseDate(to);
    while (cur <= end){
      var dow = cur.getDay();
      if (dow !== 0 && dow !== 6) days.push(dateToStr(cur));
      cur = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate()+1);
    }
    return days;
  }

  function renderLeaveForm(opts){
    var leave = opts.leave || {};
    var isEdit = opts.mode === "edit";
    var type = isEdit ? (leave.type || "sick") : "sick";
    var html = '<div class="card">';
    html += '<div class="section-title">'+(isEdit?"Edit leave day":"Add a leave day")+'</div>';
    html += '<button type="button" class="btn btn-ghost" data-action="back-to-list" style="margin-bottom:8px; padding-left:0">&larr; Back</button>';
    if (state.formMsg) html += '<div class="msg '+(state.formMsg.type==="error"?"msg-error":"msg-success")+'">'+esc(state.formMsg.text)+'</div>';
    html += '<form id="leave-form" data-mode="'+opts.mode+'" '+(isEdit?('data-leave-id="'+esc(leave.id)+'"'):'')+'>';
    html += '<div class="field"><label>Type</label><div class="seg" data-seg="leaveType">' +
      '<button type="button" data-val="sick" class="'+(type==="sick"?"on":"")+'">Sick day</button>' +
      '<button type="button" data-val="annual" class="'+(type==="annual"?"on":"")+'">Annual leave</button>' +
      '<button type="button" data-val="trade" class="'+(type==="trade"?"on":"")+'">Trade school</button>' +
      '<button type="button" data-val="public" class="'+(type==="public"?"on":"")+'">Public holiday</button>' +
      '<button type="button" data-val="unpaid" class="'+(type==="unpaid"?"on":"")+'">Leave without pay</button>' +
    '</div></div>';
    if (isEdit){
      html += field("Date", '<input type="date" name="date" value="'+esc(leave.date||todayStr())+'" required>');
    } else {
      html += '<div class="row2">';
      html += field("From", '<input type="date" name="date" value="'+esc(todayStr())+'" required>');
      html += field("To (optional)", '<input type="date" name="dateTo">');
      html += '</div>';
      html += '<p class="hint" style="margin:-6px 0 12px">Away just one day? Leave "To" blank. Pick a range and Saturdays/Sundays in it are skipped automatically.</p>';
    }
    html += '<button type="submit" class="btn btn-primary btn-block" id="leave-submit-btn" '+(state.formBusy?"disabled":"")+'>'+(state.formBusy?"Saving…":(isEdit?"Save changes":"Log leave"))+'</button>';
    html += '</form></div>';
    return html;
  }

  function onSubmitLeaveForm(e){
    e.preventDefault();
    if (!db) return;
    var f = e.target;
    var mode = f.getAttribute("data-mode");
    var date = f.date.value;
    var dateTo = (mode !== "edit" && f.dateTo) ? f.dateTo.value : "";
    var typeOn = root.querySelector('#leave-form [data-seg="leaveType"] .on');
    var type = typeOn ? typeOn.getAttribute("data-val") : "sick";
    if (!date) return;

    var dates = [date];
    if (mode !== "edit" && dateTo && dateTo !== date){
      if (dateTo < date){
        state.formMsg = {type:"error", text:"The “To” date is before the “From” date."};
        render(); return;
      }
      dates = weekdayRange(date, dateTo);
      if (!dates.length){
        state.formMsg = {type:"error", text:"That range is only weekend days — nothing to log."};
        render(); return;
      }
    }

    state.formBusy = true; state.formMsg = null; render();
    var p;
    if (mode === "edit"){
      var id = f.getAttribute("data-leave-id");
      p = db.collection("leave-logs").doc(id).update({type: type, date: date});
    } else {
      p = Promise.all(dates.map(function(d){
        return db.collection("leave-logs").add({
          employee: state.session.name, type: type, date: d, hours: leaveHours(type),
          createdAt: new Date().toISOString(),
        });
      }));
    }
    p.then(function(){
      state.formBusy = false; state.logView = "list"; state.editLeaveId = null;
      toast(mode === "edit" ? "Leave day updated" :
        (dates.length > 1 ? dates.length + " leave days logged (" + leaveLabel(type) + ")" : leaveLabel(type) + " logged"));
      render();
    }).catch(function(){
      state.formBusy = false;
      toast("Couldn't save that — try again.");
      render();
    });
  }

  function renderLogCard(l, opts){
    opts = opts || {};
    var statusPill = l.completed ? '<span class="pill pill-success">Completed</span>' :
      (l.crewDone ? '<span class="pill" style="background:var(--amber-soft); color:var(--amber-ink);">My part done</span>' : '<span class="pill pill-warning">Follow-up needed</span>');
    var html = '<div class="log-card">';
    html += '<div class="log-top"><div><div class="log-venue">'+esc(l.venue)+'</div><div class="log-desc">'+esc(l.jobDescription||"")+'</div>';
    html += '<div class="log-meta">'+fmtDay(l.date)+' &middot; <span class="mono">'+(l.hours!=null && l.hours!==""?esc(l.hours):"?")+'</span>'+(l.timeRange?' ('+esc(l.timeRange)+')':'')+' &middot; '+esc((l.employees||[]).join(", "))+'</div></div>';
    html += '<div style="text-align:right">'+statusPill+'</div></div>';
    if (l.materials){ html += '<div class="log-body"><strong>Materials:</strong> '+esc(l.materials)+'</div>'; }
    if (!l.completed){
      html += '<div class="log-followup"><strong>Est. return:</strong> '+(l.returnUnsure?"Not sure yet":(l.estimatedReturn?fmtShort(l.estimatedReturn):"—"))+'<br><strong>Still to do:</strong> '+esc(l.remainingWork||"—");
      if (l.crewDone) html += '<br><strong>Who\'s going back:</strong> '+(l.handoffUnsure?"Not sure yet":esc(l.handoffTo||"—"));
      html += '</div>';
    }
    html += '<div class="log-foot"><span class="hint">logged by '+esc(l.submittedBy||"")+' &middot; '+fmtTime(l.submittedAt)+'</span>';
    if (opts.editable){ html += '<button type="button" class="btn btn-ghost btn-sm" style="margin-left:auto" data-edit-log="'+esc(l.id)+'">Edit</button>'; }
    html += '</div>';
    html += '</div>';
    return html;
  }

  // ---------- MANAGEMENT ----------
  // Full manager tab set vs. Jayden's cut-down "lead" set — a lead only ever
  // gets Jobs (no prices — see renderJobsAdmin) and the shared Calendar.
  // Everything else (pricing queues, timesheets, subcontractor $, crew/PIN
  // management, trash) stays admin-only.
  var MGMT_TABS_ADMIN = [["overview","Overview"],["jobs","Jobs"],["assign","Assign"],["calendar","Calendar"],["bycrew","By Crew"],["drew","For Drew"],["priced","Priced"],["invoiced","Invoiced"],["timesheets","Timesheets"],["materials","Materials"],["subs","Subcontractors"],["crew","Crew"],["trash","Trash"]];
  var MGMT_TABS_LEAD = [["jobs","Jobs"],["assign","Assign"],["calendar","Calendar"]];

  function renderManagementTab(){
    var tabs = isAdmin() ? MGMT_TABS_ADMIN : MGMT_TABS_LEAD;
    var allowed = tabs.map(function(t){ return t[0]; });
    if (allowed.indexOf(state.mgmtSub) === -1) state.mgmtSub = "jobs";

    var html = '<div class="subtabs">';
    tabs.forEach(function(t){
      html += '<button data-mgmt="'+t[0]+'" class="'+(state.mgmtSub===t[0]?"on":"")+'">'+t[1]+'</button>';
    });
    html += '</div>';
    if (state.mgmtSub === "overview") html += renderOverview();
    else if (state.mgmtSub === "jobs") html += renderJobsAdmin();
    else if (state.mgmtSub === "assign") html += renderAssignTab();
    else if (state.mgmtSub === "calendar") html += renderCalendarView();
    else if (state.mgmtSub === "bycrew") html += renderByCrew();
    else if (state.mgmtSub === "drew") html += renderForDrew();
    else if (state.mgmtSub === "priced") html += renderPricedJobs();
    else if (state.mgmtSub === "invoiced") html += renderInvoicedJobs();
    else if (state.mgmtSub === "timesheets") html += renderTimesheets();
    else if (state.mgmtSub === "materials") html += renderMaterials();
    else if (state.mgmtSub === "subs") html += renderSubcontractors();
    else if (state.mgmtSub === "trash") html += renderTrash();
    else html += renderCrewView();
    return html;
  }

  function renderOverview(){
    var wk = weekBounds(0);
    var weekLogs = state.jobLogs.filter(function(l){ return !l.trashed && inRange(l.date, wk.startStr, wk.endStr); });
    var totalHours = weekLogs.reduce(function(s,l){ return s+numHours(l.hours); }, 0);
    var openCount = openJobs().length;

    var byEmp = {};
    weekLogs.forEach(function(l){ (l.employees||[]).forEach(function(n){ byEmp[n]=(byEmp[n]||0)+numHours(l.hours); }); });
    var maxHrs = Math.max(1, Object.keys(byEmp).reduce(function(m,k){return Math.max(m,byEmp[k]);},0));
    var empRows = Object.keys(byEmp).sort(function(a,b){return byEmp[b]-byEmp[a];});

    var html = '<div class="card"><div class="section-title">This week</div><p class="section-sub">'+fmtShort(wk.startStr)+' – '+fmtShort(wk.endStr)+'</p>';
    html += '<div class="stat-grid">';
    html += statTile(weekLogs.length, "Updates logged");
    html += statTile(totalHours.toFixed(1), "Hours logged");
    html += statTile(openCount, "Open jobs");
    html += statTile(activeCrew().length, "Active crew");
    html += '</div></div>';

    // What actually needs a manager's attention right now — the things a
    // substitute manager should check first, before anything else on this page.
    var unpriced = visibleJobs().filter(function(j){ return j.needsPricing && (j.invoiceAmount==null || j.invoiceAmount===""); });
    var overdue = overdueFollowups();
    var unassigned = openJobs().filter(function(j){ return !j.assignedEmployees || j.assignedEmployees.length===0; });
    if (unpriced.length || overdue.length || unassigned.length){
      html += '<div class="card"><div class="section-title" style="font-size:17px">Needs attention</div>';
      if (unpriced.length) html += '<button type="button" class="btn btn-outline btn-sm" style="margin:4px 6px 4px 0" data-mgmt="drew">'+unpriced.length+' job'+(unpriced.length===1?"":"s")+' waiting on a price &rarr;</button>';
      if (overdue.length) html += '<button type="button" class="btn btn-outline btn-sm" style="margin:4px 6px 4px 0; color:#b3261e; border-color:#b3261e;" data-mgmt="jobs">'+overdue.length+' follow-up'+(overdue.length===1?"":"s")+' overdue &rarr;</button>';
      if (unassigned.length) html += '<button type="button" class="btn btn-outline btn-sm" style="margin:4px 6px 4px 0" data-mgmt="jobs">'+unassigned.length+' open job'+(unassigned.length===1?"":"s")+' with nobody assigned &rarr;</button>';
      html += '</div>';
    }

    // Who's away this week (sick, annual, trade school, public holiday, unpaid) —
    // pulled straight from leave-logs, same week window as the stats above.
    var leaveThisWeek = state.leaveLogs
      .filter(function(l){ return !l.trashed && inRange(l.date, wk.startStr, wk.endStr); })
      .slice().sort(function(a,b){ return (a.date||"").localeCompare(b.date||""); });
    if (leaveThisWeek.length){
      html += '<div class="card"><div class="section-title" style="font-size:17px">Who\'s away this week</div>';
      leaveThisWeek.forEach(function(l){
        html += '<div class="crew-row"><div class="info"><div class="name">'+esc(l.employee)+'</div><div class="email">'+esc(leaveLabel(l.type))+'</div></div>' +
          '<div class="mono" style="color:var(--ink-soft); font-size:13px;">'+fmtDay(l.date)+'</div></div>';
      });
      html += '</div>';
    }

    html += '<div class="card"><div class="section-title" style="font-size:17px">Hours by crew member</div>';
    if (empRows.length===0){ html += '<p class="empty-note">No jobs logged this week yet.</p>'; }
    else { empRows.forEach(function(name){ var v=byEmp[name]; html += '<div class="bar-row"><div class="bar-name">'+esc(name)+'</div><div class="bar-track"><div class="bar-fill" style="width:'+(v/maxHrs*100)+'%"></div></div><div class="bar-val mono">'+v.toFixed(1)+'h</div></div>'; }); }
    html += '</div>';

    var followups = openJobs().slice(0,6);
    html += '<div class="card"><div class="section-title" style="font-size:17px">Open jobs needing follow-up</div>';
    if (followups.length===0){ html += '<p class="empty-note">Nothing outstanding.</p>'; }
    else { followups.forEach(function(j){ html += renderJobCard(j, {admin:false}); }); }
    html += '</div>';

    html += renderGlossaryCard();
    return html;
  }

  // A plain-language reference for the statuses and tabs — mainly so someone
  // new to managing this app isn't left guessing what "For Drew" or
  // "Invoiced" means.
  function renderGlossaryCard(){
    var html = '<div class="card">';
    html += '<button type="button" class="btn btn-ghost btn-sm" style="padding-left:0" data-action="toggle-glossary">'+(state.glossaryOpen?"Hide":"What do all the tabs and statuses mean?")+'</button>';
    if (state.glossaryOpen){
      html += '<div style="margin-top:8px; font-size:13.5px; line-height:1.6;">' +
        '<p><strong>Job statuses:</strong> Quoted (priced but not started) &middot; In-process (crew is working it) &middot; Completed (work\'s done, may still need pricing/invoicing) &middot; Invoiced (billed, fully closed out).</p>' +
        '<p><strong>Jobs</strong> — every job ever logged; filter by status or search across all of them.</p>' +
        '<p><strong>By Crew</strong> — pick a crew member to see just their jobs.</p>' +
        '<p><strong>For Drew</strong> — jobs flagged for pricing (the "Send to Drew for pricing" button on a job puts it here). Prices and notes here are never shown to crew.</p>' +
        '<p><strong>Priced</strong> — has a price set, not yet marked Invoiced.</p>' +
        '<p><strong>Invoiced</strong> — billed and fully closed out. The moment a job is marked Invoiced it disappears from Overview, Jobs, By Crew, For Drew and Priced — this tab is the only place it still shows up.</p>' +
        '<p><strong>Trash</strong> — jobs someone moved out of the way (test entries, duplicates). Nothing is ever permanently deleted — anything here can be restored.</p>' +
        '<p><strong>Merge</strong> (button inside a job\'s detail view) — for when the same job got logged twice by different people; folds one into the other, keeping all the history.</p>' +
      '</div>';
    }
    html += '</div>';
    return html;
  }

  // Open jobs whose most recent update said "not finished" and gave an
  // estimated return date that's now in the past. state.jobLogs is loaded
  // newest-first, so the first log found per job is the latest one.
  function overdueFollowups(){
    var today = todayStr();
    return openJobs().filter(function(j){
      var latest = jobLogsFor(j.id)[0];
      return !!(latest && !latest.completed && latest.estimatedReturn && latest.estimatedReturn < today);
    });
  }

  function statTile(num,label){ return '<div class="stat-tile"><div class="num mono">'+num+'</div><div class="label">'+esc(label)+'</div></div>'; }

  // Compact, read-only summary shown in every list — venue, who was there, status,
  // price. Tap anywhere on it for the full, clearly laid-out detail view.
  function renderJobCard(j, opts){
    opts = opts || {};

    if (state.editingJobId === j.id){
      return renderJobEditForm(j, opts);
    }

    // The job's own status (quoted/in-process/completed/invoiced) is set by
    // management by hand and doesn't track what the crew actually said on
    // their last visit — so on management-facing cards, also show what the
    // most recent log entry reported: fully Completed, handed off ("My part
    // done"), or still Follow-up needed. Crew members see this on their own
    // cards already (their own "Not finished"/"Completed" tabs), so it's
    // skipped there to avoid repeating it back to them.
    var latestLog = jobLogsFor(j.id)[0];
    var html = '<div class="job-card job-card-tap" data-view-job="'+esc(j.id)+'">';
    html += '<div class="job-head"><div><div class="log-venue">'+esc(j.venue)+'</div>';
    if (latestLog && latestLog.date){
      html += '<div class="hint mono" style="margin-top:1px;">'+esc(fmtDay(latestLog.date))+'</div>';
    }
    if (j.assignedEmployees && j.assignedEmployees.length){
      html += '<div class="chips" style="margin-top:6px">'+j.assignedEmployees.map(function(n){return '<span class="pill pill-neutral">'+esc(n)+'</span>';}).join("")+'</div>';
    }
    html += '</div>';
    html += '<div style="text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:6px;">';
    if (j.isMerged){ html += '<span class="pill" style="background:var(--amber-soft); color:var(--amber-ink); border:1px solid var(--amber);">Combined job</span>'; }
    html += '<span class="pill '+statusPillClass(j.status)+'">'+statusLabel(j.status)+'</span>';
    if (!opts.employeeView && latestLog){
      if (latestLog.completed){
        html += '<span class="pill pill-success">&#10003; Crew: Completed</span>';
      } else if (latestLog.crewDone){
        html += '<span class="pill" style="background:var(--amber-soft); color:var(--amber-ink);">Crew: My part done</span>';
      } else {
        html += '<span class="pill pill-warning">Crew: Follow-up needed</span>';
      }
    }
    if (opts.admin){
      html += (j.invoiceAmount != null && j.invoiceAmount !== "")
        ? '<span class="pill pill-success mono">$'+Number(j.invoiceAmount).toFixed(2)+'</span>'
        : '<span class="pill pill-neutral" style="border:1px dashed var(--line); background:transparent;">No price yet</span>';
    }
    html += '</div></div>';
    if (opts.agingNote){ html += '<div class="hint" style="'+esc(opts.agingNoteStyle||"")+'; margin-top:6px;">'+esc(opts.agingNote)+'</div>'; }
    html += '<div class="job-card-cta">Tap for full details <span aria-hidden="true">&rarr;</span></div>';
    html += '</div>';
    return html;
  }

  function renderJobEditForm(j, opts){
    var html = '<div class="job-card">';
    html += '<form id="job-details-form" data-job-id="'+esc(j.id)+'">';
    html += field("Venue / job site", '<input type="text" name="venue" value="'+esc(j.venue||"")+'" required>');
    html += field("Job description", '<textarea name="jobDescription" required>'+esc(j.jobDescription||"")+'</textarea>');
    if (opts.admin){
      // Crew pick this when they start a job on site, and it's easy to tap
      // the wrong pub group in a hurry — this is management's way to fix it
      // after the fact, which nothing else in the app currently allows.
      html += '<div class="field"><label>Client</label><div class="seg" data-seg="editClient">' +
        CLIENT_OPTIONS.map(function(c){
          return '<button type="button" data-val="'+esc(c)+'" class="'+(j.client===c?"on":"")+'">'+esc(c)+'</button>';
        }).join("") +
      '</div></div>';
      html += field("VTASK number (optional)", '<input type="text" name="vtask" value="'+esc(j.vtask||"")+'">');
      html += field("Purchase order (optional)", '<input type="text" name="poNumber" value="'+esc(j.poNumber||"")+'">');
      html += field("Invoice amount ($, optional)", '<input type="number" name="invoiceAmount" step="0.01" min="0" placeholder="e.g. 450.00" value="'+(j.invoiceAmount!=null?esc(j.invoiceAmount):"")+'">');
      html += field("Comments (optional, management only)", '<textarea name="comments" placeholder="Notes for whoever prices or reviews this job">'+esc(j.comments||"")+'</textarea>');
    }
    html += '<div style="display:flex; gap:8px"><button type="submit" class="btn btn-primary" style="flex:1">Save details</button><button type="button" class="btn btn-outline" data-action="cancel-edit-job">Cancel</button></div>';
    html += '</form>';
    html += '</div>';
    return html;
  }

  // ---------- Job detail view: everything about one job, laid out clearly, one tap away ----------
  function renderJobDetailView(){
    var j = state.jobs.filter(function(x){ return x.id === state.viewingJobId; })[0];
    var backBtn = '<button type="button" class="btn btn-ghost" data-action="close-job-detail" style="margin-bottom:8px; padding-left:0">&larr; Back</button>';
    if (!j){
      return '<div class="card">'+backBtn+'<p class="empty-note">That job isn\'t there anymore.</p></div>';
    }
    var admin = isAdmin() && state.activeTab === "management";
    // A lead (Jayden) browsing the shared "everyone's jobs" list under
    // Management sees a read-only view — no editing, no add-update, no
    // trash — so his own personal jobs (logged from the Log a Job tab, where
    // this is false) stay the only place he actually changes anything.
    // Assigning someone to a job lives entirely on the separate Assign tab,
    // not here.
    var leadBrowsing = isLead() && state.activeTab === "management";
    if (j.mergedInto){
      var target = state.jobs.filter(function(x){ return x.id === j.mergedInto; })[0];
      return '<div class="card">'+backBtn+
        '<p class="empty-note">This job was merged into '+(target?esc(target.venue):"another job")+'.</p>' +
        (target ? '<button type="button" class="btn btn-outline" data-view-job="'+esc(target.id)+'">Go to '+esc(target.venue)+'</button>' : '') +
      '</div>';
    }
    if (j.trashed){
      return '<div class="card">'+backBtn+
        '<p class="empty-note">&ldquo;'+esc(j.venue)+'&rdquo; is in the trash.</p>' +
        (admin ? '<button type="button" class="btn btn-outline" data-restore-job="'+esc(j.id)+'">Restore this job</button>' : '') +
      '</div>';
    }
    var employeeView = !admin && !leadBrowsing;

    if (state.editingJobId === j.id){
      return backBtn + renderJobEditForm(j, {admin:admin});
    }

    var logs = jobLogsFor(j.id);
    var html = '<div class="card">';
    html += backBtn;

    // ---- Header: venue + one quiet meta line on the left; status + price
    // grouped together on the right, instead of a bigger name block, a
    // separate row of name chips, and status/price stacked far away from
    // each other. ----
    html += '<div class="job-head"><div><div class="log-venue" style="font-size:18px">'+esc(j.venue)+'</div>';
    var metaBits = [];
    if (j.assignedEmployees && j.assignedEmployees.length) metaBits.push(esc(j.assignedEmployees.join(", ")));
    if (admin && j.vtask) metaBits.push('VTASK '+esc(j.vtask));
    if (admin && j.poNumber) metaBits.push('PO '+esc(j.poNumber));
    if (j.client) metaBits.push(esc(j.client));
    if (metaBits.length) html += '<div class="log-meta" style="margin-top:4px">'+metaBits.join(' &middot; ')+'</div>';
    html += '</div>';
    var priceBadge = "";
    if (admin){
      priceBadge = (j.invoiceAmount != null && j.invoiceAmount !== "")
        ? '<button type="button" class="mono" style="background:none; border:none; padding:0; cursor:pointer; font-weight:700; font-size:13px; color:var(--success);" data-action="edit-job-details" data-job-id="'+esc(j.id)+'">$'+Number(j.invoiceAmount).toFixed(2)+'</button>'
        : '<button type="button" class="btn btn-ghost btn-sm" style="padding:2px 4px; color:var(--ink-faint);" data-action="edit-job-details" data-job-id="'+esc(j.id)+'">+ Add price</button>';
    }
    html += '<div style="text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:5px;">';
    if (admin){
      html += '<select class="status-select" data-job-status-select="'+esc(j.id)+'">' +
        ["quoted","in-process","completed","invoiced"].map(function(s){ return '<option value="'+s+'" '+(j.status===s?"selected":"")+'>'+statusLabel(s)+'</option>'; }).join("") +
      '</select>';
    } else {
      html += '<span class="pill '+statusPillClass(j.status)+'">'+statusLabel(j.status)+'</span>';
    }
    html += priceBadge + '</div></div>';

    if (j.jobDescription) html += '<div class="log-desc" style="margin-top:8px; font-size:14px">'+esc(j.jobDescription)+'</div>';
    if (admin && j.comments) html += '<div class="hint" style="margin-top:8px">Notes: '+esc(j.comments)+'</div>';

    // Only the actions used on most jobs, most of the time, sit in view by
    // default. Print/Copy for invoice/Send to Drew/Merge are all real
    // and all stay one tap away — they're just office/paperwork actions you
    // reach for occasionally, not every time you open a job, so they're
    // tucked under "More actions" instead of competing for attention here.
    var hasMoreActions = !leadBrowsing && ((admin || j.open !== false) || admin);
    html += '<div class="log-foot" style="margin-top:14px">';
    if (employeeView){ html += '<button type="button" class="btn btn-outline btn-sm" data-add-update="'+esc(j.id)+'">Add update</button>'; }
    if (!leadBrowsing){
      html += '<button type="button" class="btn btn-ghost btn-sm" data-action="edit-job-details" data-job-id="'+esc(j.id)+'">Edit job details</button>';
      // Trash is open to crew too — e.g. an accidental duplicate job — not just
      // management. Same confirm-before-you-do-it step either way. A lead
      // browsing everyone's jobs doesn't get this — see leadBrowsing above.
      html += '<button type="button" class="btn btn-outline btn-sm" style="color:#b3261e; border-color:#b3261e;" data-action="ask-trash-job" data-job-id="'+esc(j.id)+'">Move to trash&hellip;</button>';
    }
    if (hasMoreActions) html += '<button type="button" class="btn btn-ghost btn-sm" style="margin-left:auto" data-action="toggle-job-actions" data-job-id="'+esc(j.id)+'">'+(state.jobActionsOpen?"Hide more actions":"More actions")+'</button>';
    html += '</div>';

    if (hasMoreActions && state.jobActionsOpen){
      html += '<div class="log-foot" style="margin-top:6px; padding-top:10px; border-top:1px dashed var(--line);">';
      // Print is an office paperwork action — once a job's done, a crew
      // member looking back at it from their Completed tab doesn't need it.
      if (admin || j.open !== false){
        html += '<button type="button" class="btn btn-ghost btn-sm" data-print-job="'+esc(j.id)+'">Print</button>';
      }
      if (admin){
        // For pasting straight into the Word invoice / ALH's upload system —
        // venue, description, every visit, materials, hours and price, as
        // plain text ready to paste rather than selecting it off the screen.
        html += '<button type="button" class="btn btn-ghost btn-sm" data-copy-job="'+esc(j.id)+'">Copy for invoice</button>';
        html += '<button type="button" class="btn btn-outline btn-sm" data-toggle-drew="'+esc(j.id)+'">'+(j.needsPricing?"✓ In Drew’s queue":"Send to Drew for pricing")+'</button>';
        html += '<button type="button" class="btn btn-ghost btn-sm" data-action="start-merge" data-job-id="'+esc(j.id)+'">Merge into another job&hellip;</button>';
        if (j.isMerged){
          html += '<button type="button" class="btn btn-ghost btn-sm" data-action="start-unmerge" data-job-id="'+esc(j.id)+'">Unmerge&hellip;</button>';
        }
      }
      html += '</div>';
    }

    if (state.trashConfirmJobId === j.id){
      html += '<div class="msg msg-error" style="margin-top:10px">Move &ldquo;'+esc(j.venue)+'&rdquo; to the trash? It\'ll disappear from every list' + (admin ? ', but you can restore it later from the Trash tab.' : ' — if that\'s a mistake, ask a manager to restore it for you.') + '</div>';
      html += '<div style="display:flex; gap:10px; margin-top:10px;">' +
        '<button type="button" class="btn btn-primary" style="background:#b3261e; border-color:#b3261e;" data-action="confirm-trash-job" data-job-id="'+esc(j.id)+'">Yes, move to trash</button>' +
        '<button type="button" class="btn btn-ghost" data-action="cancel-trash-job">Cancel</button>' +
      '</div>';
    }

    // For a job that's dragged on across multiple visits, a slim strip
    // replaces the old big grey "Job summary" card — same at-a-glance
    // totals, a fraction of the space. Materials no longer get a separate
    // summary list either, since each visit below already shows its own —
    // the strip's Materials cell is management-only and just totals what's
    // been entered against the docket so far.
    if (logs.length > 1){
      var summaryHours = logs.reduce(function(s,l){ return s+numHours(l.hours); }, 0);
      // "Visits" means actual trips to site, not log entries — if two people
      // (or a merge) leave two entries on the same date, that's one visit
      // with two people on it, not two separate visits.
      var visitDates = {};
      logs.forEach(function(l){ if (l.date) visitDates[l.date] = true; });
      var visitCount = Object.keys(visitDates).length;
      html += '<div class="stat-strip" style="margin-top:14px">';
      html += '<div class="cell"><div class="num mono">'+summaryHours.toFixed(1)+'</div><div class="label">Hours</div></div>';
      html += '<div class="cell"><div class="num mono">'+visitCount+'</div><div class="label">Visits</div></div>';
      if (admin){
        var materialsCostTotal = logs.reduce(function(s,l){ return s + (l.materialsCost!=null ? Number(l.materialsCost) : 0); }, 0);
        html += '<div class="cell"><div class="num mono">$'+materialsCostTotal.toFixed(2)+'</div><div class="label">Materials</div></div>';
      }
      html += '</div>';
    }

    html += '<div class="section-title" style="font-size:16px; margin-top:18px; padding-top:14px; border-top:1px solid var(--line);">Visit history</div>';
    if (logs.length){
      // Group entries by date so two people (or two updates) on the same day
      // read as one block instead of separate near-duplicate-looking rows.
      var byDate = {}, dateOrder = [];
      logs.slice(0,20).forEach(function(l){
        if (!byDate[l.date]){ byDate[l.date] = []; dateOrder.push(l.date); }
        byDate[l.date].push(l);
      });
      dateOrder.forEach(function(d){
        var entries = byDate[d];
        html += '<div style="margin-top:10px"><strong style="font-size:13px">'+fmtDay(d)+'</strong>';
        entries.forEach(function(l){
          var canChange = admin || isInEditableWeek(l.date);
          var dotColor = l.completed ? "var(--success)" : (l.crewDone ? "var(--amber)" : "var(--warning)");
          var statusText = l.completed ? "Completed" : (l.crewDone ? "My part done" : "Follow-up");
          html += '<div class="visit-row"><div class="vr-line1">';
          html += '<span class="vr-dot" style="background:'+dotColor+'"></span>';
          html += '<div class="vr-body">';
          html += '<span class="mono">'+(l.hours!=null && l.hours!==""?esc(l.hours):"?")+'h</span>'+(l.timeRange?' <span class="hint">('+esc(l.timeRange)+')</span>':'')+' &middot; '+esc(l.submittedBy||"")+' &middot; '+statusText;
          if (l.jobDescription) html += '<div class="vr-sub">'+esc(l.jobDescription)+'</div>';
          if (l.materials) html += '<div class="vr-sub">Materials: '+esc(l.materials)+'</div>';
          // Quick inline cost entry — tap the price (or "+ Add materials
          // cost") right here on the visit, type the number, done. No need
          // to open the full "Edit this entry" form just for this one field.
          if (admin){
            if (state.editingLogMaterialsCostId === l.id){
              html += '<form data-materials-cost-form="'+esc(l.id)+'" style="display:flex; align-items:center; gap:6px; margin-top:4px;">' +
                '<span class="hint">$</span>' +
                '<input type="text" inputmode="decimal" name="materialsCostQuick" value="'+(l.materialsCost!=null?esc(l.materialsCost):"")+'" placeholder="e.g. 84.50" autofocus style="width:100px; padding:4px 6px;" class="mono">' +
                '<button type="submit" class="btn btn-primary btn-sm" style="padding:3px 10px;">Save</button>' +
                '<button type="button" class="btn btn-ghost btn-sm" style="padding:3px 6px;" data-cancel-materials-cost="'+esc(l.id)+'">Cancel</button>' +
              '</form>';
            } else if (l.materialsCost != null){
              html += '<button type="button" class="vr-sub" style="display:block; background:none; border:none; padding:0; cursor:pointer; color:var(--success); font-weight:700; text-align:left;" data-add-materials-cost="'+esc(l.id)+'">Materials cost: $'+Number(l.materialsCost).toFixed(2)+' &middot; <span style="font-weight:400; text-decoration:underline;">edit</span></button>';
            } else {
              html += '<button type="button" class="vr-sub" style="display:block; background:none; border:none; padding:0; cursor:pointer; color:var(--ink-faint); text-decoration:underline; text-align:left;" data-add-materials-cost="'+esc(l.id)+'">+ Add materials cost</button>';
            }
          }
          if (l.alsoOnsite) html += '<div class="vr-sub">'+(l.alsoOnsite===ALONE_TEXT?"Worked alone":"Also onsite: "+esc(l.alsoOnsite))+'</div>';
          if (!l.completed && l.remainingWork) html += '<div class="vr-sub">Still to do: '+esc(l.remainingWork)+'</div>';
          if (l.crewDone) html += '<div class="vr-sub">Who\'s going back: '+(l.handoffUnsure?"Not sure yet":esc(l.handoffTo||"—"))+'</div>';
          if (!canChange) html += '<div class="vr-sub">From a previous work week &mdash; ask a manager to change or delete it.</div>';
          html += '</div>';
          if (canChange){
            html += '<button type="button" class="vr-kebab" data-toggle-log-actions="'+esc(l.id)+'">&#8942;</button>';
          }
          html += '</div>'; // vr-line1
          if (canChange && state.openLogActionsId === l.id){
            if (state.trashConfirmLogId === l.id){
              html += '<div class="msg msg-error" style="margin-top:6px; margin-left:16px">Delete this entry? ' + (admin ? 'It\'ll move to the Trash tab, restorable any time.' : 'If that\'s a mistake, ask a manager to restore it.') + '</div>' +
                '<div style="display:flex; gap:8px; margin-top:6px; margin-left:16px;">' +
                '<button type="button" class="btn btn-primary btn-sm" style="background:#b3261e; border-color:#b3261e;" data-confirm-trash-log="'+esc(l.id)+'">Yes, delete it</button>' +
                '<button type="button" class="btn btn-ghost btn-sm" data-action="cancel-trash-log">Cancel</button>' +
              '</div>';
            } else {
              html += '<div class="vr-actions">' +
                '<button type="button" class="btn btn-ghost btn-sm" style="padding:2px 0" data-edit-log="'+esc(l.id)+'">Edit this entry</button>' +
                '<button type="button" class="btn btn-ghost btn-sm" style="padding:2px 0; color:#b3261e" data-ask-trash-log="'+esc(l.id)+'">Delete</button>' +
              '</div>';
            }
          }
          html += '</div>'; // visit-row
        });
        html += '</div>';
      });
    } else {
      html += '<p class="empty-note">No updates logged yet.</p>';
    }
    html += '</div>';
    return html;
  }

  // ---------- Merge two jobs into one (e.g. two people logged the same job separately) ----------
  function renderMergePicker(){
    var source = state.jobs.filter(function(x){ return x.id === state.mergeSourceId; })[0];
    var backBtn = '<button type="button" class="btn btn-ghost" data-action="cancel-merge" style="margin-bottom:8px; padding-left:0">&larr; Back</button>';
    if (!source){ state.mergeSourceId = null; return renderJobDetailView(); }

    var html = '<div class="card">';
    html += backBtn;
    html += '<div class="section-title">Merge &ldquo;'+esc(source.venue)+'&rdquo; into another job</div>';
    html += '<p class="section-sub">Pick the job to keep everything under. All of &ldquo;'+esc(source.venue)+'&rdquo;\'s logged visits move onto it, and this one closes out. This can\'t be undone.</p>';

    if (state.mergeTargetCandidateId){
      var target = state.jobs.filter(function(x){ return x.id === state.mergeTargetCandidateId; })[0];
      if (target){
        html += '<div class="msg msg-info" style="margin-top:12px">Merge &ldquo;'+esc(source.venue)+'&rdquo; into &ldquo;'+esc(target.venue)+'&rdquo;? Its visit history moves onto this job and it closes out — this can\'t be undone.</div>';
        html += '<div style="margin-top:12px">' + field("Name this job (optional)", '<input type="text" id="merge-name-input" value="'+esc(target.venue)+'">') + '</div>';
        html += '<p class="hint" style="margin-top:-8px">Leave as is to keep the current name, or give the combined job a clearer one — e.g. &ldquo;Deer Park &mdash; Bathroom renovation&rdquo;. This updates every visit already logged, so it all reads the same everywhere (timesheets included).</p>';
        html += '<div style="display:flex; gap:10px; margin-top:12px;">';
        html += '<button type="button" class="btn btn-primary" data-action="confirm-merge">Yes, merge it</button>';
        html += '<button type="button" class="btn btn-ghost" data-action="cancel-merge-target">Choose a different job</button>';
        html += '</div>';
        html += '</div>';
        return html;
      }
    }

    html += field("Search by venue", '<input type="text" id="merge-search-input" placeholder="e.g. Deer Park" value="'+esc(state.mergeQuery)+'" autocomplete="off">');
    html += '</div>';

    function candidateCard(j){
      var c = '<div class="job-card">';
      c += '<div class="job-head"><div><div class="log-venue">'+esc(j.venue)+'</div>';
      if (j.jobDescription) c += '<div class="hint" style="margin-top:2px">'+esc(j.jobDescription)+'</div>';
      c += '</div><span class="pill '+statusPillClass(j.status)+'">'+statusLabel(j.status)+'</span></div>';
      c += '<button type="button" class="btn btn-outline btn-sm" style="margin-top:10px" data-pick-merge-target="'+esc(j.id)+'">Merge &ldquo;'+esc(source.venue)+'&rdquo; into this job</button>';
      c += '</div>';
      return c;
    }

    var q = (state.mergeQuery||"").trim().toLowerCase();

    // Before anyone's typed anything, lead with jobs whose venue looks like
    // the same place — catches the common case of two crew members logging
    // the same site under slightly different names before anyone searches.
    if (!q){
      var suggested = suggestedMergeCandidates(source);
      if (suggested.length){
        html += '<div class="card">';
        html += '<div class="section-title" style="font-size:15px">Suggested matches</div>';
        html += '<p class="hint" style="margin-top:-2px">Jobs whose name looks like &ldquo;'+esc(source.venue)+'&rdquo; — worth checking before you search for something else.</p>';
        html += '</div>';
        suggested.forEach(function(j){ html += candidateCard(j); });
      }
    }

    var candidates = visibleJobs().filter(function(j){ return j.id !== source.id; });
    if (q) candidates = candidates.filter(function(j){ return (j.venue||"").toLowerCase().indexOf(q) !== -1; });
    candidates.sort(function(a,b){ return (b.lastUpdatedAt||b.createdAt||"").localeCompare(a.lastUpdatedAt||a.createdAt||""); });
    candidates = candidates.slice(0,25);

    html += '<div class="card">';
    html += '<div class="section-title" style="font-size:15px">'+(q?"Search results":"All jobs")+'</div>';
    if (candidates.length === 0){
      html += '<p class="empty-note">'+(q?"No jobs match.":"No other jobs yet.")+'</p>';
    } else {
      html += '</div>';
      candidates.forEach(function(j){ html += candidateCard(j); });
      return html;
    }
    html += '</div>';
    return html;
  }

  function performMerge(sourceId, targetId, newName){
    if (!db || !sourceId || !targetId || sourceId === targetId) return;
    var source = state.jobs.filter(function(x){ return x.id===sourceId; })[0];
    var target = state.jobs.filter(function(x){ return x.id===targetId; })[0];
    if (!source || !target) return;

    // A merge can also double as "give this job a clearer name" — e.g.
    // renaming a job that started as just "Deer Park" to "Deer Park —
    // Bathroom renovation" once it's clearly its own multi-week project.
    // Every visit already logged (on both sides of the merge) gets its
    // venue text updated to match, so timesheets and job cards all read
    // the same name instead of the old one lingering on older entries.
    var finalVenue = (newName && newName.trim()) ? newName.trim() : target.venue;

    var batch = db.batch();
    var sourceLogs = state.jobLogs.filter(function(l){ return l.jobId === sourceId; });
    sourceLogs.forEach(function(l){
      // mergedFromJobId records which job each visit originally belonged to,
      // so if this merge ever needs undoing, those specific visits can be
      // found and moved back rather than guessed at.
      batch.update(db.collection("job-logs").doc(l.id), { jobId: targetId, venue: finalVenue, mergedFromJobId: sourceId });
    });
    if (finalVenue !== target.venue){
      var targetLogs = state.jobLogs.filter(function(l){ return l.jobId === targetId; });
      targetLogs.forEach(function(l){
        batch.update(db.collection("job-logs").doc(l.id), { venue: finalVenue });
      });
    }

    var targetPatch = { lastUpdatedAt: new Date().toISOString(), venue: finalVenue, isMerged: true };
    var extraNames = (source.assignedEmployees||[]).filter(function(n){
      return (target.assignedEmployees||[]).indexOf(n) === -1;
    });
    if (extraNames.length){
      targetPatch.assignedEmployees = firebase.firestore.FieldValue.arrayUnion.apply(null, extraNames);
    }
    batch.update(db.collection("jobs").doc(targetId), targetPatch);
    batch.update(db.collection("jobs").doc(sourceId), { mergedInto: targetId, open: false, lastUpdatedAt: new Date().toISOString() });

    batch.commit().then(function(){
      toast("Merged into " + finalVenue);
      state.mergeSourceId = null; state.mergeQuery = ""; state.mergeTargetCandidateId = null;
      state.viewingJobId = targetId;
      render();
    }).catch(function(){ toast("Couldn't merge those jobs — try again."); });
  }

  // Every job currently merged into this target — a target can absorb more
  // than one merge over time, so this can come back with several.
  function mergeSourcesFor(targetId){
    return state.jobs.filter(function(x){ return x.mergedInto === targetId && !x.trashed; });
  }

  function renderUnmergePicker(){
    var target = state.jobs.filter(function(x){ return x.id === state.unmergeTargetId; })[0];
    var backBtn = '<button type="button" class="btn btn-ghost" data-action="cancel-unmerge" style="margin-bottom:8px; padding-left:0">&larr; Back</button>';
    if (!target){ state.unmergeTargetId = null; return renderJobDetailView(); }

    var sources = mergeSourcesFor(target.id);
    var html = '<div class="card">';
    html += backBtn;
    html += '<div class="section-title">Unmerge from &ldquo;'+esc(target.venue)+'&rdquo;</div>';

    if (sources.length === 0){
      html += '<p class="empty-note">Nothing merged into this job anymore.</p>';
      html += '</div>';
      return html;
    }

    html += '<p class="section-sub">'+(sources.length > 1 ? "This job has more than one job merged into it — pick which one(s) to split back out." : 'Pick "'+esc(sources[0].venue)+'" below to split it back out as its own job.')+'</p>';
    html += '</div>';

    html += '<div class="card">';
    sources.forEach(function(s){
      var taggedCount = state.jobLogs.filter(function(l){ return l.jobId === target.id && l.mergedFromJobId === s.id; }).length;
      var checked = state.unmergeSelected.indexOf(s.id) !== -1;
      html += '<label class="job-card" style="display:block; cursor:pointer;">';
      html += '<div class="job-head"><div>';
      html += '<div><input type="checkbox" data-unmerge-pick="'+esc(s.id)+'" '+(checked?"checked":"")+' style="margin-right:8px;"><span class="log-venue" style="font-size:15px">'+esc(s.venue)+'</span></div>';
      if (taggedCount > 0){
        html += '<div class="hint" style="margin-top:4px">'+taggedCount+' visit'+(taggedCount===1?"":"s")+' will move back to it.</div>';
      } else {
        html += '<div class="hint" style="margin-top:4px; color:#b3261e;">This was merged before we started tracking which visits belong to it — unmerging restores &ldquo;'+esc(s.venue)+'&rdquo; as its own job, but its past visits stay on &ldquo;'+esc(target.venue)+'&rdquo;. You can move individual visits by editing them.</div>';
      }
      html += '</div></div>';
      html += '</label>';
    });
    html += '<div style="display:flex; gap:10px; margin-top:12px;">';
    html += '<button type="button" class="btn btn-primary" data-action="confirm-unmerge" '+(state.unmergeSelected.length?"":"disabled")+'>Unmerge selected</button>';
    html += '</div>';
    html += '</div>';
    return html;
  }

  function performUnmerge(targetId, sourceIds){
    if (!db || !targetId || !sourceIds || !sourceIds.length) return;
    var target = state.jobs.filter(function(x){ return x.id === targetId; })[0];
    if (!target) return;

    var batch = db.batch();
    var now = new Date().toISOString();
    sourceIds.forEach(function(sourceId){
      var source = state.jobs.filter(function(x){ return x.id === sourceId; })[0];
      if (!source) return;
      var taggedLogs = state.jobLogs.filter(function(l){ return l.jobId === targetId && l.mergedFromJobId === sourceId; });
      taggedLogs.forEach(function(l){
        batch.update(db.collection("job-logs").doc(l.id), {
          jobId: sourceId,
          venue: source.venue,
          mergedFromJobId: firebase.firestore.FieldValue.delete()
        });
      });
      batch.update(db.collection("jobs").doc(sourceId), {
        mergedInto: firebase.firestore.FieldValue.delete(),
        open: true,
        lastUpdatedAt: now
      });
    });

    // Once every source is split back out, the target no longer counts as a
    // combined job — unless something else is still merged into it.
    var stillMerged = mergeSourcesFor(targetId).filter(function(s){ return sourceIds.indexOf(s.id) === -1; }).length > 0;
    if (!stillMerged){
      batch.update(db.collection("jobs").doc(targetId), { isMerged: false, lastUpdatedAt: now });
    } else {
      batch.update(db.collection("jobs").doc(targetId), { lastUpdatedAt: now });
    }

    batch.commit().then(function(){
      toast(sourceIds.length > 1 ? "Unmerged those jobs" : "Unmerged that job");
      state.unmergeTargetId = null; state.unmergeSelected = [];
      var jobsToRecompute = sourceIds.concat([targetId]);
      Promise.all(jobsToRecompute.map(function(id){ return recomputeJobOpen(id); })).then(function(){
        state.viewingJobId = targetId;
        render();
      });
    }).catch(function(){ toast("Couldn't unmerge — try again."); });
  }

  // Re-derives a job's open/closed state from whichever of its (non-deleted)
  // visits is most recent — used after editing, deleting or restoring a
  // visit, since any of those can change what "the latest update" is.
  function recomputeJobOpen(jobId){
    // Sort client-side instead of orderBy on the query — a where()+orderBy() on
    // different fields needs a Firestore composite index, which this avoids.
    return db.collection("job-logs").where("jobId","==",jobId).get().then(function(snap){
      var docs = snap.docs.map(function(d){ return d.data(); }).filter(function(d){ return !d.trashed; });
      if (!docs.length) return;
      docs.sort(function(a,b){ return (b.submittedAt||"").localeCompare(a.submittedAt||""); });
      var latest = docs[0];
      return db.collection("jobs").doc(jobId).update({open: !latest.completed, lastUpdatedAt: new Date().toISOString()});
    });
  }

  // Firestore's rules don't allow real deletes on jobs (on purpose — see
  // firestore.rules), so "delete" here is a soft trash: the job stays in
  // the database but drops out of every list (visibleJobs() excludes it),
  // and it can be restored from the Trash tab.
  // Trashing a job also trashes its own logged visits (job-logs) — otherwise
  // the job disappears from every job list, but its hours silently keep
  // counting on whoever logged them's weekly timesheet, which is exactly the
  // "trashed the duplicate job but the hours are still on my timesheet" bug.
  // Logs are tagged trashedWithJob so restoreJob only brings back the ones IT
  // trashed — not a log someone had already deleted on its own beforehand.
  function trashJob(jobId){
    if (!db || !jobId) return;
    var j = state.jobs.filter(function(x){ return x.id===jobId; })[0];
    if (!j) return;
    var now = new Date().toISOString();
    db.collection("job-logs").where("jobId","==",jobId).get().then(function(snap){
      var batch = db.batch();
      batch.update(db.collection("jobs").doc(jobId), { trashed: true, trashedAt: now });
      snap.docs.forEach(function(d){
        if (!d.data().trashed){
          batch.update(d.ref, { trashed: true, trashedAt: now, trashedWithJob: true });
        }
      });
      return batch.commit();
    }).then(function(){
        toast("Moved " + (j.venue||"that job") + " to trash");
        state.trashConfirmJobId = null;
        state.viewingJobId = null;
        state.editingJobId = null;
        render();
      }).catch(function(){ toast("Couldn't move that to trash — try again."); });
  }

  function restoreJob(jobId){
    if (!db || !jobId) return;
    var j = state.jobs.filter(function(x){ return x.id===jobId; })[0];
    if (!j) return;
    db.collection("job-logs").where("jobId","==",jobId).get().then(function(snap){
      var batch = db.batch();
      batch.update(db.collection("jobs").doc(jobId), { trashed: false });
      snap.docs.forEach(function(d){
        if (d.data().trashedWithJob){
          batch.update(d.ref, { trashed: false, trashedWithJob: false });
        }
      });
      return batch.commit();
    }).then(function(){ toast("Restored " + (j.venue||"that job")); render(); })
      .catch(function(){ toast("Couldn't restore that — try again."); });
  }

  // Same soft-delete pattern as jobs — a leave day never really disappears,
  // it just drops off every timesheet/list until a manager restores it from
  // the Trash tab. Both crew and management can delete; only management can
  // restore, same split as jobs.
  function trashLeave(leaveId){
    if (!db || !leaveId) return;
    var l = state.leaveLogs.filter(function(x){ return x.id===leaveId; })[0];
    if (!l) return;
    db.collection("leave-logs").doc(leaveId).update({ trashed: true, trashedAt: new Date().toISOString() })
      .then(function(){
        toast("Deleted " + leaveLabel(l.type).toLowerCase());
        state.trashConfirmLeaveId = null;
        render();
      }).catch(function(){ toast("Couldn't delete that — try again."); });
  }

  function restoreLeave(leaveId){
    if (!db || !leaveId) return;
    var l = state.leaveLogs.filter(function(x){ return x.id===leaveId; })[0];
    if (!l) return;
    db.collection("leave-logs").doc(leaveId).update({ trashed: false })
      .then(function(){ toast("Restored " + leaveLabel(l.type).toLowerCase()); render(); })
      .catch(function(){ toast("Couldn't restore that — try again."); });
  }

  // Deletes one logged visit, not the whole job — e.g. a duplicate or wrong
  // entry. Same soft-delete/Trash-tab pattern as everything else. Crew can
  // only do this (and edit) while the visit's date is in the current work
  // week or the one just before it (isInEditableWeek) — management isn't
  // limited by that. Either way, the job's open/follow-up status gets
  // re-checked afterwards, since deleting or restoring a visit can change
  // which update is "the latest".
  function trashLog(logId){
    if (!db || !logId) return;
    var l = state.jobLogs.filter(function(x){ return x.id===logId; })[0];

  function renderJobsAdmin(){
    var filters = ["all","open","closed","merged"];
    var q = (state.venueQuery || "").trim().toLowerCase();

    var html = '<div class="card">';
    html += '<div><div class="section-title">Jobs</div><p class="section-sub" style="margin-bottom:0">Every job, its status, and who\'s on it.</p></div>';
    html += field("Search", '<input type="text" id="venue-search-input" placeholder="e.g. Deer Park, shelf, VTASK 123" value="'+esc(state.venueQuery)+'" autocomplete="off">');

    var list;
    if (q){
      var logsByJob = {};
      state.jobLogs.forEach(function(l){ if (l.trashed) return; (logsByJob[l.jobId] = logsByJob[l.jobId] || []).push(l); });
      function jobMatches(j){
        var hay = [j.venue, j.jobDescription, j.vtask, j.poNumber, j.client, (j.assignedEmployees||[]).join(" ")].join(" ").toLowerCase();
        if (hay.indexOf(q) !== -1) return true;
        var logs = logsByJob[j.id] || [];
        return logs.some(function(l){
          var lhay = [l.materials, l.remainingWork, l.submittedBy, l.alsoOnsite, (l.employees||[]).join(" ")].join(" ").toLowerCase();
          return lhay.indexOf(q) !== -1;
        });
      }
      // Searching looks across every non-invoiced job ever logged — invoiced
      // jobs are kept out of the Jobs tab entirely, search included; see the
      // Invoiced tab for those.
      list = nonInvoicedJobs().filter(jobMatches);
      html += '<p class="hint" style="margin:8px 0 0">Searching everything except invoiced jobs — see the Invoiced tab for those.</p>';
    } else {
      list = nonInvoicedJobs();
      if (state.jobsStatusFilter === "open") list = list.filter(function(j){return j.open!==false;});
      if (state.jobsStatusFilter === "closed") list = list.filter(function(j){return j.open===false;});
      // "Merged" is a home base for jobs that have absorbed one or more other
      // jobs (see performMerge) — these tend to be the bigger, multi-visit
      // jobs Grace wants to keep an eye on separately from one-off single-visit
      // jobs, right up until she's marked them complete. It doesn't remove
      // them from the other filters — it's just an easy way to find them all
      // in one place. Once one is invoiced it moves off this list into the
      // Invoiced tab.
      if (state.jobsStatusFilter === "merged"){
        list = list.filter(function(j){ return j.isMerged; });
      }
      html += '<div class="seg" style="margin:14px 0" data-seg="jobsFilter">' +
        filters.map(function(f){
          var label = f === "closed" ? "Completed" : (f.charAt(0).toUpperCase()+f.slice(1));
          return '<button type="button" data-val="'+f+'" class="'+(state.jobsStatusFilter===f?"on":"")+'">'+label+'</button>';
        }).join("") +
      '</div>';
    }
    list = list.slice().sort(byRecentJobActivity);

    html += '</div>';
    if (list.length===0){ html += '<div class="card"><p class="empty-note">'+(q?"No jobs match.":"No jobs yet.")+'</p></div>'; }
    else {
      html += '<div class="jobs-grid">';
      list.forEach(function(j){ html += renderJobCard(j, {admin:isAdmin()}); });
      html += '</div>';
    }
    return html;
  }

  // ---------- Priced: has a price, not yet marked Invoiced ----------
  function renderPricedJobs(){
    var priced = nonInvoicedJobs().filter(function(j){ return j.invoiceAmount != null && j.invoiceAmount !== ""; });
    var withAge = priced.map(function(j){ return {job:j, age: daysSince(j.pricedAt || j.lastUpdatedAt || j.createdAt)}; });

  // ---------- Invoiced: billed and fully closed out ----------
  // Once a job is marked Invoiced it comes out of every other view (Overview,
  // Jobs, By Crew, For Drew, Priced) — this tab (and Trash, if one gets
  // trashed) is the only place it still shows up. Most recently invoiced first.
  function renderInvoicedJobs(){
    var invoiced = visibleJobs().filter(function(j){ return j.status === "invoiced"; });
    invoiced.sort(function(a,b){
      return (b.invoicedAt||b.lastUpdatedAt||b.createdAt||"").localeCompare(a.invoicedAt||a.lastUpdatedAt||a.createdAt||"");
    });

    var html = '<div class="card">';
    html += '<div class="section-title">Invoiced</div><p class="section-sub">Billed and fully closed out — kept out of Jobs, By Crew, For Drew and Overview. This is the only place they live now.</p>';

    html += '</div>';
    if (invoiced.length){
      html += '<div class="jobs-grid">';
      invoiced.forEach(function(j){ html += renderJobCard(j, {admin:true}); });
      html += '</div>';
    }
    return html;
  }

  // ---------- Trash: jobs moved out of the way, restorable any time ----------
  // Every subcontractor name that's ever been logged, most-recent first,
  // deduplicated — same idea as uniqueVenues(), so the name field can
  // autocomplete a repeat subbie instead of Grace retyping them, and the
  // list doubles as a quick "who have we used" reference.
  function uniqueSubNames(){
    var seen={}, out=[];
    state.subcontractorJobs.filter(function(s){ return !s.trashed; }).forEach(function(s){
      if (s.name && !seen[s.name]){ seen[s.name]=1; out.push(s.name); }
    });
    return out;
  }

  // ---------- Materials: a running list of what's been bought (read off the
  // credit card statement, a docket, whatever) — logged as soon as Grace
  // knows about it, sometimes with the job already written down, sometimes
  // not. "Assigned" here just means "I've sorted which job this belongs to
  // and it's out of the way" — it's a tick, not a link to an actual job
  // record, matching how Grace actually wants to use it.
  function uniqueMaterialItems(){
    var seen={}, out=[];
    state.materials.slice().sort(function(a,b){ return (b.createdAt||"").localeCompare(a.createdAt||""); })
      .forEach(function(m){ if (m.item && !seen[m.item]){ seen[m.item]=1; out.push(m.item); } });
    return out;
  }

  function renderMaterials(){
    var toSort = state.materials.filter(function(m){ return !m.trashed && !m.assigned; })
      .slice().sort(function(a,b){ return (a.date||a.createdAt||"").localeCompare(b.date||b.createdAt||""); });
    var assigned = state.materials.filter(function(m){ return !m.trashed && m.assigned; })
      .slice().sort(function(a,b){ return (b.date||b.createdAt||"").localeCompare(a.date||a.createdAt||""); });
    var toSortTotal = toSort.reduce(function(s,m){ return s + (m.cost!=null?Number(m.cost):0); }, 0);
    var assignedTotal = assigned.reduce(function(s,m){ return s + (m.cost!=null?Number(m.cost):0); }, 0);

    var html = '<div class="card">';
    html += '<div class="section-title">Materials</div>';
    html += '<p class="section-sub">Write down what gets bought — who it was from, what it cost, and the job if you already know it — then tick it off once you\'ve sorted which job it belongs to.</p>';
    if (state.materialFormMsg) html += '<div class="msg '+(state.materialFormMsg.type==="error"?"msg-error":"msg-success")+'">'+esc(state.materialFormMsg.text)+'</div>';
    html += '<form id="material-form">';
    html += field("Bought from", '<div class="autocomplete-wrap"><input type="text" id="material-item-input" name="item" placeholder="e.g. Reece" autocomplete="off" required>' +
      '<div id="material-item-suggestions" class="autocomplete-list" hidden></div></div>');
    html += '<div class="row2">';
    html += field("Cost ($)", '<input type="number" name="cost" step="0.01" min="0" placeholder="e.g. 90.00" required>');
    html += field("Date", '<input type="date" name="date" value="'+esc(todayStr())+'">');
    html += '</div>';
    html += field("Job / venue (if you know it)", '<div class="autocomplete-wrap"><input type="text" id="material-venue-input" name="venue" placeholder="e.g. Deer Park Hotel" autocomplete="off">' +
      '<div id="material-venue-suggestions" class="autocomplete-list" hidden></div></div>');
    html += '<button type="submit" class="btn btn-primary btn-block" '+(state.materialFormBusy?"disabled":"")+'>'+(state.materialFormBusy?"Saving…":"Add to the list")+'</button>';
    html += '</form></div>';

    function materialCard(m, opts){
      opts = opts || {};
      var c;
      if (state.editingMaterialId === m.id){
        c = '<div class="job-card">';
        c += '<form data-edit-material-form="'+esc(m.id)+'">';
        c += field("Bought from", '<input type="text" name="item" value="'+esc(m.item||"")+'" required>');
        c += '<div class="row2">';
        c += field("Cost ($)", '<input type="number" name="cost" step="0.01" min="0" value="'+(m.cost!=null?esc(m.cost):"")+'" required>');
        c += field("Date", '<input type="date" name="date" value="'+esc(m.date||"")+'">');
        c += '</div>';
        c += field("Job / venue", '<input type="text" name="venue" value="'+esc(m.venue||"")+'">');
        c += '<div style="display:flex; gap:8px;">';
        c += '<button type="submit" class="btn btn-primary btn-sm" style="flex:1">Save</button>';
        c += '<button type="button" class="btn btn-ghost btn-sm" data-cancel-edit-material="'+esc(m.id)+'">Cancel</button>';
        c += '</div></form></div>';
        return c;
      }
      c = '<div class="job-card">';
      c += '<div class="job-head"><div><div class="log-venue">'+esc(m.item)+'</div>';
      c += '<div class="hint" style="margin-top:2px">'+esc(fmtDay(m.date||m.createdAt))+(m.venue?' &middot; '+esc(m.venue):' &middot; no job noted yet')+'</div>';
      c += '</div>';
      c += '<span class="pill pill-success mono">$'+Number(m.cost||0).toFixed(2)+'</span>';
      c += '</div>';
      c += '<div class="log-foot" style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;">';
      if (opts.assigned){
        c += '<button type="button" class="btn btn-outline btn-sm" data-unassign-material="'+esc(m.id)+'">Move back to to-sort</button>';
      } else {
        c += '<button type="button" class="btn btn-primary btn-sm" data-assign-material="'+esc(m.id)+'">&#10003; Assigned</button>';
      }
      c += '<button type="button" class="btn btn-ghost btn-sm" data-edit-material="'+esc(m.id)+'">Edit</button>';
      c += '<button type="button" class="btn btn-ghost btn-sm" style="color:#b3261e; margin-left:auto" data-ask-trash-material="'+esc(m.id)+'">Delete</button>';
      c += '</div>';
      if (state.trashConfirmMaterialId === m.id){
        c += '<div class="msg msg-error" style="margin-top:10px">Delete this entry? It\'ll move to the Trash tab, where you can restore it any time.</div>';
        c += '<div style="display:flex; gap:10px; margin-top:10px;">' +
          '<button type="button" class="btn btn-primary btn-sm" style="background:#b3261e; border-color:#b3261e;" data-confirm-trash-material="'+esc(m.id)+'">Yes, delete it</button>' +
          '<button type="button" class="btn btn-ghost btn-sm" data-action="cancel-trash-material">Cancel</button>' +
        '</div>';
      }
      c += '</div>';
      return c;
    }

    html += '<div class="card">';
    html += '<div class="section-title" style="font-size:17px">To sort ('+toSort.length+')</div>';
    if (toSort.length) html += '<p class="section-sub" style="margin-top:4px">Total: <span class="mono">$'+toSortTotal.toFixed(2)+'</span></p>';
    if (!toSort.length){ html += '<p class="empty-note" style="margin-top:10px">Nothing waiting to be sorted.</p>'; }
    html += '</div>';
    toSort.forEach(function(m){ html += materialCard(m, {assigned:false}); });

    if (assigned.length){
      html += '<div class="card"><div class="section-title" style="font-size:17px">Assigned ('+assigned.length+')</div>' +
        '<p class="section-sub" style="margin-top:4px">Total: <span class="mono">$'+assignedTotal.toFixed(2)+'</span></p></div>';
      assigned.forEach(function(m){ html += materialCard(m, {assigned:true}); });
    }

    return html;
  }

  function onSubmitMaterialForm(e){
    e.preventDefault();
    if (!db) return;
    var f = e.target;
    var item = f.item.value.trim();
    var costRaw = f.cost.value.trim();
    var cost = parseFloat(costRaw);
    var date = f.date.value || todayStr();
    var venue = f.venue.value.trim();

    if (!item || costRaw === "" || isNaN(cost) || cost < 0){
      state.materialFormMsg = {type:"error", text:"Fill in who it was from and a valid cost."};
      render(); return;
    }

    state.materialFormBusy = true; state.materialFormMsg = null; render();
    db.collection("materials").add({
      item: item, cost: Math.round(cost*100)/100, date: date, venue: venue,
      assigned: false, createdBy: (state.session && state.session.name) || "",
      createdAt: new Date().toISOString(),
    }).then(function(){
      state.materialFormBusy = false;
      toast("Added to the materials list");
      render();
    }).catch(function(){
      state.materialFormBusy = false;
      state.materialFormMsg = {type:"error", text:"Couldn't save that — try again."};
      render();
    });
  }

  function onSubmitSubJob(e){
    e.preventDefault();
    if (!db) return;
    var f = e.target;
    var name = f.name.value.trim();
    var venue = f.venue.value.trim();
    var jobDescription = f.jobDescription.value.trim();
    var date = f.date.value;
    var amtRaw = f.amountCharged.value.trim();
    var parsedAmt = parseFloat(amtRaw);
    var amountCharged = (amtRaw === "" || isNaN(parsedAmt)) ? null : Math.round(parsedAmt * 100) / 100;

    if (!name || !jobDescription || !date){
      state.subJobMsg = {type:"error", text:"Please fill in their name, the job details and the date."};
      render(); return;
    }

    state.subJobBusy = true; state.subJobMsg = null; render();
    db.collection("subcontractor-jobs").add({
      name: name, venue: venue, jobDescription: jobDescription, date: date,
      amountCharged: amountCharged, createdBy: (state.session && state.session.name) || "",
      createdAt: new Date().toISOString(),
    }).then(function(){
      state.subJobBusy = false;
      toast("Logged " + name + "'s job");
      render();
    }).catch(function(){
      state.subJobBusy = false;
      state.subJobMsg = {type:"error", text:"Couldn't save that — try again."};

  // ---------- Assign / Calendar: a pure calendar entry — "be at this site on
  // this date, here's what's needed" — created by management or a "lead"
  // (Jayden's semi-management role). It never creates or touches anything in
  // the Jobs list; the crew member logs the actual job completely separately,
  // the normal way, once they've done it. ----------
  function scheduleEntriesFor(date){
    return state.schedule.filter(function(s){ return !s.trashed && s.date === date; })
      .sort(function(a,b){ return (a.employeeName||"").localeCompare(b.employeeName||""); });
  }

  // Same idea as scheduleEntriesFor, but just one person's own entries — for
  // their personal calendar, where showing their own name on every chip
  // would be redundant, so the venue is what goes on the chip instead.
  function myScheduleEntriesFor(date, me){
    return state.schedule.filter(function(s){ return !s.trashed && s.date === date && s.employeeName === me; })
      .sort(function(a,b){ return (a.venue||"").localeCompare(b.venue||""); });
  }

  // Every site that's ever been typed into the Assign form, most-recent
  // first, deduplicated — lets the venue field autocomplete a repeat address
  // instead of Grace or Jayden retyping it. Purely a typing convenience;
  // picking one doesn't link this entry to anything.
  function knownScheduleVenues(){
    var seen={}, out=[];
    state.schedule.filter(function(s){ return !s.trashed; })
      .slice().sort(function(a,b){ return (b.createdAt||"").localeCompare(a.createdAt||""); })
      .forEach(function(s){ if (s.venue && !seen[s.venue]){ seen[s.venue]=1; out.push(s.venue); } });
    return out;
  }

  // The month + the 7-wide grid it needs to draw — Monday-first, with
  // leading blank cells so the 1st lands under the right weekday. offset is
  // in months from the current month (0 = this month), same idea as
  // weekBounds' week offset.
  function monthInfo(offset){
    var base = new Date();
    var first = new Date(base.getFullYear(), base.getMonth()+offset, 1);
    var year = first.getFullYear(), month = first.getMonth();
    var startWeekday = (first.getDay() + 6) % 7; // Mon=0..Sun=6
    var daysInMonth = new Date(year, month+1, 0).getDate();
    var label = first.toLocaleDateString(undefined, {month:"long", year:"numeric"});
    return {year:year, month:month, startWeekday:startWeekday, daysInMonth:daysInMonth, label:label};
  }

  function onSubmitAssign(e){
    e.preventDefault();
    if (!db) return;
    var f = e.target;
    var venue = f.venue.value.trim();
    var employeeName = f.employeeName.value;
    var date = f.date.value;
    var description = f.description.value.trim();
    var files = (f.photos && f.photos.files) ? Array.prototype.slice.call(f.photos.files) : [];

    if (!venue || !employeeName || !date){
      state.assignFormMsg = {type:"error", text:"Fill in the site, who's going, and a date."};
      render(); return;
    }

    state.assignFormBusy = true; state.assignFormMsg = null; render();

    var scheduleRef = db.collection("schedule").doc();
    var patch = {
      venue: venue, employeeName: employeeName, date: date, description: description,
      scheduledBy: (state.session && state.session.name) || "",
      createdAt: new Date().toISOString(),
    };

    // Uploading is skipped (rather than failing the whole save) when there are
    // no photos, or Storage was never enabled on this Firebase project — see
    // the try/catch around firebase.storage() near the top of this file.
    var uploadPromise = (files.length && storage)
      ? Promise.all(files.map(function(file, i){
          var path = "schedule-photos/" + scheduleRef.id + "/" + Date.now() + "-" + i + "-" + file.name;
          return storage.ref().child(path).put(file).then(function(snap){ return snap.ref.getDownloadURL(); });
        }))
      : Promise.resolve([]);

    uploadPromise.then(function(urls){
      if (urls.length) patch.photoUrls = urls;
      return scheduleRef.set(patch);
    }).then(function(){
      state.assignFormBusy = false;
      var msg = "Added to " + employeeName + "'s calendar";
      if (files.length && !storage) msg += " — heads up, the photos weren't attached (photo storage isn't set up yet)";
      toast(msg);
      render();
    }).catch(function(){
      state.assignFormBusy = false;
      state.assignFormMsg = {type:"error", text:"Couldn't save that — try again."};
      render();
    });
  }

  // Plain-text version of a crew member's weekly timesheet, ready to paste into an email.
  function buildTimesheetText(name, wk, logs, total){
    var lines = [];
    lines.push(name + "'s timesheet");
    lines.push(fmtShort(wk.startStr) + " to " + fmtShort(wk.endStr));
    lines.push("");
    logs.forEach(function(l){
      var hrs = (l.hours!=null && l.hours!=="") ? l.hours : "?";
      var line = fmtDay(l.date) + ": " + (l.venue||"") + " - " + hrs + "h";
      if (!l.completed && !l.isLeave) line += " (follow-up needed)";
      lines.push(line);
    });
    lines.push("");
    lines.push("Total: " + total.toFixed(1) + "h");
    return lines.join("\n");
  }

  function copyTimesheetFor(name){
    var wk = weekBounds(state.tsWeekOffset);
    var logs = weeklyEntriesFor(name, wk);
    logs.sort(function(a,b){ return (a.date||"").localeCompare(b.date||""); });
    var total = logs.reduce(function(s,l){ return s+numHours(l.hours); }, 0);
    var text = buildTimesheetText(name, wk, logs, total);
    copyTextToClipboard(text, function(ok){

  // Plain text, ready to paste straight into a Word invoice or ALH's upload
  // system: venue/client/reference numbers, the description, every visit
  // (so an ongoing multi-week job reads as one clear list of what was done),
  // Mirrors Grace's actual Word invoice layout (client, venue, VTASK/PO
  // reference line, description, then Amount/GST/Total) so this pastes
  // straight into the template instead of needing reshaping. GST is always
  // worked out at 10% from the entered amount (treated as excl. GST) —
  // that's the exact "$ .00" spot she's had come out blank by hand.
  var GST_RATE = 0.10;
  function buildJobInvoiceText(j){
    var logs = jobLogsFor(j.id).slice().sort(function(a,b){ return (a.date||"").localeCompare(b.date||""); });
    var lines = [];

    if (j.client) { lines.push(j.client); lines.push(""); }
    lines.push(j.venue || "");

    var refParts = [];
    if (j.vtask) refParts.push("VTASK" + j.vtask);
    if (j.poNumber) refParts.push((j.client ? j.client + " " : "") + "Purchase Order #" + j.poNumber);
    if (refParts.length) lines.push(refParts.join(" "));
    lines.push("");

    if (j.jobDescription){ lines.push("Description:"); lines.push(j.jobDescription); }

    // Only for a job that ran across more than one visit — a single-visit
    // job (like the roof clean this was built from) needs nothing extra,
    // but an ongoing multi-week job still needs each visit accounted for.
    if (logs.length > 1){
      lines.push("");
      lines.push("Work performed, by visit:");
      logs.forEach(function(l){
        var hrs = (l.hours!=null && l.hours!=="") ? l.hours+"h" : "";
        var bit = fmtDay(l.date) + (hrs ? " — " + hrs : "");
        if (l.jobDescription && l.jobDescription !== j.jobDescription) bit += ": " + l.jobDescription;
        lines.push("- " + bit);
      });
    }
    lines.push("");

    if (j.invoiceAmount != null && j.invoiceAmount !== ""){
      var amount = Number(j.invoiceAmount);
      var gst = Math.round(amount * GST_RATE * 100) / 100;
      var total = Math.round((amount + gst) * 100) / 100;
      lines.push("Amount $" + amount.toFixed(2));
      lines.push("GST Payable $" + gst.toFixed(2));
      lines.push("Total Amount Payable Including GST $" + total.toFixed(2));
    }

    return lines.join("\n");
  }

  function copyJobForInvoice(jobId){
    var j = state.jobs.filter(function(x){ return x.id===jobId; })[0];
    if (!j) return;
    var text = buildJobInvoiceText(j);
    copyTextToClipboard(text, function(ok){
      toast(ok ? "Copied — paste into your invoice" : "Couldn't copy automatically — select and copy manually");
    });
  }

  function copyTextToClipboard(text, cb){
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ cb(true); }).catch(function(){ fallbackCopyText(text, cb); });
    } else {
      fallbackCopyText(text, cb);
    }
  }
  function fallbackCopyText(text, cb){
    try{
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      cb(ok);
    }catch(e){ cb(false); }
  }

  function buildJobPrintHTML(j){
    var logs = jobLogsFor(j.id).slice().sort(function(a,b){ return (a.date||"").localeCompare(b.date||""); });
    var metaBits = [];
    if (j.vtask) metaBits.push("VTASK " + esc(j.vtask));
    if (j.poNumber) metaBits.push("PO " + esc(j.poNumber));
    if (j.client) metaBits.push(esc(j.client));
    metaBits.push("Status: " + esc(statusLabel(j.status)));
    if (j.assignedEmployees && j.assignedEmployees.length) metaBits.push("Assigned: " + j.assignedEmployees.map(esc).join(", "));
    if (isAdmin() && j.invoiceAmount != null && j.invoiceAmount !== "") metaBits.push("Invoice: $" + Number(j.invoiceAmount).toFixed(2));

      '</div>' +

      printFooter()
    );
  }

  // Downloads everything (jobs, job updates, leave, crew roster) as one JSON
  // file — a plain backup for your own records, or to hand over. PINs
  // (the "logins" collection) are deliberately left out.
  function exportAllData(){
    var payload = {
      exportedAt: new Date().toISOString(),
      exportedBy: (state.session && state.session.name) || "",
      crew: state.crew,
      jobs: state.jobs,
      jobLogs: state.jobLogs,
      leaveLogs: state.leaveLogs,
      subcontractorJobs: state.subcontractorJobs,
    };
    try{
      var blob = new Blob([JSON.stringify(payload, null, 2)], {type: "application/json"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = "hydraciv-crew-backup-" + todayStr() + ".json";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      toast("Backup downloaded");
    }catch(e){ toast("Couldn't build that download — try again."); }
  }

  function onSubmitSetup(e){

    if (pin !== pin2){ state.setupError="PINs don't match."; render(); return; }
    var name = f.name.value.trim();
    // Belt-and-braces: this screen is only meant to fire once, before any
    // crew exist, but guard against a name clash the same way the regular
    // Add Crew form does, in case it's ever reached with crew already there.
    var clash = state.crew.some(function(c){ return c.name.trim().toLowerCase() === name.toLowerCase(); });
