<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Hydraciv Crew Portal</title>

<!-- Home-screen / PWA icon setup so "Add to Home Screen" looks like a real app -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#123f5c">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hydraciv Crew">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --ground:#eef2f2; --surface:#ffffff; --surface-2:#e2e9eb; --surface-3:#d7e0e2;
    --ink:#16222b; --ink-soft:#55676f; --ink-faint:#7d8d94; --line:#ccd7da;
    --accent:#1c5c86; --accent-strong:#123f5c; --accent-soft:#e1edf3; --accent-ink:#ffffff;
    --amber:#f4b400; --amber-soft:#fdf0cc; --amber-ink:#2a1503;
    --success:#2f8f5b; --success-soft:#e3f3ea;
    --warning:#b5791c; --warning-soft:#faedd6; --warning-ink:#5a3d0f;
    --danger:#b3453a; --danger-soft:#f7e4e1;
    --violet:#6a4fa0; --violet-soft:#ece6f5;
    --focus:#1c5c86;
    --shadow: 0 1px 2px rgba(20,30,36,.06), 0 6px 20px -8px rgba(20,30,36,.18);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0e151b; --surface:#161f27; --surface-2:#1d2831; --surface-3:#25313b;
      --ink:#e7edef; --ink-soft:#a3b3ba; --ink-faint:#7c8d95; --line:#2b3a44;
      --accent:#72b4de; --accent-strong:#9fd1ee; --accent-soft:#1c3a4a; --accent-ink:#062231;
      --amber:#ffd54f; --amber-soft:#3a2a06; --amber-ink:#2a1503;
      --success:#72cd99; --success-soft:#17301f;
      --warning:#f0b95a; --warning-soft:#332708; --warning-ink:#f0b95a;
      --danger:#e6968b; --danger-soft:#3a1f1c;
      --violet:#b7a3dd; --violet-soft:#2a2440;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -10px rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --ground:#0e151b; --surface:#161f27; --surface-2:#1d2831; --surface-3:#25313b;
    --ink:#e7edef; --ink-soft:#a3b3ba; --ink-faint:#7c8d95; --line:#2b3a44;
    --accent:#72b4de; --accent-strong:#9fd1ee; --accent-soft:#1c3a4a; --accent-ink:#062231;
    --amber:#ffd54f; --amber-soft:#3a2a06; --amber-ink:#2a1503;
    --success:#72cd99; --success-soft:#17301f;
    --warning:#f0b95a; --warning-soft:#332708; --warning-ink:#f0b95a;
    --danger:#e6968b; --danger-soft:#3a1f1c;
    --violet:#b7a3dd; --violet-soft:#2a2440;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -10px rgba(0,0,0,.6);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{background:var(--ground);}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:"IBM Plex Sans", system-ui, sans-serif;
    font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:"Big Shoulders Display","IBM Plex Sans",sans-serif; text-wrap:balance; margin:0; letter-spacing:.01em;}
  .mono{font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums;}
  a{color:inherit;}
  button{font-family:inherit; font-size:inherit;}
  input,textarea,select{font-family:inherit; font-size:16px; color:var(--ink); background:var(--surface);}
  ::selection{background:var(--accent-soft);}
  :focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

  .app{max-width:900px; margin:0 auto; padding-bottom:64px;}

  /* header */
  .hero{
    position:relative; overflow:hidden; background:var(--accent-strong); color:#eef6fb;
    padding:22px 18px 0; border-top:4px solid var(--amber);
  }
  .hero::before{
    content:""; position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,.055) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.055) 0 1px, transparent 1px 28px);
    opacity:.5; pointer-events:none;
  }
  .hero-top{position:relative; display:flex; align-items:flex-start; justify-content:space-between; gap:12px;}
  .eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--amber); margin:0 0 6px;}
  .hero h1{font-size:34px; font-weight:800; color:#fff;}
  .hero p.sub{margin:6px 0 0; color:#cfe6f4; font-size:13.5px; max-width:34ch;}
  .who{position:relative; text-align:right; flex-shrink:0;}
  .who .name{font-weight:600; font-size:13.5px; color:#fff;}
  .who .role{font-size:10.5px; color:#9fcbe3; text-transform:uppercase; letter-spacing:.06em;}
  .who-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:2px;}
  .who button{
    background:none; border:none; color:#bcdcef; font-size:12px; text-decoration:underline;
    text-underline-offset:2px; cursor:pointer; padding:2px 0;
  }
  .sync-dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:#7fd9a8; margin-right:5px; vertical-align:1px;}
  .sync-note{position:relative; font-size:11px; color:#a9c9dc; padding:10px 0 12px; display:flex; align-items:center;}

  /* tabs */
  .tabbar{position:relative; display:flex; gap:2px; padding-top:6px;}
  .tabbar button{
    background:none; border:none; color:#cfe6f4; padding:10px 16px 12px; cursor:pointer;
    font-weight:600; font-size:14px; border-bottom:3px solid transparent; opacity:.72;
  }
  .tabbar button.active{opacity:1; color:#fff; border-bottom-color:var(--amber);}

  main{padding:18px 16px 0;}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px; box-shadow:var(--shadow);}
  .card + .card{margin-top:14px;}
  .section-title{font-size:20px; font-weight:700; margin-bottom:2px;}
  .section-sub{color:var(--ink-soft); font-size:13px; margin:0 0 14px;}

  .field{display:flex; flex-direction:column; gap:6px; margin-bottom:16px;}
  .field label{font-size:12.5px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;}
  .field input[type="text"], .field input[type="number"], .field input[type="date"], .field input[type="password"], .field input[type="tel"],
  .field textarea, .field select{
    border:1px solid var(--line); background:var(--surface); border-radius:9px; padding:11px 12px; color:var(--ink); width:100%;
  }
  .field textarea{min-height:74px; resize:vertical; font-family:inherit;}
  .hint{font-size:12px; color:var(--ink-faint); margin-top:2px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:520px){.row2{grid-template-columns:1fr;}}

  .autocomplete-wrap{position:relative;}
  .autocomplete-list{position:absolute; z-index:30; top:100%; left:0; right:0; margin-top:5px; background:var(--surface); border:1px solid var(--line); border-radius:9px; box-shadow:var(--shadow); max-height:230px; overflow-y:auto;}
  .autocomplete-list button{display:block; width:100%; text-align:left; background:none; border:none; border-bottom:1px solid var(--line); padding:11px 12px; font-size:14px; color:var(--ink); cursor:pointer;}
  .autocomplete-list button:last-child{border-bottom:none;}
  .autocomplete-list button:hover, .autocomplete-list button:focus{background:var(--surface-2);}

  .seg{display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; flex-wrap:wrap;}
  .seg button{
    flex:1; background:var(--surface); border:none; padding:10px 8px; cursor:pointer;
    color:var(--ink-soft); font-weight:600; font-size:13px; border-right:1px solid var(--line); min-width:80px;
  }
  .seg button:last-child{border-right:none;}
  .seg button.on{background:var(--accent); color:var(--accent-ink);}

  .status-select{border:1px solid var(--line); border-radius:999px; padding:5px 10px; font-size:12px; font-weight:700; color:var(--ink); background:var(--surface); cursor:pointer;}

  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:8px 14px; cursor:pointer; font-size:13.5px; font-weight:500; color:var(--ink-soft);}
  .chip.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-strong); font-weight:600;}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:10px; padding:13px 18px; font-weight:700; font-size:14.5px; cursor:pointer; border:1px solid transparent; min-height:48px;}
  .btn-primary{background:var(--amber); color:var(--amber-ink);}
  .btn-primary:hover{filter:brightness(1.04);}
  .btn-outline{background:transparent; border-color:var(--line); color:var(--ink);}
  .btn-ghost{background:transparent; border-color:transparent; color:var(--accent-strong); padding:8px 10px; min-height:auto;}
  .btn-sm{padding:8px 12px; min-height:36px; font-size:13px;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn-block{width:100%;}

  .msg{border-radius:9px; padding:10px 12px; font-size:13.5px; margin-bottom:14px;}
  .msg-error{background:var(--danger-soft); color:var(--danger);}
  .msg-success{background:var(--success-soft); color:var(--success);}
  .msg-info{background:var(--accent-soft); color:var(--accent-strong);}

  .pill{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:4px 9px; border-radius:999px; letter-spacing:.02em;}
  .pill-success{background:var(--success-soft); color:var(--success);}
  .pill-warning{background:var(--warning-soft); color:var(--warning);}
  .pill-neutral{background:var(--surface-2); color:var(--ink-soft);}
  .pill-accent{background:var(--accent-soft); color:var(--accent-strong);}
  .pill-violet{background:var(--violet-soft); color:var(--violet);}
  .pill-ink{background:var(--ink); color:var(--ground);}

  .picker-list{display:flex; flex-direction:column; gap:8px;}
  .picker-btn{text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:13px 14px; font-weight:600; cursor:pointer; color:var(--ink); font-size:15px;}
  .picker-btn:hover{border-color:var(--accent);}
  .picker-btn.sel{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-strong);}
  .login-pin-drop{background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:14px; margin:-2px 0 2px;}

  .pin-dots{display:flex; gap:10px; justify-content:center; margin:6px 0 4px;}
  .pin-input{width:100%; text-align:center; font-family:"IBM Plex Mono",monospace; font-size:26px; letter-spacing:.5em; padding:12px !important;}

  .log-card{border:1px solid var(--line); border-radius:10px; padding:13px 14px; background:var(--surface);}
  .log-card + .log-card{margin-top:10px;}
  .log-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .log-venue{font-weight:700; font-size:15px;}
  .log-desc{font-size:13px; color:var(--ink-soft); margin-top:1px;}
  .log-meta{color:var(--ink-soft); font-size:12.5px; margin-top:3px;}
  .log-body{margin-top:8px; font-size:13.5px; color:var(--ink);}
  .log-foot{margin-top:9px; display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
  .log-followup{margin-top:8px; background:var(--warning-soft); color:var(--warning-ink); border-radius:8px; padding:8px 10px; font-size:13px;}

  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  @media (max-width:640px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
  .stat-tile{background:var(--surface-2); border-radius:10px; padding:12px 14px;}
  .stat-tile .num{font-family:"Big Shoulders Display"; font-size:28px; font-weight:800; line-height:1;}
  .stat-tile .label{font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-top:4px;}

  /* Compact job-detail visit summary — a slim strip instead of the old big
     grey stat-grid card, used only on the job detail view. */
  .stat-strip{display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  .stat-strip .cell{flex:1; padding:9px 10px; text-align:center; border-right:1px solid var(--line);}
  .stat-strip .cell:last-child{border-right:none;}
  .stat-strip .num{font-family:"Big Shoulders Display"; font-size:18px; font-weight:800; line-height:1;}
  .stat-strip .label{font-size:9.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-faint); margin-top:3px;}

  /* One compact line per logged visit, with a status dot instead of a
     repeated pill on every row, and a kebab that reveals edit/delete
     instead of showing them all the time. */
  .visit-row{padding:7px 0; border-top:1px dashed var(--line);}
  .visit-row:first-child{border-top:none;}
  .visit-row .vr-line1{display:flex; align-items:flex-start; gap:8px;}
  .visit-row .vr-dot{width:8px; height:8px; border-radius:50%; margin-top:5px; flex:none;}
  .visit-row .vr-body{flex:1; min-width:0; font-size:13px;}
  .visit-row .vr-sub{font-size:12px; color:var(--ink-faint); margin-top:2px;}
  .visit-row .vr-kebab{background:none; border:none; color:var(--ink-faint); font-size:16px; cursor:pointer; padding:0 4px; flex:none; line-height:1;}
  .visit-row .vr-actions{margin-top:6px; padding-left:16px; display:flex; gap:14px;}

  .bar-row{display:grid; grid-template-columns:110px 1fr 52px; align-items:center; gap:10px; margin-bottom:8px;}
  .bar-name{font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bar-track{background:var(--surface-2); border-radius:6px; height:10px; overflow:hidden;}
  .bar-fill{background:var(--accent); height:100%; border-radius:6px;}
  .bar-val{font-size:12.5px; text-align:right; color:var(--ink-soft);}

  .subtabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px;}
  .subtabs button{background:var(--surface-2); border:1px solid transparent; border-radius:8px; padding:8px 13px; font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer;}
  .subtabs button.on{background:var(--accent); color:var(--accent-ink);}

  .weeknav{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px;}
  .weeknav .label{font-weight:700; font-size:14.5px;}
  .weeknav button{background:var(--surface-2); border:none; border-radius:8px; width:34px; height:34px; cursor:pointer; font-size:16px; color:var(--ink);}

  /* Month calendar grid — Management/Lead's shared Calendar tab */
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .cal-dow{font-size:10px; font-weight:700; text-align:center; color:var(--ink-faint); text-transform:uppercase; padding-bottom:4px; letter-spacing:.03em;}
  .cal-cell{
    aspect-ratio:1/1; border:1px solid var(--line); border-radius:8px; background:var(--surface);
    padding:5px 4px; cursor:pointer; display:flex; flex-direction:column; gap:2px; overflow:hidden; min-height:52px;
  }
  .cal-cell.blank{border-color:transparent; background:transparent; cursor:default;}
  .cal-cell.today{border-color:var(--amber); border-width:2px;}
  .cal-cell.sel{background:var(--accent-soft); border-color:var(--accent);}
  .cal-cell .num{font-size:11.5px; font-weight:700; color:var(--ink-soft);}
  .cal-cell.today .num{color:var(--warning);}
  .cal-chips{display:flex; flex-direction:column; gap:1px; margin-top:1px;}
  .cal-chip{font-size:8.5px; font-weight:700; background:var(--accent); color:#fff; border-radius:4px; padding:1px 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .cal-more{font-size:8.5px; color:var(--ink-faint); font-weight:600;}

  .day-heading{font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); margin:16px 0 8px;}
  .day-heading:first-child{margin-top:0;}

  .empty-note{color:var(--ink-soft); font-size:13.5px; padding:14px 2px;}

  .crew-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); gap:10px;}
  .crew-row:last-child{border-bottom:none;}
  .crew-row .info .name{font-weight:600;}
  .crew-row .info .email{font-size:12px; color:var(--ink-soft);}

  .job-card{border:1px solid var(--line); border-radius:10px; padding:14px 15px; background:var(--surface-3); box-shadow:var(--shadow);}
  .job-card + .job-card{margin-top:10px;}
  .job-card-tap{cursor:pointer; transition:box-shadow .12s ease, border-color .12s ease, transform .12s ease;}
  .job-card-tap:hover{border-color:var(--accent); box-shadow:0 2px 10px -2px rgba(20,30,36,.22); transform:translateY(-1px);}
  .job-card-cta{margin-top:9px; padding-top:9px; border-top:1px dashed var(--line); font-size:13px; font-weight:700; color:var(--accent-strong); display:flex; align-items:center; gap:5px;}
  .job-card-tap:hover .job-card-cta{color:var(--accent);}
  .job-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .job-num{font-family:"IBM Plex Mono"; font-weight:600; font-size:12.5px; color:var(--accent-strong);}

  /* Job list as boxes, several per row, instead of one full-width card per
     row — lets more jobs show on screen at once on a laptop/desktop, while
     naturally collapsing to a single column on a phone-width screen. */
  .jobs-grid{display:grid; gap:10px; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));}
  .jobs-grid .job-card{margin-top:0;}
  .jobs-grid .job-card + .job-card{margin-top:0;}
  /* At grid widths the venue name and the status pills no longer fit
     side-by-side without crowding, so stack them instead of running them
     left/right like the full-width card does. */
  .jobs-grid .job-head{flex-direction:column; align-items:stretch;}
  .jobs-grid .job-head > div:last-child{text-align:left; flex-direction:row; flex-wrap:wrap; align-items:center; margin-top:2px;}
  .timeline{margin-top:10px; padding-top:10px; border-top:1px solid var(--line);}
  .timeline-item{padding:8px 0; border-bottom:1px dashed var(--line); font-size:13px;}
  .timeline-item:last-child{border-bottom:none;}

  .footer-note{text-align:center; color:var(--ink-faint); font-size:12px; padding:22px 18px 8px;}

  .toast{position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--ink); color:var(--ground); padding:11px 18px; border-radius:999px; font-size:13.5px; font-weight:600; box-shadow:var(--shadow); z-index:50;}
  :root[data-theme="dark"] .toast, :root:not([data-theme="light"]) .toast{background:var(--surface-3); color:var(--ink);}

  .center-card{max-width:420px; margin:0 auto;}

  /* ---------- Printing: weekly timesheets & individual jobs ---------- */
  #print-area{display:none;}
  @media print{
    body.printing > *:not(#print-area){display:none !important;}
    #print-area{display:block !important;}
    @page{margin:1.5cm;}
  }
  #print-area{font-family:"Segoe UI",-apple-system,Roboto,sans-serif; color:#16222b; max-width:720px; margin:0 auto; padding:20px;}
  #print-area .p-head{border-bottom:2px solid #123f5c; padding-bottom:12px; margin-bottom:16px;}
  #print-area .p-head h1{margin:0 0 4px; font-size:21px; color:#123f5c;}
  #print-area .p-sub{font-size:13.5px; color:#55676f;}
  #print-area .p-meta{font-size:12.5px; color:#55676f; margin-top:4px;}
  #print-area .p-row{display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid #e2e9eb; font-size:13.5px;}
  #print-area .p-row:last-child{border-bottom:none;}
  #print-area .p-total{margin-top:16px; text-align:right; font-weight:700; font-size:15px; color:#123f5c;}
  #print-area .p-foot{margin-top:24px; font-size:11.5px; color:#9aa7ac;}
  #print-area .p-flag{color:#b5791c; font-weight:600;}

</style>
</head>
<body>

<div id="root" class="app"></div>
<div id="toast-host"></div>
<div id="print-area"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<script>
(function(){
  "use strict";

  var LS_SESSION = "hydraciv:session";
  var root = document.getElementById("root");
  var toastHost = document.getElementById("toast-host");
  var db = null;
  var storage = null;
  var dbStatus = "loading"; // loading | ready | unavailable

  // happens before any collection's first onSnapshot has actually delivered
  // data — so state.crew is briefly [] on every load, real crew or not.
  // Without this flag, that split-second was indistinguishable from "this is
  // a fresh install with nobody set up yet" and could flash the "Set up your
  // manager account" screen, which creates a brand-new admin crew record
  // with no duplicate-name check. Gate that screen on this instead of on
  // state.crew.length alone.
  var crewLoaded = false;

  // sessionStorage (not localStorage) on purpose — it clears itself when the
  // tab/app is actually closed, so nobody stays signed in to someone else's
  // login just by reopening the app. A reload of the same open tab still
  // keeps you logged in (so an accidental refresh mid-job doesn't boot you).
  function loadSession(){
    try{ localStorage.removeItem(LS_SESSION); }catch(e){} // one-off cleanup of the old always-logged-in behaviour
    try{ var raw = sessionStorage.getItem(LS_SESSION); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
  }
  function saveSession(s){ try{ sessionStorage.setItem(LS_SESSION, JSON.stringify(s)); }catch(e){} }
  function clearSession(){ try{ sessionStorage.removeItem(LS_SESSION); }catch(e){} }

  // ---------- job drafts (crew-side, device-local only) ----------
  // Drafts never touch Firestore and never go through db/onSnapshot — they
  // live only in THIS browser's localStorage, scoped per crew member's name.
  // That's deliberate: it means a half-filled-in job sheet structurally
  // cannot reach management (or anyone else's device) until the crew member
  // actually taps Submit. localStorage (not sessionStorage) on purpose here,
  // the opposite of the login session above — a draft should still be there
  // tomorrow even if the tab/app was fully closed overnight.
  function draftsKey(me){ return "hydraciv-drafts:" + me; }
  function loadDrafts(me){
    try{
      var raw = localStorage.getItem(draftsKey(me));
      var list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list) ? list : [];
    }catch(e){ return []; }
  }
  function saveDrafts(me, list){ try{ localStorage.setItem(draftsKey(me), JSON.stringify(list)); }catch(e){} }
  function discardDraft(me, draftId){ saveDrafts(me, loadDrafts(me).filter(function(d){ return d.id !== draftId; })); }

  var state = {

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }
  function genPin(){ return String(Math.floor(1000 + Math.random()*9000)); }
  function pad2(n){ return n < 10 ? "0"+n : ""+n; }
  function todayStr(){ var d = new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
  function parseDate(s){ var p = s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function fmtDay(s){ var d = parseDate(s); return d.toLocaleDateString(undefined, {weekday:"short", day:"numeric", month:"short"}); }
  function fmtShort(s){ var d = parseDate(s); return d.toLocaleDateString(undefined, {day:"numeric", month:"short"}); }
  function fmtTime(iso){ try{ return new Date(iso).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); }catch(e){ return ""; } }
  function getMonday(d){ var day=d.getDay(); var diff=(day===0?-6:1-day); return new Date(d.getFullYear(), d.getMonth(), d.getDate()+diff); }
  function dateToStr(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
  function weekBounds(offset){
    var base = new Date(); base = new Date(base.getFullYear(), base.getMonth(), base.getDate()+offset*7);
    var mon = getMonday(base); var sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate()+6);
    return {startStr: dateToStr(mon), endStr: dateToStr(sun)};
  }
  function inRange(d,a,b){ return d>=a && d<=b; }
  // The 7 date strings (Mon..Sun) for a given week offset — the day columns
  // the calendar views are built from.
  function weekDates(offset){
    var wk = weekBounds(offset);
    var mon = parseDate(wk.startStr);
    var days = [];
    for (var i=0;i<7;i++){ days.push(dateToStr(new Date(mon.getFullYear(), mon.getMonth(), mon.getDate()+i))); }
    return days;
  }
  // Whole days between an ISO timestamp (fmtTime-style, e.g. lastUpdatedAt) and
  // now — used for "priced 6 days ago" style aging notes. Never negative.
  function daysSince(iso){
    if (!iso) return null;
    var then = new Date(iso).getTime();
    if (isNaN(then)) return null;
    return Math.max(0, Math.floor((Date.now() - then) / 86400000));
  }
  // Accepts a comma as the decimal point too (e.g. "2,5") — parseFloat on
  // its own stops at the comma and silently reads that as "2", quietly
  // dropping the ".5" whenever someone types hours that way.
  function numHours(v){ var n = parseFloat(String(v==null?"":v).replace(",", ".")); return isNaN(n) ? 0 : n; }

  // Crew can only edit/delete a visit they logged while its date falls in
  // the current work week OR the one just before it — a short grace window
  // to fix something from last week without a manager, while still keeping
  // timesheets from shifting any further back than that once they're closed
  // out. Management isn't limited by this.
  function isInEditableWeek(dateStr){
    var cur = weekBounds(0);
    if (inRange(dateStr, cur.startStr, cur.endStr)) return true;
    var prev = weekBounds(-1);
    return inRange(dateStr, prev.startStr, prev.endStr);
  }

  // ---------- Leave (sick / annual / trade school / public holiday / unpaid) — a fixed number
  // of hours per type (0 for unpaid), no job attached ----------
  var LEAVE_TYPES = {
    sick:   { label: "Sick day",          hours: 7.6 },
    annual: { label: "Annual leave",      hours: 7.6 },
    trade:  { label: "Trade school",      hours: 7.6 },
    public: { label: "Public holiday",    hours: 7.6 },
    unpaid: { label: "Leave without pay", hours: 0 },
  };
  function leaveLabel(type){ return (LEAVE_TYPES[type] && LEAVE_TYPES[type].label) || "Leave"; }
  function leaveHours(type){ return (LEAVE_TYPES[type] ? LEAVE_TYPES[type].hours : 0); }

  // Leave entries for one person in one week, reshaped to look like a job-log
  // row (date/hours/venue/completed) so timesheet rendering, print and
  // copy can all treat a leave day exactly like a logged job without extra cases.
  function leaveEntriesFor(name, wk){
    return state.leaveLogs
      .filter(function(l){ return l.employee === name && !l.trashed && inRange(l.date, wk.startStr, wk.endStr); })
      .map(function(l){ return { id: l.id, date: l.date, hours: leaveHours(l.type), completed: true, venue: leaveLabel(l.type), isLeave: true, leaveType: l.type }; });
  }
  function weeklyEntriesFor(name, wk){
    var jobEntries = state.jobLogs.filter(function(l){ return !l.trashed && inRange(l.date, wk.startStr, wk.endStr) && l.employees && l.employees.indexOf(name) !== -1; });
    return jobEntries.concat(leaveEntriesFor(name, wk));
  }
  // Everyone who has either a job log or a leave day in the given week —
  // renderTimesheets needs this instead of deriving names from job logs
  // alone, or someone who was only on leave all week wouldn't show up at all.
  function weekEmployeeNames(wk){
    var names = {};
    state.jobLogs.forEach(function(l){ if (!l.trashed && inRange(l.date, wk.startStr, wk.endStr)) (l.employees||[]).forEach(function(n){ names[n]=1; }); });
    state.leaveLogs.forEach(function(l){ if (!l.trashed && inRange(l.date, wk.startStr, wk.endStr)) names[l.employee]=1; });
    return Object.keys(names).sort();
  }
  function statusLabel(s){ return {quoted:"Quoted","in-process":"In process",completed:"Completed",invoiced:"Invoiced"}[s] || "Quoted"; }
  function statusPillClass(s){ return {quoted:"pill-violet","in-process":"pill-accent",completed:"pill-success",invoiced:"pill-ink"}[s] || "pill-violet"; }
  // Small "Completed / My part done / Follow-up" pill for one visit — shared
  // by the timesheet views so a visit where the crew member's own part is
  // done, but the job itself isn't, doesn't just read as a generic Follow-up.
  function logStatusPill(l){
    if (l.completed) return "";
    if (l.crewDone) return ' &middot; <span class="pill" style="padding:2px 7px; background:var(--amber-soft); color:var(--amber-ink);">My part done</span>';
    return ' &middot; <span class="pill pill-warning" style="padding:2px 7px">Follow-up</span>';
  }

  function toast(text){
    var el = document.createElement("div"); el.className = "toast"; el.textContent = text;
    toastHost.appendChild(el); setTimeout(function(){ el.remove(); }, 2600);
  }

  // Shared by the "new job" client picker and management's "Edit job details"
  // client picker, so there's one list to keep in sync, not two.
  var CLIENT_OPTIONS = ["ALH","Pubco/Supreme","MRC/Pegasus","Black Rhino","Other","Unsure"];
  // Sentinel stored in a job-log's alsoOnsite field when someone explicitly
  // says nobody else was there, so "worked alone" and "just never answered
  // the question" are distinguishable in the data, not both a blank string.
  var ALONE_TEXT = "Alone";

  // ---------- contraction auto-fix (crew-side free-text fields) ----------
  // A phone keyboard autocorrects "dont" -> "don't" on its own; a laptop's
  // browser does nothing of the kind, which is the actual gap this closes.
  // Deliberately a short list of words that are NEVER correct on their own
  // (no "its"/"lets"/"well" etc — those are valid words without an
  // apostrophe too, so guessing there risks changing what someone meant).
  var CONTRACTION_FIXES = {
    dont:"don't", cant:"can't", wont:"won't", isnt:"isn't", wasnt:"wasn't",
    arent:"aren't", werent:"weren't", didnt:"didn't", doesnt:"doesn't",
    hasnt:"hasn't", havent:"haven't", hadnt:"hadn't", wouldnt:"wouldn't",
    couldnt:"couldn't", shouldnt:"shouldn't", mustnt:"mustn't",
    youre:"you're", theyre:"they're", weve:"we've", ive:"I've",
    youve:"you've", theyve:"they've", hes:"he's", shes:"she's",
    theyll:"they'll", youll:"you'll", whats:"what's", wheres:"where's",
    whos:"who's", thats:"that's", im:"I'm",
  };
  // Fires on every keystroke in a bound field; only actually does anything
  // the instant a word just got "finished" by a space/punctuation/newline —
  // same moment a phone keyboard would step in — so it never fights with
  // whatever's still being typed.
  function fixContractionsOnInput(e){
    var el = e.target;
    if (el.selectionStart !== el.selectionEnd) return; // a selection, not a caret — leave it alone
    var pos = el.selectionStart;
    var val = el.value;
    var justTyped = val.charAt(pos - 1);
    if (!justTyped || /[A-Za-z]/.test(justTyped)) return; // still mid-word
    var before = val.slice(0, pos - 1);
    var wordMatch = before.match(/[A-Za-z]+$/);
    if (!wordMatch) return;
    var word = wordMatch[0];
    var fix = CONTRACTION_FIXES[word.toLowerCase()];
    if (!fix) return;
    // Keep whatever capitalisation they actually typed on the first letter.
    var replacement = (word.charAt(0) === word.charAt(0).toUpperCase())
      ? fix.charAt(0).toUpperCase() + fix.slice(1) : fix;
    if (replacement === word) return;
    var startIdx = pos - 1 - word.length;
    el.value = val.slice(0, startIdx) + replacement + val.slice(pos - 1);
    var delta = replacement.length - word.length;
    el.selectionStart = el.selectionEnd = pos + delta;
  }
  // Wires the fix onto every matching field inside a given form/container —
  // called once from bindEvents each render, same pattern as the rest of
  // this file's event wiring.
  function bindContractionFixes(container){
    if (!container) return;
    ["jobDescription","materials","remainingWork"].forEach(function(name){
      var el = container.querySelector('[name="'+name+'"]');
      if (el) el.addEventListener("input", fixContractionsOnInput);
    });
  }

  function activeCrew(){ return state.crew.filter(function(c){ return c.active !== false; }); }
  function isAdmin(){ return !!(state.session && state.session.role === "admin"); }
  // "Lead" is a semi-management tier — Jayden's role. A lead sees every job
  // (never prices), can jump into the shared Calendar and schedule jobs onto
  // people, but can't create new jobs, see timesheets, manage crew/PINs, or
  // touch the Trash — those stay admin-only. Their own personal "Log a Job"
  // tab works exactly like any other crew member's and is kept separate from
  // the all-jobs Management view so the two never blend together.
  function isLead(){ return !!(state.session && state.session.role === "lead"); }
  function canManage(){ return isAdmin() || isLead(); }
  function loginFor(crewId){ return state.logins.filter(function(l){ return l.id === crewId; })[0] || null; }
  function jobLogsFor(jobId){ return state.jobLogs.filter(function(l){ return l.jobId === jobId && !l.trashed; }); }
  // Jobs that haven't been merged away or trashed. Every job-listing view
  // (management and crew) should build from this, not state.jobs directly —
  // a merged or trashed job's own doc sticks around (Firestore rules forbid
  // deleting it) but should never show up as if it were still a live job.
  function visibleJobs(){ return state.jobs.filter(function(j){ return !j.mergedInto && !j.trashed; }); }
  // Invoiced jobs are fully closed out — Grace wants them out of every
  // ordinary view (Overview, Jobs, By Crew, For Drew) and reachable only
  // from the dedicated Invoiced tab (or Trash, if one gets trashed).
  function nonInvoicedJobs(){ return visibleJobs().filter(function(j){ return j.status !== "invoiced"; }); }
  function openJobs(){ return nonInvoicedJobs().filter(function(j){ return j.open !== false; }); }

  // Shared "newest activity first" sort for every job list on the Management
  // side — lastUpdatedAt gets touched every time a visit is logged against a
  // job (see afterLog), so this surfaces whatever's most recently had
  // something happen on it, not just whatever was created most recently.
  function byRecentJobActivity(a, b){
    return (b.lastUpdatedAt||b.createdAt||"").localeCompare(a.lastUpdatedAt||a.createdAt||"");
  }

  // ---------- render ----------
  function render(){
    var html = "";

      html += '<div class="card center-card"><div class="msg msg-error">Couldn\'t connect to the Hydraciv Crew database. Check your internet connection and reload the page — if it keeps happening, let whoever manages this app know.</div></div>';
    } else if (dbStatus === "loading" || !crewLoaded){
      html += '<div class="card center-card"><p class="empty-note">Loading…</p></div>';
    } else if (state.crew.length === 0){
      html += renderSetupAdmin();
    } else if (!state.session){
      html += renderLogin();
    } else if (state.changePinOpen){
      html += renderChangePinView();
    } else if (state.editLogId){
      html += renderEditLogView();
    } else if (state.editLeaveId){
      html += renderLeaveEditView();
    } else if (state.mergeSourceId){
      html += renderMergePicker();
    } else if (state.unmergeTargetId){
      html += renderUnmergePicker();
    } else if (state.viewingScheduleId){
      html += renderScheduleDetail();
    } else if (state.viewingJobId){
      html += renderJobDetailView();
    } else if (!canManage()){
      html += renderEmployeeApp();
    } else if (state.activeTab === "log"){
      html += renderEmployeeApp();
    } else {
      html += renderManagementTab();
    }
    html += "</main>";
    html += '<div class="footer-note">Hydraciv Crew Portal — job sheets sync live' + (canManage() ? " to Management." : ".") + '</div>';
    root.innerHTML = html;
    bindEvents();
    // If a form submit just failed validation (wrong/missing field, etc.),
    // the error banner renders at the TOP of the form — on a long form like
    // the job sheet, that's off-screen above wherever the Save button was
    // tapped from, so it was easy to tap Save, see nothing happen, and walk
    // away thinking it saved when really it silently didn't. Jump straight
    // to the message so that's no longer invisible.
    var errBanner = root.querySelector(".msg-error");
    if (errBanner) errBanner.scrollIntoView({behavior:"smooth", block:"center"});
  }

  function renderHero(){
    var who = "";
    if (state.session){
      who = '<div class="who"><div class="name">' + esc(state.session.name) + '</div><div class="role">' + (isAdmin()?"Manager":(isLead()?"Lead":"Crew")) + '</div>' +

      '</div>';

      '<div class="hero">' +
        '<div class="hero-top">' +

      '</div>'
    );
  }

  // ---------- SETUP (first run) ----------

  // ---------- LOGIN ----------

  function renderLoginPinBlock(crewMember){

  // ---------- EMPLOYEE / LOG APP ----------
  function renderEmployeeApp(){
    var me = state.session.name;
    var html = "";

    if (state.logView === "new"){
      var newDraft = state.continuingDraftId ? loadDrafts(me).filter(function(d){ return d.id === state.continuingDraftId; })[0] : null;
      html += renderJobForm({mode:"new", draft:newDraft});
      return html + renderRecentForMe(me);
    }
    if (state.logView === "update" && state.updateJobId){
      var job = state.jobs.filter(function(j){ return j.id === state.updateJobId; })[0];
      if (job){
        var updateDraft = state.continuingDraftId ? loadDrafts(me).filter(function(d){ return d.id === state.continuingDraftId; })[0] : null;
        html += renderJobForm({mode:"update", job:job, draft:updateDraft});
        return html + renderRecentForMe(me);
      }
    }
    if (state.logView === "leave"){
      html += renderLeaveForm({mode:"new"});
      return html + renderRecentForMe(me);
    }
    if (state.logView === "timesheet"){
      html += renderMyTimesheet(me);
      return html;
    }
    if (state.logView === "calendar"){
      html += renderMyCalendar(me);
      return html;
    }

    var myScheduledCount = state.schedule.filter(function(s){ return !s.trashed && s.employeeName === me; }).length;

    // Drafts only ever live on THIS device (localStorage, not Firestore —
    // see draftsKey above), so they stay out of management's view entirely
    // until submitted for real.
    var myDrafts = loadDrafts(me);
    if (myDrafts.length){
      html += '<div class="card">';
      html += '<div class="section-title">Drafts (' + myDrafts.length + ')</div>';
      html += '<p class="section-sub">Saved on this device only &mdash; management can\'t see these until you submit or discard them.</p>';
      myDrafts.forEach(function(d){
        var draftTitle;
        if (d.mode === "update"){
          var dJob = state.jobs.filter(function(x){ return x.id === d.jobId; })[0];
          draftTitle = dJob ? esc(dJob.venue) : "Update to a job";
        } else {
          draftTitle = d.venue ? esc(d.venue) : "New job (no venue yet)";
        }
        html += '<div class="job-card" style="margin-top:10px">';
        html += '<div class="job-head"><div>';
        html += '<div class="log-venue">' + draftTitle + '</div>';
        html += '<div class="hint">' + (d.jobDescription ? esc(d.jobDescription) : "Nothing written yet") + (d.date ? ' &middot; ' + fmtShort(d.date) : '') + '</div>';
        html += '</div></div>';
        if (state.trashConfirmDraftId === d.id){
          html += '<div class="log-foot">';
          html += '<span class="hint" style="margin-right:auto">Discard this draft?</span>';
          html += '<button type="button" class="btn btn-primary btn-sm" style="background:#b3261e; border-color:#b3261e;" data-confirm-discard-draft="'+esc(d.id)+'">Yes, discard it</button>';
          html += '<button type="button" class="btn btn-ghost btn-sm" data-action="cancel-discard-draft">Cancel</button>';
          html += '</div>';
        } else {
          html += '<div class="log-foot">';
          html += '<button type="button" class="btn btn-primary btn-sm" data-continue-draft="'+esc(d.id)+'">Continue</button>';
          html += '<button type="button" class="btn btn-ghost btn-sm" style="color:#b3261e; margin-left:auto" data-ask-discard-draft="'+esc(d.id)+'">Discard</button>';
          html += '</div>';
        }
        html += '</div>';
      });
      html += '</div>';
    }

    html += '<div class="card">';
    html += '<div class="section-title">Your jobs</div>';
    html += '<p class="section-sub">Not finished yet? Add an update instead of starting a new one. Taking sick, annual, or trade-school leave? Use the leave button instead — it\'s not a job.</p>';
    html += '<button class="btn btn-primary btn-block" style="margin-bottom:8px" data-action="new-job">Start a new job</button>';
    html += '<button class="btn btn-outline btn-block" style="margin-bottom:8px" data-action="new-leave">Add a leave day</button>';
    html += '<button class="btn btn-outline btn-block" style="margin-bottom:8px" data-action="view-timesheet">View your timesheet</button>';
    html += '<button class="btn btn-outline btn-block" style="margin-bottom:14px" data-action="view-calendar">View your calendar'+(myScheduledCount?' ('+myScheduledCount+')':'')+'</button>';

    var mine = myJobs(me);
    var notFinished = mine.filter(function(j){ return !j.myDone; });
    var doneJobs = mine.filter(function(j){ return j.myDone; });
    var tab = state.crewJobsTab === "completed" ? "completed" : "open";

    html += '<div class="subtabs">' +
      '<button data-crew-jobs-tab="open" class="'+(tab==="open"?"on":"")+'">Not finished ('+notFinished.length+')</button>' +
      '<button data-crew-jobs-tab="completed" class="'+(tab==="completed"?"on":"")+'">Completed ('+doneJobs.length+')</button>' +
    '</div>';

    var list = tab === "completed" ? doneJobs : notFinished;
    if (mine.length === 0){
      html += '<p class="empty-note">No jobs logged yet.</p>';
    } else if (list.length === 0){
      html += '<p class="empty-note">'+(tab==="completed" ? "Nothing completed yet." : "Nothing outstanding — nice work.")+'</p>';
    } else {
      list.forEach(function(j){ html += renderJobCard(j, {employeeView:true}); });
    }
    html += '</div>';
    html += renderRecentLeaveForMe(me);
    return html;
  }

  // All jobs this person has been on, one card per job (latest status), open/follow-up-needed first.
  // "Done from their own point of view" is based on THEIR latest visit to the
  // job (completed, or they flagged their part done), not the job's overall
  // open/closed state — a job can still be open for whoever's picking it up
  // next while no longer sitting under this person's own Not Finished list.
  function myJobs(me){
    var seenJobs = {}, mine = [];
    state.jobLogs.forEach(function(l){
      if (l.trashed || !l.employees || l.employees.indexOf(me) === -1) return;
      var key = l.jobId || l.id;
      if (seenJobs[key]) return;
      seenJobs[key] = true;
      var job = state.jobs.filter(function(j){ return j.id === key; })[0];
      if (job && !job.trashed && !job.mergedInto) mine.push(Object.assign({}, job, { myDone: !!(l.completed || l.crewDone) }));
    });
    mine.sort(function(a,b){
      var aOpen = !a.myDone, bOpen = !b.myDone;
      if (aOpen !== bOpen) return aOpen ? -1 : 1;
      return (b.lastUpdatedAt||b.createdAt||"").localeCompare(a.lastUpdatedAt||a.createdAt||"");
    });
    return mine;
  }

  function renderJobForm(opts){
    var job = opts.job, log = opts.log || {};

    // brand-new or continued-update job sheet prefills from a saved draft
    // instead, when there is one — same field names either way, so every
    // "isEdit ? log.X : default" below also doubles as "resume my draft".
    var prefill = isEdit ? log : (opts.draft || null);
    var titles = {"new":"Start a new job", "update":"Add an update", "edit":"Edit this update"};

      '<button type="button" data-val="no" class="'+(!othersBeforeVal?"on":"")+'">No</button>' +
      '<button type="button" data-val="yes" class="'+(othersBeforeVal?"on":"")+'">Yes</button>' +
    '</div></div>';

    if (opts.mode === "new"){
      html += field("Venue / job site", '<div class="autocomplete-wrap"><input type="text" id="job-venue-input" name="venue" value="'+(prefill?esc(prefill.venue||""):"")+'" placeholder="e.g. 14 Marlow St — pump station" autocomplete="off" required>' +

    html += field("Job description", '<textarea name="jobDescription" placeholder="What is/was the work" required>'+(prefill?esc(prefill.jobDescription||""):"")+'</textarea>');

    html += '<div class="row2">';
    html += field("Date", '<input type="date" name="date" value="'+esc(prefill?(prefill.date||todayStr()):todayStr())+'" required>');
    html += field("Hours worked", '<input type="text" name="hours" value="'+esc(prefill?(prefill.hours||""):"")+'" placeholder="e.g. 6.5 or 6.5h" required>');
    html += '</div>';
    html += '<div class="field"><label>Time</label>' +
      '<input type="text" name="timeRange" value="'+(prefill?esc(prefill.timeRange||""):"")+'" placeholder="e.g. 7am–10am">' +
      '<p class="hint" style="margin:4px 0 0">Working past 3:30pm? Write the time — that\'s overtime and we need it for invoicing.</p>' +
    '</div>';

    var loggedUnder = isEdit ? (log.submittedBy || (log.employees && log.employees[0]) || "") : state.session.name;
    html += '<div class="field"><label>Logged under</label><p class="hint" style="margin:2px 0 0">'+esc(loggedUnder)+'\'s timesheet. Ticking or typing someone else\'s name here won\'t add hours to their sheet.</p></div>';

    // Who else was onsite is now a required choice, not a field someone can
    // just skip past — either name whoever else was there, or explicitly say
    // it was a solo job. Existing entries logged before this was required
    // (alsoOnsite blank, no ALONE_TEXT) start with neither option picked, so

    var alsoOnsiteMode = "";

    '</div></div>';
    html += '<div id="also-onsite-name-field" style="display:'+(alsoOnsiteMode==="with"?"block":"none")+'">' +

    '</div>';

    if (isAdmin()){

    // Three states, not two: fully "Completed" closes the job for everyone;

    // finished, but THIS crew member personally won't be going back to it,
    // so it should drop off their own Not Finished list without marking the

    html += '<div id="followup-fields" style="display:'+(jobStatusVal==="no"?"block":"none")+'">';
    var returnUnsureVal = prefill ? !!prefill.returnUnsure : false;
    html += '<div class="field"><label>Estimated return date</label>' +
      '<input type="date" id="estimated-return-input" name="estimatedReturn" value="'+esc(prefill?(prefill.estimatedReturn||""):"")+'" '+(returnUnsureVal?"disabled":"")+'>' +
      '<button type="button" id="return-unsure-btn" class="btn btn-outline btn-sm'+(returnUnsureVal?" on":"")+'" style="margin-top:6px" data-on="'+(returnUnsureVal?"1":"")+'">'+(returnUnsureVal?"✓ Not sure yet":"Not sure yet")+'</button>' +
      '<input type="hidden" name="returnUnsure" value="'+(returnUnsureVal?"1":"")+'">' +
    '</div>';
    html += field("Work still to do", '<textarea name="remainingWork" placeholder="What\'s left to finish next visit">'+(prefill?esc(prefill.remainingWork||""):"")+'</textarea>');
    html += '</div>';

    var handoffUnsureVal = prefill ? !!prefill.handoffUnsure : false;
    html += '<div id="handoff-fields" style="display:'+(jobStatusVal==="mine"?"block":"none")+'">';
    html += '<div class="field"><label>Who else is going back?</label>' +
      '<input type="text" id="handoff-input" name="handoffTo" value="'+(prefill?esc(prefill.handoffTo||""):"")+'" placeholder="e.g. Charlotte" '+(handoffUnsureVal?"disabled":"")+'>' +
      '<button type="button" id="handoff-unsure-btn" class="btn btn-outline btn-sm'+(handoffUnsureVal?" on":"")+'" style="margin-top:6px" data-on="'+(handoffUnsureVal?"1":"")+'">'+(handoffUnsureVal?"✓ Unsure":"Unsure")+'</button>' +
      '<input type="hidden" name="handoffUnsure" value="'+(handoffUnsureVal?"1":"")+'">' +
    '</div>';

    html += '<button type="submit" class="btn btn-primary btn-block" '+(state.formBusy?"disabled":"")+'>'+(state.formBusy?"Sending…":(isEdit?"Save changes":"Submit job sheet"))+'</button>';
    // Edit mode is for a visit already sitting in Firestore — there's
    // nothing to "draft" there, so this only shows for a fresh/update sheet.

      html += '<button type="button" id="save-draft-btn" class="btn btn-outline btn-block" style="margin-top:8px" '+(state.formBusy?"disabled":"")+'>Save as draft</button>';
      html += '<p class="hint" style="margin:6px 0 0; text-align:center">Saved only on this device &mdash; management won\'t see it until you submit.</p>';
    }
    html += '</form></div>';
    return html;
  }

  function renderEditLogView(){
    var log = state.jobLogs.filter(function(l){ return l.id === state.editLogId; })[0];
    if (!log){ return '<div class="card"><p class="empty-note">That entry isn\'t there anymore.</p><button type="button" class="btn btn-outline" data-action="back-to-list">&larr; Back</button></div>'; }
    // Crew can edit a visit while its date is still in the current work week
    // or the one just before it — stops timesheets shifting any further back
    // than that once a week's closed out. Management isn't limited by this
    // (checked here, not just by hiding the button, so it still holds even
    // if the button was clicked before the window closed).
    if (!isAdmin() && !isInEditableWeek(log.date)){
      return '<div class="card"><p class="empty-note">That entry is from more than a week ago now, so it can\'t be edited here anymore — ask a manager if it needs a correction.</p><button type="button" class="btn btn-outline" data-action="back-to-list">&larr; Back</button></div>';

  // Every venue that's ever been used, most-recent first, deduplicated. Not
  // capped here — the autocomplete dropdown that uses this filters by what's
  // typed and only shows the top few matches, so a long history is fine.
  function uniqueVenues(){
    var seen={}, out=[];
    visibleJobs().forEach(function(j){ if (j.venue && !seen[j.venue]){ seen[j.venue]=1; out.push(j.venue); } });
    return out;
  }

  function field(label, inputHtml){ return '<div class="field"><label>'+esc(label)+'</label>'+inputHtml+'</div>'; }

  // ---------- Venue name similarity (for suggested merge matches) ----------
  // A cheap word-overlap + substring heuristic — not real fuzzy matching,
  // but enough to surface "Deer Park" next to "Deer Park Hotel", or "14
  // Marlow St" next to "Marlow Street", without pulling in a library for a
  // single-file app.
  function normalizeVenue(v){
    return (v||"").toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
  }
  function venueSimilarity(a, b){
    var na = normalizeVenue(a), nb = normalizeVenue(b);
    if (!na || !nb) return 0;
    if (na === nb) return 1;
    if (na.indexOf(nb) !== -1 || nb.indexOf(na) !== -1) return 0.9;
    var wa = na.split(" ").filter(function(w){ return w.length > 2; });
    var wb = nb.split(" ").filter(function(w){ return w.length > 2; });
    if (!wa.length || !wb.length) return 0;
    var shared = wa.filter(function(w){ return wb.indexOf(w) !== -1; }).length;
    return shared / Math.max(wa.length, wb.length);
  }
  // Other visible jobs whose venue looks like the same place as source's —
  // shown first in the merge picker, before anyone has typed a search.
  function suggestedMergeCandidates(source){
    return visibleJobs()
      .filter(function(j){ return j.id !== source.id; })
      .map(function(j){ return {job:j, score: venueSimilarity(source.venue, j.venue)}; })
      .filter(function(r){ return r.score >= 0.34; })
      .sort(function(a,b){ return b.score - a.score; })
      .slice(0,5)
      .map(function(r){ return r.job; });
  }

  function renderRecentForMe(me){
    // state.jobLogs is newest-first, so keeping the first entry seen per job
    // shows each job's CURRENT status once, instead of a stale older entry.
    var seenJobs = {}, mine = [];
    state.jobLogs.forEach(function(l){
      if (l.trashed || !l.employees || l.employees.indexOf(me) === -1) return;
      var key = l.jobId || l.id;
      if (seenJobs[key]) return;
      seenJobs[key] = true;
      var job = state.jobs.filter(function(j){ return j.id === l.jobId; })[0];
      if (job && (job.trashed || job.mergedInto)) return;
      mine.push(l);
    });
    mine = mine.slice(0,8);
    var html = '<div class="card"><div class="section-title" style="font-size:17px">Your recent jobs</div>';
    if (mine.length === 0){ html += '<p class="empty-note">Nothing logged yet.</p>'; }
    else { mine.forEach(function(l){ html += renderLogCard(l, {compact:true, editable:true}); }); }
    html += '</div>';
    html += renderRecentLeaveForMe(me);
    return html;
  }

  function renderRecentLeaveForMe(me){
    var mine = state.leaveLogs.filter(function(l){ return l.employee === me && !l.trashed; })
      .slice().sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); }).slice(0,5);
    if (mine.length === 0) return "";
    var html = '<div class="card"><div class="section-title" style="font-size:17px">Your recent leave</div>';
    mine.forEach(function(l){
      html += '<div class="log-card"><div class="log-top"><div><div class="log-venue">'+esc(leaveLabel(l.type))+'</div>' +
        '<div class="log-meta">'+fmtDay(l.date)+' &middot; <span class="mono">'+leaveHours(l.type).toFixed(1)+'h</span></div></div></div>';
      if (state.trashConfirmLeaveId === l.id){
        html += '<div class="msg msg-error" style="margin-top:8px">Delete this leave day? It\'ll disappear from your timesheet — if that\'s a mistake, ask a manager to restore it.</div>';
        html += '<div class="log-foot" style="gap:8px">' +
          '<button type="button" class="btn btn-primary btn-sm" style="background:#b3261e; border-color:#b3261e;" data-confirm-trash-leave="'+esc(l.id)+'">Yes, delete it</button>' +
          '<button type="button" class="btn btn-ghost btn-sm" data-action="cancel-trash-leave">Cancel</button>' +
        '</div>';
      } else {
        html += '<div class="log-foot">' +
          '<button type="button" class="btn btn-ghost btn-sm" data-edit-leave="'+esc(l.id)+'">Edit</button>' +
          '<button type="button" class="btn btn-ghost btn-sm" style="color:#b3261e; margin-left:auto" data-ask-trash-leave="'+esc(l.id)+'">Delete</button>' +
        '</div>';
      }

    });
